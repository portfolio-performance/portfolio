<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="${/META-INF/css/THEME.css}">
</head>
<body>
<script src="${/META-INF/js/d3.min.js}"></script>
<script src="${/META-INF/js/pp.js}"></script>
<script>
window.addEventListener('load', createFlare);

function createFlare(){	
pp.onResizeEnd(function() {
  width = pp.getInnerWidth();
  height = pp.getInnerHeight();
  radius = (Math.min(width, height) / 2) - 10;

  d3.select("svg")
    .attr("width", width)
    .attr("height", height);

  svg.attr("transform", "translate(" + width / 2 + "," + (height / 2) + ")");

  flare.click(node);
});

var width = pp.getInitialWidth(),
    height = pp.getInitialHeight(),
    radius = (Math.min(width, height) / 2) - 10;

var x = d3.scale.linear()
    .range([0, 2 * Math.PI]);

var y = d3.scale.linear()
    .range([0, radius]);

var tooltip = d3.select("body").append("div")
    .attr("class", "tooltip")
    .style("opacity", 0);

var svg = d3.select("body").append("svg")
    .attr("width", width)
    .attr("height", height)
    .append("g")
    .attr("transform", "translate(" + width / 2 + "," + (height / 2) + ")");

var partition = d3.layout.partition()
    .sort(null)
    .value(function(d) { return d.value; });

var arc = d3.svg.arc()
    .startAngle(function(d) { return Math.max(0, Math.min(2 * Math.PI, x(d.x))); })
    .endAngle(function(d) { return Math.max(0, Math.min(2 * Math.PI, x(d.x + d.dx))); })
    .innerRadius(function(d) { return Math.max(0, y(d.y)); })
    .outerRadius(function(d) { return Math.max(0, y(d.y + d.dy)); });

// Keep track of the node that is currently being displayed as the root.
var node;
var root;

// Key of the segment below the mouse (shown in the tooltip)
var hoveredKey = null;

var flare = {
  isInitialized: false,

  // Builds the chart on the first call. Later calls update the existing
  // elements instead of reloading the page (which flashes a white page).
  update: function(content) {
    var data = JSON.parse(content);
    var nodes = partition.nodes(data);
    assignKeys(data, data.uuid);

    // remember the current geometry to animate from it
    var previous = {};
    svg.selectAll("path").each(function(d) { previous[d.key] = d; });

    // stay zoomed into the node shown before if it still exists
    var zoomKey = node ? node.key : null;
    root = data;
    node = root;
    var hovered = null;

    nodes.forEach(function(d) {
      var p = previous[d.key];
      d.x0 = p ? p.x0 : d.x;
      d.dx0 = p ? p.dx0 : 0;
      d.y0 = p ? p.y0 : d.y;
      d.dy0 = p ? p.dy0 : d.dy;
      if (d.key === zoomKey)
        node = d;
      if (d.key === hoveredKey)
        hovered = d;
    });

    // refresh the tooltip of the hovered segment or hide it if it is gone
    if (hoveredKey !== null) {
      if (hovered && hovered.caption) {
        tooltip.html(hovered.caption);
      } else {
        hoveredKey = null;
        tooltip.transition()
          .duration(250)
          .style("opacity", 0);
      }
    }

    var shown = {};
    markShown(node, shown);

    // scales of the zoomed node after the update
    var xs = x.copy().domain([node.x, node.x + node.dx]);
    var ys = y.copy().domain([node.y, 1]).range([node.y ? 20 : 0, radius]);

    var key = function(d) { return d.key; };
    var tween = this.isInitialized ? updateTween(nodes, xs, ys) : null;

    this.path = svg.selectAll("path").data(nodes, key);

    this.path.exit().remove();

    this.path.enter()
      .insert("path", "text")
      .on("click", this.click)
      .on("mouseover", this.mouseover)
      .on("mousemove", this.mousemove)
      .on("mouseout", this.mouseout);

    this.path.style("fill", function(d) { return d.color });

    if (this.isInitialized) {
      this.path.transition()
        .duration(300)
        .attrTween("d", function(d) {
          return function(t) {
            var b = tween(d, t);
            d.x0 = b.x;
            d.dx0 = b.dx;
            d.y0 = b.y;
            d.dy0 = b.dy;
            return arc(b);
          };
        });
    } else {
      x.domain(xs.domain());
      y.domain(ys.domain()).range(ys.range());
      this.path.attr("d", arc).each(stash);
    }

    this.text = svg.selectAll("text").data(nodes, key);

    this.text.exit().remove();

    this.text.enter()
      .append("text")
      .attr("dy", ".2em")
      .attr("transform", function(d) { return labelTransform(d, xs, ys); })
      .on("click", this.click)
      .on("mouseover", this.mouseover)
      .on("mousemove", this.mousemove)
      .on("mouseout", this.mouseout)
      .append("tspan")
      .attr("x", 0);

    this.text
      .style("fill", function(d) {
        return brightness(d3.rgb(d.color)) < 125 ? "#eee" : "#000";
      })
      .style("fill-opacity", function(d) { return shown[d.key] ? 1 : 1e-6; })
      .style("visibility", function(d) {
        return isBigEnoughWith(d, xs) && shown[d.key] ? null : "hidden";
      })
      .attr("text-anchor", function(d) { return labelAnchor(d, xs); });

    this.text.select("tspan")
      .text(function(d) { return croppedWith(d, ys); });

    if (this.isInitialized) {
      this.text.transition()
        .duration(300)
        .attrTween("transform", function(d) {
          return function(t) { return labelTransform(tween(d, t), x, y); };
        });
    } else {
      this.text.attr("transform", function(d) { return labelTransform(d, xs, ys); });
    }

    this.isInitialized = true;
  },

  click: function(d) {
	if (!d.caption)
	    return;

    node = d;

    if (typeof onItemSelected === 'function') {
      onItemSelected(d.uuid);
    }

    // the zoom draws the final geometry. Reset the origin of the arcs when
    // the zoom starts (and interrupts a running update) so that the next
    // update does not start from an intermediate origin.
    flare.path.transition()
      .duration(1000)
      .each("start", stash)
      .attrTween("d", arcTweenZoom(d));

    // Somewhat of a hack as we rely on arcTween updating the scales.
    flare.text.style("visibility", function(e) {
          return isBigEnough(e) && isParentOf(d, e) ? null : d3.select(this).style("visibility");
        })
      .transition()
      .duration(1000)
      .attrTween("text-anchor", function(d) {
          return function() {
            return x(d.x + d.dx / 2) > Math.PI ? "end" : "start";
          };
      })
      .attrTween("transform", function(d) {
          return function() {
            var angle = x(d.x + d.dx / 2) * 180 / Math.PI - 90;
            return "rotate(" + angle + ")translate(" + (y(d.y) + 5) + ")rotate(" + (angle > 90 ? -180 : 0) + ")";
          };
        })
      .style("fill-opacity", function(e) { return isParentOf(d, e) ? 1 : 1e-6; })
      .each("end", function(e) {
          // check against the current zoom node: an update during the zoom
          // binds new data to the labels
          d3.select(this)
            .style("visibility", isBigEnough(e) && isParentOf(node, e) ? null : "hidden")
            .select("tspan").text(cropped(e));
      });
  },

  mouseover: function(d) {
    if (!d.caption)
      return;

    hoveredKey = d.key;

    tooltip.transition()
      .duration(250)
      .style("opacity", 1);

    tooltip.html(d.caption)
        .style("left", (d3.event.pageX + 6) + "px")
        .style("top", (d3.event.pageY - 20) + "px");
  },

  mousemove: function(d) {
	if (!d.caption)
	    return;

    tooltip
        .style("left", (d3.event.pageX + 6) + "px")
        .style("top", (d3.event.pageY - 20) + "px");
  },

  mouseout: function(d) {
    hoveredKey = null;

    tooltip.transition()
      .duration(250)
      .style("opacity", 0);
  }
}

function cropped(d) {
  return croppedWith(d, y);
}

function croppedWith(d, ys) {
  if (!d.depth)
    return "";

  var available = (Math.max(0, ys(d.y + d.dy)) - Math.max(0, ys(d.y))) / 7;
  if (d.name.length <= available)
    return d.name;
  else
    return d.name.substring(0, available) + "...";
}

function isBigEnough(d) {
  return isBigEnoughWith(d, x);
}

function isBigEnoughWith(d, xs) {
  var startAngle = Math.max(0, Math.min(2 * Math.PI, xs(d.x)));
  var endAngle = Math.max(0, Math.min(2 * Math.PI, xs(d.x + d.dx)));
  return d.depth && (endAngle - startAngle) > (2 * Math.PI / 100);
}

// A security assigned to several classifications appears several times in
// the tree (as do the placeholders if securities are excluded). Therefore the
// elements are identified by their path from the root instead of the uuid.
function assignKeys(d, key) {
  d.key = key;
  if (!d.children)
    return;

  var count = {};
  d.children.forEach(function(c) {
    var id = "$" + c.uuid;
    count[id] = (count[id] || 0) + 1;
    assignKeys(c, key + "/" + c.uuid + "#" + count[id]);
  });
}

function markShown(d, shown) {
  shown[d.key] = true;
  if (d.children)
    d.children.forEach(function(c) { markShown(c, shown); });
}

function labelAnchor(d, xs) {
  return xs(d.x + d.dx / 2) > Math.PI ? "end" : "start";
}

function labelTransform(d, xs, ys) {
  var angle = xs(d.x + d.dx / 2) * 180 / Math.PI - 90;
  return "rotate(" + angle + ")translate(" + (ys(d.y) + 5) + ")rotate(" + (angle > 90 ? -180 : 0) + ")";
}

// Setup for switching data: stash the old values for transition.
function stash(d) {
  d.x0 = d.x;
  d.dx0 = d.dx;
  d.y0 = d.y;
  d.dy0 = d.dy;
}

// When updating the data: interpolate the arcs in data space and the scales
// to the zoomed node. Returns the geometry of a node at time t.
function updateTween(nodes, xs, ys) {
  var xd = d3.interpolate(x.domain(), xs.domain()),
      yd = d3.interpolate(y.domain(), ys.domain()),
      yr = d3.interpolate(y.range(), ys.range());

  var interpolators = {};
  nodes.forEach(function(d) {
    interpolators[d.key] = d3.interpolate({x: d.x0, dx: d.dx0, y: d.y0, dy: d.dy0},
                                          {x: d.x, dx: d.dx, y: d.y, dy: d.dy});
  });

  return function(d, t) {
    x.domain(xd(t));
    y.domain(yd(t)).range(yr(t));
    return interpolators[d.key](t);
  };
}

// When zooming: interpolate the scales.
function arcTweenZoom(d) {
  var xd = d3.interpolate(x.domain(), [d.x, d.x + d.dx]),
      yd = d3.interpolate(y.domain(), [d.y, 1]),
      yr = d3.interpolate(y.range(), [d.y ? 20 : 0, radius]);
  return function(d, i) {
    return i
        ? function(t) { return arc(d); }
        : function(t) { x.domain(xd(t)); y.domain(yd(t)).range(yr(t)); return arc(d); };
  };
}

function isParentOf(p, c) {
  if (p === c) return true;
  if (p.children) {
    return p.children.some(function(d) {
      return isParentOf(d, c);
    });
  }
  return false;
}

// http://www.w3.org/WAI/ER/WD-AERT/#color-contrast
function brightness(rgb) {
  return rgb.r * .299 + rgb.g * .587 + rgb.b * .114;
}

flare.update(loadData());

// expose global update function for external calls
window.updateChart = function() {
  flare.update(loadData());
};
}
</script>
</body>
</html>
