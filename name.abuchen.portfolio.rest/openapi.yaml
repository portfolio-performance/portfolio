          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/performance/instruments/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: getInstrumentPerformance
      tags: [Performance]
      summary: One instrument's performance over the interval
      description: |
        A member lookup of `GET .../performance/instruments`: it returns exactly
        the item the collection would contain, with the item's fields merged
        into the same context object and no `items` array. If the collection
        would not contain the instrument, there is nothing to return, hence the
        two distinct 404s below.

        This route is genuinely cheaper than the collection, but for one reason:
        the daily series behind `timeWeighted` and `risk` is built per
        instrument and on demand, so serializing one instrument leaves the other
        series unbuilt.

        Note that `reportingCurrency` and `currencyCode` sit next to each other
        here and mean different things — see `MonetaryValue.currency`.

        `fxWarnings` and `fxStaleRates` cover the conversions behind this
        instrument's figures and those made while the file's shared calculation
        is built, so they can name a pair that only another instrument was
        converted with. Figures of other instruments are not computed for this
        response, and conversions only they need are not covered: an empty list
        says nothing fell back or used a stale rate for this instrument, not
        for the file - the collection covers the file.
      parameters:
        - $ref: "#/components/parameters/OpeningDate"
        - $ref: "#/components/parameters/ClosingDate"
        - $ref: "#/components/parameters/ReportingCurrency"
        - $ref: "#/components/parameters/InstrumentCostMethod"
        - $ref: "#/components/parameters/TaxesAndFees"
        - $ref: "#/components/parameters/Metrics"
      responses:
        "200":
          description: The instrument's performance over the interval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InstrumentPerformanceContext"
                  - $ref: "#/components/schemas/InstrumentPerformance"
              examples:
                default:
                  value:
                    openingDate: "2025-01-01"
                    closingDate: "2025-12-31"
                    timeWeightedUntil: "2025-12-31"
                    reportingCurrency: EUR
                    costMethod: fifo
                    taxesAndFees: included
                    metrics: [valuation]
                    # one pair with nothing to convert with: its ARS amounts are
                    # shown at face value, not exchanged into EUR. USD would be
                    # the more familiar example, but the built-in ECB series
                    # covers it, so it would not be a fallback.
                    fxWarnings:
                      - currency: ARS
                        reportingCurrency: EUR
                        reason: no-series
                    fxStaleRates: []
                    uuid: 5c1a0b7e-3d4f-4a2b-9c8e-1f0a2b3c4d5e
                    name: iShares Core MSCI World
                    currencyCode: USD
                    valuation:
                      shares: 152.5
                      openingValue: { value: 15200, currency: EUR }
                      closingValue: { value: 18432.1, currency: EUR }
                      periodCostBasis: { value: 16218.9, currency: EUR }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            Either the file or the instrument is unknown (`not-found`), or the
            instrument exists but the interval contains nothing of it —
            `no-activity-in-period`. The two call for different client
            behaviour: correct the id, versus report that nothing was held.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/transactions:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List the bookings of the file
      description: |
        One row per transaction as it was recorded: deposits and removals,
        interest, dividends, fees and taxes, purchases, sales and transfers.
        Where `/trades` answers how a position did, this answers what happened
        on a day - and nothing else in this API reaches a deposit or a fee.

        Rows come back **oldest first**. A page belongs to the period it was
        asked for: `page.nextCursor` is valid only under the same `from` and
        `to`.

        `amount` is stated in the currency the booking was made in, so a file
        holding foreign positions answers in several currencies at once - this
        read has no reporting currency. `grossAmount` comes with a security
        booking, `fees` and `taxes` only where they are not zero, and `shares`
        only where shares moved.

        For a purchase or a sale the cash side is the settlement account of the
        securities account: the file derives it, the booking does not store it.
        A transfer appears twice, once in each account it joins, and no row
        names its counterpart. Cash bookings and security bookings are two
        families of types; `TRANSFER_IN` and `TRANSFER_OUT` exist in both.
      parameters:
        - name: from
          in: query
          required: false
          description: |
            First day of the period, inclusive, as YYYY-MM-DD. A booking on
            this day is part of the answer. Without it, no lower bound.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: |
            Last day of the period, inclusive, as YYYY-MM-DD, on or after
            `from`. Without it, no upper bound.
          schema:
            type: string
            format: date
        - name: cashAccount
          in: query
          required: false
          description: |
            Only bookings with a side in this cash account, as its uuid. For a
            purchase or a sale that is the settlement account of the securities
            account, stated as `referenceCashAccount` by the investment-accounts
            resource.
          schema:
            type: string
        - name: investmentAccount
          in: query
          required: false
          description: |
            Only the bookings of this securities account, as its uuid. A
            deposit, a fee or interest is booked in a cash account and never
            matches this filter.
          schema:
            type: string
        - name: instrument
          in: query
          required: false
          description: |
            Only bookings naming this instrument, as its uuid: the purchase, the
            sale, the dividend, and the fees and taxes attached to them.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: |
            Only these types, comma-separated and case-insensitive, as the
            `type` field spells them. An unknown name fails as a field error
            that lists all of them.
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The bookings of the file, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [date, time, type, uuid, amount]
                      properties:
                        date:
                          type: string
                          format: date
                          description: The day the booking was recorded
                        time:
                          type: string
                          description: |
                            The time of day as HH:mm:ss. The order of the list
                            follows date and time together.
                        type:
                          type: string
                          description: |
                            One of the types of the family the booking belongs
                            to, spelled as in the application.
                        uuid:
                          type: string
                          description: |
                            The identity of the booking itself, stable across
                            calls and different for the two sides of a transfer.
                        instrument:
                          type: object
                          description: The security the booking is about
                          required: [uuid, name]
                          properties:
                            uuid:
                              type: string
                            name:
                              type: string
                        amount:
                          type: object
                          description: |
                            What was booked, in the currency of the booking. On
                            a purchase or a sale this is the amount the cash
                            account moved by, charges included.
                          required: [value, currency]
                          properties:
                            value:
                              type: number
                            currency:
                              type: string
                        shares:
                          type: number
                          description: |
                            Only where the booking moved shares; absent for a
                            booking that moved nothing but money.
                        grossAmount:
                          type: object
                          description: |
                            Only with a security booking: the value of the
                            shares before charges, so that `amount` less
                            `grossAmount` accounts for fees and taxes.
                          required: [value, currency]
                          properties:
                            value:
                              type: number
                            currency:
                              type: string
                        fees:
                          type: object
                          description: Only when not zero
                          required: [value, currency]
                          properties:
                            value:
                              type: number
                            currency:
                              type: string
                        taxes:
                          type: object
                          description: Only when not zero
                          required: [value, currency]
                          properties:
                            value:
                              type: number
                            currency:
                              type: string
                        cashAccount:
                          type: object
                          description: |
                            The cash account on the money side: the owner of a
                            cash booking, the settlement account of a security
                            booking.
                          required: [uuid, name]
                          properties:
                            uuid:
                              type: string
                            name:
                              type: string
                        investmentAccount:
                          type: object
                          description: Only with a security booking
                          required: [uuid, name]
                          properties:
                            uuid:
                              type: string
                            name:
                              type: string
                        note:
                          type: string
                          description: Only when the booking carries one
                  page:
                    $ref: "#/components/schemas/Page"
        "400":
          description: |
            A named account or instrument is not of this file, a `type` filter
            names no booking, or the two dates ask for a period the other way
            round.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /v1/files/{file}/trades:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listTrades
      tags: [Trades]
      summary: List the file's trades
      description: |
        Every trade in the file, across all instruments and securities
        accounts. Sorted by instrument name; the trades of one instrument keep
        the order they were matched in, which is chronological.

        A trade is a set of purchases matched against the sales that closed
        them. It is **computed, not stored**: it has no identity that survives
        the next call, it cannot be created, changed or deleted through this
        API, and there is no `/trades/{id}`. To change a trade, change the
        transactions behind it. Address a trade by the filter that produced it.

        Lot matching is always FIFO; `grouping` decides how the matched lots
        are gathered into trades, it does not select a matching strategy.

        An **open** trade has no `end`. Its `exitValue`, `profitLoss` and
        `return` are a valuation at the market price of `valuationDate` rather
        than a realized result, and its `holdingPeriodDays` runs until that
        date — so two calls on different days legitimately return different
        numbers for the same trade. Use `status` to tell the two kinds apart,
        and `direction`: for a short trade profit is entry minus exit, and the
        share count is positive either way.

        A security whose transactions do not reconcile — a sale covering more
        shares than were held, a transfer of shares that are not there — is
        reported in `warnings` and contributes no trades. Note a sale into an
        account holding nothing is *not* such a case: it opens a short
        position, reported as an open trade with `direction: short`. The request still
        succeeds: one unreconcilable security, which an import can leave
        behind, must not make the resource unreadable. **A client that ignores
        `warnings` will read a partial list as a complete one.**
      parameters:
        - $ref: "#/components/parameters/TradeStatus"
        - $ref: "#/components/parameters/TradeGrouping"
        - $ref: "#/components/parameters/TradeCostMethod"
        - $ref: "#/components/parameters/TradeTaxesAndFees"
        - $ref: "#/components/parameters/ReportingCurrency"
        - $ref: "#/components/parameters/TradeFrom"
        - $ref: "#/components/parameters/TradeTo"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The file's trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradesResponse"
              examples:
                default:
                  value:
                    reportingCurrency: EUR
                    costMethod: fifo
                    taxesAndFees: included
                    grouping: combined
                    valuationDate: "2026-08-27"
                    status: [open, closed]
                    fxWarnings: []
                    fxStaleRates: []
                    warnings: []
                    items:
                      - status: closed
                        direction: long
                        instrument:
                          uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                          name: Apple Inc.
                          currencyCode: USD
                        investmentAccount:
                          uuid: 1d3f5a7c-9e0b-4c2d-8f6a-3b5d7e9f1a2c
                          name: Broker Depot
                        start: "2024-03-04T00:00:00"
                        end: "2025-11-18T00:00:00"
                        shares: 10
                        transactionCount: 2
                        entryValue: { value: 1010.5, currency: EUR }
                        exitValue: { value: 1320, currency: EUR }
                        profitLoss: { value: 309.5, currency: EUR }
                        holdingPeriodDays: 624
                        irr: 0.1782
                        return: 0.3063
                        note: rebalancing
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/instruments/{uuid}/trades:
    parameters:
