  /v1/files/{file}/cash-accounts:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listCashAccounts
      tags: [Cash accounts]
      summary: List the cash accounts in a file
      description: |
        Each account's `balance` is a plain running total of its transactions
        up to `date`, in the account's own currency — never converted, so it
        is unaffected by exchange rates.
      parameters:
        - name: date
          in: query
          required: false
          description: "The balance date (default: today)."
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The cash accounts in the file
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CashAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createCashAccount
      tags: [Cash accounts]
      summary: Create a cash account
      description: |
        Creates a cash account. `name` is required; `currencyCode` defaults to
        the file's base currency, as in the application.

        **Idempotency.** A repeated create with the same `clientRef` creates
        nothing and answers the cash account created first (`200`,
        `replayed: true`). The key is kept in memory only, until the
        application quits.

        With `?dry_run=true` nothing is created; the answer (`200`,
        `dryRun: true`) is the cash account as it would be.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashAccountCreate"
            examples:
              default:
                value:
                  name: Broker Cash
                  currencyCode: EUR
                  clientRef: cash-1
      responses:
        "200":
          description: "A dry run (`dryRun: true`) or a replayed create (`replayed: true`); nothing was changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashAccountWriteResult"
        "201":
          description: Created
          headers:
            Location:
              description: The path of the created cash account.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashAccountWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
