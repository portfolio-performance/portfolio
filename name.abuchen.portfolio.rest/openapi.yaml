openapi: 3.1.0

info:
  title: Portfolio Performance REST API
  version: 1.0.0
  license:
    name: Eclipse Public License 1.0
    identifier: EPL-1.0
  description: |
    A **local** HTTP/JSON API into the running Portfolio Performance desktop
    application, so that scripts and AI agents can read and edit the data of
    open portfolio files.

    ## How to reach it

    - Base URL `http://127.0.0.1:{port}` (default port **5712**), **loopback only**.
    - The server binds `127.0.0.1` and is **off by default**; the user enables it
      in Preferences → REST API.
    - Every request needs a **bearer token** — except the pairing endpoints below,
      whose purpose is to obtain one. See the `bearerAuth` scheme.
    - The server serves this document at `GET /v1/openapi.yaml`, unauthenticated,
      so the contract of the running server is discoverable at runtime.

    ## How to get a token (interactive pairing)

    Each client holds its own token. To obtain one:

    1. `POST /v1/auth/requests` with your program's name. The user is asked to
       approve or decline the request inside Portfolio Performance — tell them
       to look at the application.
    2. Poll `GET /v1/auth/requests/{id}` every 1–2 seconds. While the answer is
       `pending`, keep polling; the request expires after 2 minutes.
    3. On `approved`, the response carries the token — **exactly once**. Store it;
       it cannot be retrieved again. The user chooses whether the grant is
       permanent or expires when the application quits.

    Every `401` response carries the pairing endpoint in its `pairing_endpoint`
    field, so this flow is discoverable at runtime. Users can also mint a token
    manually (Preferences → REST API → "Add client") for headless setups, and can
    revoke any client there at any time.

    ## Constraints that are not expressible in this document

    These are enforced by the server but cannot be described as schema or security,
    so they are stated here. Each violation is reported as a distinct problem type
    (see the `Problem` schema):

    - **Loopback Host only.** The API must be addressed as `127.0.0.1`, `[::1]` or
      `localhost`. A request whose `Host` header names any other authority is
      rejected `403 forbidden-host`. This defeats DNS rebinding — a web page cannot
      point its own domain at 127.0.0.1 and reach the API.
    - **No browser origin.** Any request that carries an `Origin` header is rejected
      `403 browser-origin-forbidden`. A web page therefore cannot reach this API.
    - **Per-file access.** Only files the user has individually enabled are visible.
      A file that exists but is not enabled answers exactly like one that does not
      exist (`404 not-found`) — the token must not let a client enumerate files the
      user did not share.

    ## Methods

    A path serves only the methods listed for it in this document. Calling any
    method that a path does not list returns `405 method-not-allowed`.

    ## Writes are not saved automatically

    A write (`PATCH`, `DELETE`) mutates the **in-memory** file and marks it dirty,
    exactly as if the user had edited it in the UI. The change is visible
    immediately; every file reports its unsaved state in the `dirty` field of
    `GET /v1/files` and `GET /v1/files/{file}`. To persist the changes, call
    `POST /v1/files/{file}/save` — or leave it to the user, who can also discard
    the changes by closing the file without saving.

    While the user has a modal dialog open or is editing a table cell, writes
    (including save) are rejected with `423 user-interaction` rather than
    silently clobbered. This is **normal and temporary**: respect the
    `Retry-After` header and try again. Reads are unaffected.

servers:
  - url: http://127.0.0.1:{port}
    description: Loopback interface of the running application
    variables:
      port:
        default: "5712"
        description: The port configured in Preferences → REST API

security:
  - bearerAuth: []

tags:
  - name: Discovery
    description: Learn the contract before you hold a token
  - name: Pairing
    description: Obtain a bearer token interactively, approved by the user
  - name: Files
    description: The open portfolio files you are allowed to address
  - name: Instruments
    description: Securities held in a file (stocks, funds, crypto, …)
  - name: Cash accounts
    description: Accounts holding cash in a single currency
  - name: Investment accounts
    description: Accounts holding instrument positions
  - name: Holdings
    description: The statement of assets — every holding valued at a date
  - name: Taxonomies
    description: The category schemes a file classifies its holdings by.
  - name: Performance
    description: Return and value-change of the file over an interval

paths:
  /v1/openapi.yaml:
    get:
      operationId: getOpenApiDocument
      tags: [Discovery]
      summary: This API's own OpenAPI description
      description: |
        Serves this very document, so a client can discover the full contract at
        runtime. No bearer token required — the document carries no user data and
        describes the pairing flow itself, so it is reachable before you hold a
        token. The `Host` (loopback) and `Origin` (no-browser) checks still apply.

        What you get back is the description of the **running** server, so it can
        never drift from the endpoints actually served.
      security: []
      responses:
        "200":
          description: The OpenAPI document, as YAML.
          content:
            application/yaml:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/requests:
    post:
      operationId: createPairingRequest
      tags: [Pairing]
      summary: Ask the user for API access
      description: |
        Files an access request that the user answers inside Portfolio
        Performance. No bearer token required. At most one request may be
        pending at a time, and after a decline new requests are rejected for a
        cool-down period — both are reported `429` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientName]
              properties:
                clientName:
                  type: string
                  maxLength: 64
                  description: |
                    The name of your program, shown to the user in the approval
                    prompt. Control characters are stripped.
            examples:
              default:
                value:
                  clientName: Claude Code
      responses:
        "201":
          description: The request is filed and awaiting the user's decision.
          headers:
            Location:
              description: The status resource to poll.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequestCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyPairingRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/requests/{id}:
    get:
      operationId: pollPairingRequest
      tags: [Pairing]
      summary: Poll the state of an access request
      description: |
        Returns the request's state. `pending` can be read any number of times;
        a terminal state (`approved` with the token, `denied`, `expired`) is
        delivered **exactly once** — afterwards, and for ids never issued, the
        answer is `404`. Poll every 1–2 seconds.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The request id from `POST /v1/auth/requests`
          schema:
            type: string
      responses:
        "200":
          description: The state of the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequestStatus"
              examples:
                pending:
                  value:
                    status: pending
                approved:
                  value:
                    status: approved
                    token: wZ4mJc9Y3K…
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files:
    get:
      operationId: listFiles
      tags: [Files]
      summary: List the files you may address
      description: |
        Lists only files that are **open and enabled**. Address a file in the
        `{file}` path segment below by either its `id` or its `alias`.
      responses:
        "200":
          description: The addressable files
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/File"
              examples:
                default:
                  value:
                    items:
                      - id: 5f3c1e2a-0b7d-4a1e-9c2f-8d6b3a1e0f42
                        alias: main
                        label: portfolio.xml
                        path: /Users/me/portfolio.xml
                        dirty: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/open:
    post:
      operationId: openFile
      tags: [Files]
      summary: Open an enabled file in the application
      description: |
        Opens a portfolio file in the running application, as File → Open does,
        and returns it once it is loaded. Only a path the user has **enabled**
        for the API (Preferences → REST API) may be opened; any other path —
        unknown, not enabled, or no longer on disk — answers `404 not-found`,
        indistinguishable from each other.

        If the file is already open, it is returned as is (`200`). Otherwise the
        application opens it and the request waits up to 30 seconds for the file
        to load (`201`). If loading takes longer, the answer is `503
        file-loading`: the file keeps loading, retry after `Retry-After` seconds
        (a retry answers `200` once the file is open).

        The application never shows a dialog on the API's behalf: an encrypted
        file is refused with `409 password-required` — a human has to open it
        and enter the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: |
                    The absolute path of the file, exactly as the application
                    reports it in `GET /v1/files` (`path`).
            examples:
              default:
                value:
                  path: /Users/me/portfolio.xml
      responses:
        "200":
          description: The file was already open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "201":
          description: The file was opened and is loaded
          headers:
            Location:
              description: The path of the opened file, `/v1/files/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The file cannot be opened without a human: it is encrypted
            (`password-required`), or loading it failed (`open-failed`, the
            reason is in `detail`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            The file is still loading (`file-loading`). Respect `Retry-After`
            and repeat the request.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/files/{file}:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: getFile
      tags: [Files]
      summary: Read a single file
      description: The same object as one item of `GET /v1/files`, including `dirty`.
      responses:
        "200":
          description: The file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/save:
    parameters:
      - $ref: "#/components/parameters/File"
    post:
      operationId: saveFile
      tags: [Files]
      summary: Save the file
      description: |
        Persists the file at its current path in its current format (XML,
        binary, compressed or encrypted — whatever it was opened or last saved
        as), exactly as the application's Save does, including the backup copy
        if the user enabled backups. There is no "save as": no body is taken.

        `dirty` in the response is normally `false`. It can still be `true` if a
        background task (e.g. an online price update) changed the file while it
        was being saved — the saved copy may not contain that change, so the
        file stays marked as unsaved.
      responses:
        "200":
          description: The file was saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/File"
                  - type: object
                    required: [savedAt]
                    properties:
                      savedAt:
                        type: string
                        format: date-time
                        description: When the file was saved (UTC).
              examples:
                default:
                  value:
                    id: 5f3c1e2a-0b7d-4a1e-9c2f-8d6b3a1e0f42
                    alias: main
                    label: portfolio.xml
                    path: /Users/me/portfolio.xml
                    dirty: false
                    savedAt: "2026-09-24T10:15:30.123Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          description: |
            Saving failed (`save-failed`; the reason, e.g. an I/O error, is in
            `detail`), or an unexpected error (`internal-error`). The file stays
            dirty.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/files/{file}/instruments:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listInstruments
      tags: [Instruments]
      summary: List the instruments in a file
      responses:
        "200":
          description: The instruments in the file
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instrument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createInstrument
      tags: [Instruments]
      summary: Create an instrument
      description: |
        Creates an instrument from the fields of `InstrumentCreate`. `name` is
        required; `currencyCode` defaults to the file's base currency (an
        explicit `null` creates a currency-less instrument such as an index),
        `feed` to `MANUAL`. A `targetCurrencyCode` makes the instrument an
        exchange rate. Validation is the same as for a patch.

        **Idempotency.** A repeated create with the same `clientRef` creates
        nothing and answers the instrument created first (`200`,
        `replayed: true`). The key is kept in memory only, until the
        application quits.

        With `?dry_run=true` nothing is created; the answer (`200`,
        `dryRun: true`) is the instrument as it would be. Its `uuid` is not
        stable.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentCreate"
            examples:
              share:
                value:
                  name: Apple Inc.
                  currencyCode: USD
                  isin: US0378331005
                  tickerSymbol: AAPL
                  feed: YAHOO
                  clientRef: aapl
      responses:
        "200":
          description: "A dry run (`dryRun: true`) or a replayed create (`replayed: true`); nothing was changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentWriteResult"
        "201":
          description: Created; `Location` names the new instrument.
          headers:
            Location:
              description: The path of the created instrument.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/instruments/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: getInstrument
      tags: [Instruments]
      summary: Read a single instrument
      responses:
        "200":
          description: The instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
              examples:
                default:
                  value:
                    uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                    name: Apple Inc.
                    currencyCode: USD
                    isin: US0378331005
                    wkn: "865985"
                    tickerSymbol: AAPL
                    note: Core holding
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchInstrument
      tags: [Instruments]
      summary: Update an instrument (JSON Merge Patch)
      description: |
        A **JSON Merge Patch** (RFC 7386), *not* the full target state: fields you
        omit stay untouched, and an explicit `null` clears an optional field.
        Accepted as `application/json` or `application/merge-patch+json`.
        Returns the updated instrument.

        Any field that is unknown or not writable is rejected `422`, never a silent
        no-op — a typo must not look like success. All violations are reported at
        once so they can be fixed in one round-trip.

        A patch that changes nothing does not mark the file dirty. With
        `?dry_run=true` the answer is the instrument as it would be
        (`dryRun: true`), and nothing is changed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/InstrumentPatch"
            examples:
              renameAndClearNote:
                summary: Rename and clear the note
                value:
                  name: Apple
                  note: null
              switchQuoteFeed:
                summary: Load historical prices from a JSON source
                value:
                  feed: GENERIC-JSON
                  feedUrl: https://example.com/prices/{TICKER}.json
                  feedProperties:
                    GENERIC-JSON-DATE: $.data[*].date
                    GENERIC-JSON-CLOSE: $.data[*].close
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentPatch"
      responses:
        "200":
          description: The updated instrument, or the preview of a dry run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteInstrument
      tags: [Instruments]
      summary: Delete an instrument
      description: |
        Deletes the instrument. **Rejected `409 delete-blocked`** if transactions
        or investment plans reference it — deleting it in the application would
        cascade into transaction history, which the API refuses to do on a client's
        behalf. Watchlist and taxonomy membership do not block the delete; the
        instrument is removed from watchlists and taxonomies.

        With `?dry_run=true` nothing is deleted and the answer (`200`) names the
        instrument that would be removed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Dry run, the instrument that would be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePreview"
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/instruments/{uuid}/prices:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: listInstrumentPrices
      tags: [Instruments]
      summary: Read the historical quotes of an instrument
      description: |
        The price series stored in the file, oldest first, in the instrument's own
        currency — the quotes as recorded, not converted and not recomputed, so a
        chart drawn from them matches the application's own price chart.

        The latest intraday quote is merged in when the history holds no entry for
        its date, which keeps the last point current between quote updates.

        `from` and `to` are inclusive, and both are optional: an absent bound means
        the start (or end) of the recorded history. The response echoes the range it
        actually covers, so an empty tail of the requested range is distinguishable
        from a history that simply stops earlier.
      parameters:
        - name: from
          in: query
          description: Earliest date to include, inclusive. Defaults to the first price on record.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Latest date to include, inclusive. Defaults to the last price on record.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The instrument's price history over the requested range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceSeries"
              examples:
                default:
                  value:
                    uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                    currency: USD
                    from: "2024-01-02"
                    to: "2024-01-04"
                    items:
                      - date: "2024-01-02"
                        value: 185.64
                      - date: "2024-01-03"
                        value: 184.25
                      - date: "2024-01-04"
                        value: 181.91
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: upsertInstrumentPrices
      tags: [Instruments]
      summary: Add or replace historical quotes
      description: |
        Adds the given quotes to the instrument's price history. A quote for a
        date that already has one replaces it, as a manual edit in the
        application does; all other quotes are kept. Values are in the
        instrument's currency, with up to 8 decimal places, and must be
        positive; a date may appear only once per request.

        Answers how many quotes were inserted, updated or already equal. A
        request that changes nothing does not mark the file dirty. With
        `?dry_run=true` only the counts are computed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceUpsert"
            examples:
              twoDays:
                value:
                  items:
                    - date: "2026-03-02"
                      value: "101.25"
                    - date: "2026-03-03"
                      value: "102.4"
      responses:
        "200":
          description: What was (or, on a dry run, would be) changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceUpsertResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
