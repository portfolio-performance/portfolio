  /v1/files/{file}/taxonomies/{id}/allocation:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/TaxonomyId"
    get:
      operationId: getTaxonomyAllocation
      tags: [Taxonomies]
      summary: Value per category of a taxonomy at a date
      description: |
        The statement of assets at `date`, distributed over the taxonomy's
        categories as the application's taxonomy view does it: each assignment
        contributes its instrument's or cash account's valuation times the
        assignment weight, a category's `value` includes its subcategories, and
        what no category holds is `unassigned` (listed per holding with the
        unassigned weight).

        `targetValue` follows the rebalancing view: the classified assets
        (total less unassigned) split by the category weights, each level
        taking the parent's target less the parent's direct assignments.
        `deviation` is `value - targetValue`. `share` is the fraction of the
        total assets.
      parameters:
        - name: date
          in: query
          required: false
          description: The valuation date (default today).
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: The reporting currency (default the file's base currency).
          schema:
            type: string
        - $ref: "#/components/parameters/InvestmentAccountFilter"
        - $ref: "#/components/parameters/CashAccountFilter"
      responses:
        "200":
          description: The allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxonomyAllocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/transactions:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List every transaction across every account
      description: |
        Every transaction across every cash account and investment account,
        newest first. A buy/sell pair and a transfer are each recorded on both
        sides internally, but appear here only once: a buy/sell as its
        investment-account (portfolio) leg, a transfer as its outbound leg.

        The optional query parameters narrow the list; they combine with AND.
        The account filters match a transaction if **either** of its legs is
        booked on the account — a buy shows up for its cash account although it
        is listed as its investment-account leg.

        `value` is the signed net cash flow — negative for a debit (a cash
        account's removal, fee, tax, transfer-out, …) or a liquidation (an
        investment account's sell, transfer-out, delivery-outbound); positive
        otherwise. `grossValue`, `fees` and `taxes` are plain (unsigned)
        magnitudes in the transaction's own currency.
      parameters:
        - name: from
          in: query
          required: false
          description: Only transactions on or after this date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Only transactions on or before this date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: type
          in: query
          required: false
          description: |
            Only transactions of these types: one type or a comma-separated
            list, e.g. `buy,sell`. See `Transaction.type` for the values.
          schema:
            type: string
        - name: instrument
          in: query
          required: false
          description: Only transactions of the instrument with this `uuid`.
          schema:
            type: string
        - name: cashAccount
          in: query
          required: false
          description: Only transactions with a leg on the cash account with this `uuid`.
          schema:
            type: string
        - name: investmentAccount
          in: query
          required: false
          description: Only transactions with a leg on the investment account with this `uuid`.
          schema:
            type: string
      responses:
        "200":
          description: Every transaction, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
              examples:
                default:
                  value:
                    items:
                      - uuid: 1a2b3c4d-5e6f-4a1b-8c2d-3e4f5a6b7c8d
                        date: "2026-07-20T00:00"
                        type: dividends
                        value: { value: 42.5, currency: EUR }
                        grossValue: { value: 50, currency: EUR }
                        fees: { value: 0, currency: EUR }
                        taxes: { value: 7.5, currency: EUR }
                        shares: 10
                        security:
                          uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                          name: Apple Inc.
                        owner:
                          uuid: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                          name: Broker Cash
                          type: cash-account
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Create a transaction of any type
      description: |
        Creates a transaction; `type` selects the shape (see
        `TransactionCreate`). A buy/sell creates the investment-account leg and
        the cash-account leg, a transfer both legs; the answer names both
        (`uuid` and `linked.uuid`). Validation and the construction of fees,
        taxes and foreign-currency units follow the application's transaction
        dialogs; all violations are reported at once.

        **Idempotency.** With a `clientRef`, the transaction is stored with
        `source` `api:<clientRef>` on every leg. A repeated create with the same
        `clientRef` creates nothing and answers the existing transaction with
        `200` and `replayed: true`, even if the body differs.

        **Dry run.** With `?dry_run=true` nothing is changed; the answer (`200`,
        `dryRun: true`) is the fully resolved transaction: legs, currencies,
        exchange rate, units, total. Its UUIDs are not stable: a later real
        create assigns new ones.

        The change is in memory only until the file is saved
        (`POST /v1/files/{file}/save`).
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
            examples:
              buyInForeignCurrency:
                summary: Buy a USD instrument from a EUR cash account
                value:
                  type: buy
                  date: "2026-03-02T09:30"
                  clientRef: broker-2026-000123
                  investmentAccount: d9f0a1b2-4c3e-4f5a-9b8c-7d6e5f4a3b2c
                  cashAccount: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                  instrument: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                  shares: "12.5"
                  quote: "101.2"
                  exchangeRate: "0.911"
                  fees: "4.90"
              dividend:
                summary: A dividend with withheld taxes
                value:
                  type: dividends
                  date: "2026-07-20"
                  exDate: "2026-07-15"
                  cashAccount: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                  instrument: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                  shares: "10"
                  grossValue: "50.00"
                  taxes: "7.50"
              deposit:
                value:
                  type: deposit
                  date: "2026-01-02"
                  cashAccount: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                  amount: "1000"
              cashTransfer:
                summary: A transfer between a EUR and a USD cash account
                value:
                  type: cash-transfer
                  date: "2026-05-01"
                  fromCashAccount: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                  toCashAccount: e5f6a7b8-1c2d-4e3f-9a0b-1c2d3e4f5a6b
                  amount: "500.00"
                  targetAmount: "545.00"
      responses:
        "200":
          description: |
            A dry run (`dryRun: true`) or a replayed create (`replayed: true`);
            nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionWriteResult"
        "201":
          description: Created; `Location` names the new transaction.
          headers:
            Location:
              description: The path of the created transaction.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionWriteResult"
              examples:
                buyInForeignCurrency:
                  value:
                    uuid: 2b3c4d5e-6f7a-4b1c-8d2e-3f4a5b6c7d8e
                    date: "2026-03-02T09:30"
                    type: buy
                    value: { value: 1157.32, currency: EUR }
                    grossValue: { value: 1152.42, currency: EUR }
                    fees: { value: 4.9, currency: EUR }
                    taxes: { value: 0, currency: EUR }
                    shares: 12.5
                    security:
                      uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                      name: Apple Inc.
                    owner:
                      uuid: d9f0a1b2-4c3e-4f5a-9b8c-7d6e5f4a3b2c
                      name: Broker
                      type: investment-account
                    units:
                      - type: fee
                        amount: { value: 4.9, currency: EUR }
                      - type: gross-value
                        amount: { value: 1152.42, currency: EUR }
                        forex: { value: 1265, currency: USD }
                        exchangeRate: 0.911
                    source: "api:broker-2026-000123"
                    clientRef: broker-2026-000123
                    updatedAt: "2026-03-02T09:31:12.345Z"
                    linked:
                      uuid: 3c4d5e6f-7a8b-4c1d-8e2f-3a4b5c6d7e8f
                      type: buy
                      owner:
                        uuid: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                        name: Broker Cash
                        type: cash-account
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/transactions/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Read a single transaction in detail
      description: |
        The transaction as in the list, plus its units, the ex-date of a
        dividend, its source and its linked leg. The `uuid` of **either** leg of
        a buy/sell or transfer resolves; the answer is always the leg the list
        reports (the investment-account leg of a buy/sell, the outbound leg of
        a transfer), and `linked` names the other one.
      responses:
        "200":
          description: The transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDetail"
              examples:
                buyInForeignCurrency:
                  value:
                    uuid: 2b3c4d5e-6f7a-4b1c-8d2e-3f4a5b6c7d8e
                    date: "2026-03-02T09:30"
                    type: buy
                    value: { value: 1157.32, currency: EUR }
                    grossValue: { value: 1152.42, currency: EUR }
                    fees: { value: 4.9, currency: EUR }
                    taxes: { value: 0, currency: EUR }
                    shares: 12.5
                    security:
                      uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                      name: Apple Inc.
                    owner:
                      uuid: d9f0a1b2-4c3e-4f5a-9b8c-7d6e5f4a3b2c
                      name: Broker
                      type: investment-account
                    units:
                      - type: gross-value
                        amount: { value: 1152.42, currency: EUR }
                        forex: { value: 1265, currency: USD }
                        exchangeRate: 0.911
                      - type: fee
                        amount: { value: 4.9, currency: EUR }
                    source: "api:broker-2026-000123"
                    updatedAt: "2026-03-02T09:31:12.345Z"
                    linked:
                      uuid: 3c4d5e6f-7a8b-4c1d-8e2f-3a4b5c6d7e8f
                      type: buy
                      owner:
                        uuid: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                        name: Broker Cash
                        type: cash-account
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchTransaction
      tags: [Transactions]
      summary: Update a transaction (JSON Merge Patch)
      description: |
        A **JSON Merge Patch** (RFC 7386) in the vocabulary of
        `TransactionCreate`: fields you omit keep their value, an explicit
        `null` clears an optional field. Accepted as `application/json` or
        `application/merge-patch+json`. The `uuid` of either leg addresses a
        buy/sell or transfer; both legs are kept consistent and keep their
        UUIDs. Unknown fields, and fields that do not apply to the type, are
        rejected `422`.

        - **Owner change** (`cashAccount`, `investmentAccount`,
          `fromCashAccount`, ...) moves the legs; a cash-account leg can only
          move to an account in the same currency (`currency-mismatch`), as in
          the application. Moving removes the transaction from investment
          plans.
        - **Type change** only within a kind: `buy` and `sell`,
          `delivery-inbound` and `delivery-outbound`, and among `deposit`,
          `removal`, `interest`, `interest-charge`, `fees`, `fees-refund`,
          `taxes`, `tax-refund`; anything else is `not-allowed-for-type`. A
          value the new type has no field for (e.g. the `taxes` of an interest
          booking turned deposit) must be cleared with `null` in the same
          patch.
        - **Amounts** are recomputed as on create when any amount field,
          `instrument`, `currency` or `type` is patched. Changing `shares`
          keeps the gross value (pass `quote` to recompute it); patching
          `amount` alone derives the gross value from the new total; the
          exchange rate is looked up again when the currency pair changes. A
          patch of only the date, the note, the ex-date or the owners leaves
          amounts and units untouched.

        A patch that changes nothing does not mark the file dirty. With
        `?dry_run=true` the answer is the transaction as it would be
        (`dryRun: true`), and nothing is changed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/TransactionPatch"
            examples:
              moveAndAnnotate:
                summary: Move a buy to another investment account and change the note
                value:
                  investmentAccount: e1f2a3b4-5c6d-4e7f-8a9b-0c1d2e3f4a5b
                  note: moved
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionPatch"
      responses:
        "200":
          description: The updated transaction, or the preview of a dry run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteTransaction
      tags: [Transactions]
      summary: Delete a transaction including its linked leg
      description: |
        Deletes the transaction and the other leg of a buy/sell or transfer
        (either leg's `uuid` addresses it), and removes it from investment
        plans, as the application does. With `?dry_run=true` nothing is
        deleted and the answer (`200`) lists the legs that would be removed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Dry run, the legs that would be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDeletePreview"
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/holdings:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listHoldings
      tags: [Holdings]
      summary: List the file's holdings, valued at a date
      description: |
        Every holding — instrument positions and cash account balances uniformly —
        valued at the given date in the reporting currency. Instrument positions
        with zero shares at the date are omitted; cash accounts always appear,
        even with a zero balance. Items are sorted by name.

        Beyond the point-in-time valuation, each instrument position is also
        enriched with metrics over `(openingDate, date]` — cost basis, returns,
        dividends, and more. `openingDate` defaults to "since inception": the
        file's earliest transaction (across every account and investment
        account, not only this instrument's own) — an empty period for a file
        with none yet.
      parameters:
        - $ref: "#/components/parameters/InvestmentAccountFilter"
        - $ref: "#/components/parameters/CashAccountFilter"
        - name: date
          in: query
          required: false
          description: |
            The valuation date (default: today). Each instrument is valued with
            the latest price on or before this date; the holding's `price.date`
            makes the staleness visible. Future dates are allowed and value at
            the last known prices. Also the closing date of the
            `(openingDate, date]` period the enrichment metrics are computed
            over.
          schema:
            type: string
            format: date
        - name: openingDate
          in: query
          required: false
          description: |
            The opening date of the period the enrichment metrics (cost basis,
            returns, dividends, ...) are computed over (default: since
            inception). Must be before `date`; an empty or inverted range is
            rejected `400 invalid-range`.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: |
            The reporting currency (default: the file's base currency). A
            currency pair without an exchange rate series converts 1:1 — the
            same silent fallback the application itself applies.
          schema:
            type: string
        - name: costMethod
          in: query
          required: false
          description: |
            The cost basis method used for `purchasePrice`, `purchaseValue` and
            the related returns (default: `fifo`).
          schema:
            type: string
            enum: [fifo, moving-average]
            default: fifo
      responses:
        "200":
          description: The holdings at the valuation date
          content:
            application/json:
              schema:
                type: object
                required: [date, totalAssets, items]
                properties:
                  date:
                    type: string
                    format: date
                    description: The effective valuation date.
                  totalAssets:
                    $ref: "#/components/schemas/MonetaryValue"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Holding"
              examples:
                default:
                  value:
                    date: "2026-07-20"
                    totalAssets: { value: 1600, currency: EUR }
                    items:
                      - type: instrument
                        uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                        name: Apple Inc.
                        shares: 10
                        price: { value: 110.5, currency: USD, date: "2026-07-17" }
                        valuation: { value: 1100, currency: EUR }
                        localValuation: { value: 1105, currency: USD }
                        weight: 0.6875
                      - type: cash-account
                        uuid: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                        name: Broker Cash
                        valuation: { value: 500, currency: EUR }
                        weight: 0.3125
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: getPerformance
      tags: [Performance]
      summary: Performance of the file between two valuation dates
      description: |
        The portfolio's performance between the opening and closing valuation
        dates, in the reporting currency: the time-weighted return (TTWROR) and
        the money-weighted return (IRR), plus the value-change `breakdown` that
        reconciles the opening to the closing value.

        The breakdown is a signed decomposition — the money fields add up to the
        closing value:
        `openingValue + unrealizedCapitalGains + realizedCapitalGains + income +
        fees + taxes + currencyGains + netDeposits = closingValue`. `fees` and
        `taxes` are therefore negative. `netDeposits` is the external capital
        flow (deposits less removals) over the period; it is *not* part of the
        performance-driven change, but is required for the value reconciliation.

        `costMethod` chooses how a security's gains split into realized and
        unrealized; it does not affect their sum, nor the returns.

        `openingDate` and `closingDate` are **valuation snapshot dates, not a
        record range**. The opening balance is measured as of the end of
        `openingDate`, so an activity dated exactly on `openingDate` belongs to
        the opening balance, not the period's flows; an activity on
        `closingDate` is in the period. (A record-selection endpoint such as a
        future transactions list uses an inclusive `[from, to]` range instead —
        the two conventions are named differently on purpose.) A cash flow on
        `closingDate` also weighs on `ttwror` as opening capital does, as the
        time-weighted return has no sub-period after the final day to neutralise
        it against.
      parameters:
        - $ref: "#/components/parameters/InvestmentAccountFilter"
        - $ref: "#/components/parameters/CashAccountFilter"
        - name: openingDate
          in: query
          required: true
          description: |
            The opening valuation date. `openingValue` equals
            `GET .../holdings?date={openingDate}`'s `totalAssets`.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            The closing valuation date (default: today). `closingValue` equals
            `GET .../holdings?date={closingDate}`'s `totalAssets`. Must be
            strictly after `openingDate`; an empty or inverted range is rejected
            `400 invalid-range`.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: |
            The reporting currency (default: the file's base currency). A
            currency pair without an exchange rate series converts 1:1 — the
            same silent fallback the application itself applies.
          schema:
            type: string
        - name: costMethod
          in: query
          required: false
          description: |
            The cost basis method used to split capital gains into realized and
            unrealized (default: `fifo`).
          schema:
            type: string
            enum: [fifo, moving-average]
            default: fifo
      responses:
        "200":
          description: The performance over the interval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Performance"
              examples:
                default:
                  value:
                    openingDate: "2024-01-01"
                    closingDate: "2024-12-31"
                    currency: EUR
                    ttwror: 0.0723
                    irr: 0.0685
                    breakdown:
                      openingValue: { value: 100000, currency: EUR }
                      unrealizedCapitalGains: { value: 4200, currency: EUR }
                      realizedCapitalGains: { value: 1500, currency: EUR }
                      income: { value: 900, currency: EUR }
                      fees: { value: -120, currency: EUR }
                      taxes: { value: -300, currency: EUR }
                      currencyGains: { value: 210, currency: EUR }
                      netDeposits: { value: 5000, currency: EUR }
                      closingValue: { value: 111390, currency: EUR }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance/series:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: getPerformanceSeries
      tags: [Performance]
      summary: Daily performance index and risk metrics for a period
      description: |
        The daily index behind `GET .../performance`: one entry per calendar day
        with the accumulated time-weighted return, total assets, invested
        capital, that day's external flow and the running drawdown — plus the
        `risk` metrics derived from the same series (maximum drawdown and its
        duration, volatility, semi-deviation, and the index's own high water
        mark).

        Amounts in `days` are plain numbers in the response's `currency`, not
        `MonetaryValue` objects: the currency is fixed for the whole series and a
        year is roughly 365 entries.

        `openingDate` and `closingDate` follow the same valuation-snapshot
        convention as `GET .../performance`. `days[0]` is the `openingDate`
        baseline: its `ttwror` is 0 by construction, because the accumulated
        index is rebased to the start of the interval. The series is clamped to
        today, so it can be **shorter** than the requested range when
        `closingDate` is in the future — read the effective range off the
        entries, not off the request.

        The interval must not exceed 20 years (`400 invalid-range`); the
        response holds one entry per calendar day.

        There is no `costMethod` parameter: none of these figures depend on how
        gains split into realized and unrealized.
      parameters:
        - $ref: "#/components/parameters/InvestmentAccountFilter"
        - $ref: "#/components/parameters/CashAccountFilter"
        - name: openingDate
          in: query
          required: true
          description: The opening valuation date, and the index's rebase point.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            The closing valuation date (default: today). Must be strictly after
            `openingDate`; an empty or inverted range is rejected
            `400 invalid-range`.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: |
            The reporting currency (default: the file's base currency). A
            currency pair without an exchange rate series converts 1:1 — the
            same silent fallback the application itself applies.
          schema:
            type: string
      responses:
        "200":
          description: The daily index and its risk metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceSeries"
              examples:
                default:
                  value:
                    openingDate: "2024-01-01"
                    closingDate: "2024-12-31"
                    currency: EUR
                    risk:
                      maxDrawdown: -0.183
                      maxDrawdownPeak: "2024-02-19"
                      maxDrawdownTrough: "2024-04-07"
                      maxDrawdownDurationDays: 121
                      maxDrawdownDurationStart: "2024-02-19"
                      maxDrawdownDurationEnd: "2024-06-19"
                      volatility: 0.142
                      semiDeviation: 0.101
                      riskFreeRate: 0.02
                      sharpeRatio: 1.021
                      allTimeHigh:
                        value: 0.31
                        date: "2024-11-14"
                        distance: -0.04
                    days:
                      - date: "2024-01-01"
                        ttwror: 0
                        totalAssets: 100000
                        investedCapital: 100000
                        netDeposits: 0
                        drawdown: 0
                      - date: "2024-01-02"
                        ttwror: 0.0031
                        totalAssets: 100310
                        investedCapital: 100000
                        netDeposits: 0
                        drawdown: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance/securities:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: getSecurityPerformance
      tags: [Performance]
      summary: Per-security performance over a period
      description: |
        How each security contributed over the period, in the reporting currency.

        This covers **every security with activity in the interval, including
        positions closed before `closingDate`** — which is what distinguishes it
        from `GET .../holdings?date={closingDate}`. A holdings snapshot can only
        report what is still held, so a position sold at a profit mid-period is
        invisible there while often being one of the largest contributors here.
        `heldAtClose` tells the two apart.

        `delta` is the cost-method independent absolute gain (it accounts for
        sells and dividends over the period); `realizedGains` and
        `unrealizedGains` split the capital gains according to `costMethod` and
        are the two figures that depend on it.
      parameters:
        - $ref: "#/components/parameters/InvestmentAccountFilter"
        - $ref: "#/components/parameters/CashAccountFilter"
        - name: openingDate
          in: query
          required: true
          description: The opening valuation date.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            The closing valuation date (default: today). Must be strictly after
            `openingDate`; an empty or inverted range is rejected
            `400 invalid-range`.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: |
            The reporting currency (default: the file's base currency). A
            currency pair without an exchange rate series converts 1:1 — the
            same silent fallback the application itself applies.
          schema:
            type: string
        - name: costMethod
          in: query
          required: false
          description: |
            The cost basis method used to split capital gains into realized and
            unrealized (default: `fifo`). It does not affect `delta`, `ttwror` or
            `irr`.
          schema:
            type: string
            enum: [fifo, moving-average]
            default: fifo
      responses:
        "200":
          description: The per-security performance over the interval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityPerformanceCollection"
              examples:
                default:
                  value:
                    openingDate: "2024-01-01"
                    closingDate: "2024-12-31"
                    currency: EUR
                    items:
                      - uuid: 4e0c0f0a-0000-4000-8000-000000000001
                        name: ACME Corp
                        delta: { value: 1520, currency: EUR }
                        deltaPercent: 0.12
                        ttwror: 0.14
                        irr: 0.13
                        realizedGains: { value: 0, currency: EUR }
                        unrealizedGains: { value: 1450, currency: EUR }
                        dividends: { value: 70, currency: EUR }
                        fees: { value: -3, currency: EUR }
                        taxes: { value: 0, currency: EUR }
                        heldAtClose: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/performance/calendar:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: getPerformanceCalendar
      tags: [Performance]
      summary: Per-month returns and activity
      description: |
        One entry per calendar month covering the requested period: the month's
        time-weighted return plus the money that moved through it (dividends,
        interest, fees, taxes, net transfers, and buy/sell counts and volumes).

        The monthly return is the application's own figure — one performance index
        over the month-aligned span, sampled per month, exactly as the desktop's
        monthly-returns heat map does it. It is deliberately **not** a compounding
        of `.../performance/series`, which would drift from the desktop.

        The period is widened to whole months: the first entry is the month
        containing `openingDate` and the last is the month containing
        `closingDate`, each covering the entire month even where the request did
        not. `ttwror` is `null` for a month the index does not cover (rather than
        `0`, which would read as a flat month).

        Amounts are plain numbers in the response's `currency`, as in
        `.../performance/series`. `fees` and `taxes` are signed contributions
        (negative), matching the value-change breakdown rather than the model's
        unsigned storage. Each transaction is converted at **its own** date, which
        is why this is an endpoint rather than a client-side sum over
        `.../transactions`: transactions carry their own currencies.
      parameters:
        - $ref: "#/components/parameters/InvestmentAccountFilter"
        - $ref: "#/components/parameters/CashAccountFilter"
        - name: openingDate
          in: query
          required: true
          description: Any date in the first month to report.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            Any date in the last month to report (default: today). Must be
            strictly after `openingDate`; an empty or inverted range is rejected
            `400 invalid-range`.
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          description: |
            The reporting currency (default: the file's base currency). A
            currency pair without an exchange rate series converts 1:1 — the
            same silent fallback the application itself applies.
          schema:
            type: string
      responses:
        "200":
          description: The monthly returns and activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceCalendar"
              examples:
                default:
                  value:
                    openingDate: "2024-01-01"
                    closingDate: "2024-12-31"
                    currency: EUR
                    months:
                      - month: "2024-01"
                        ttwror: 0.021
                        earnings: { dividends: 210, interest: 12.5 }
                        fees: -8
                        taxes: -55
                        netTransfers: 1000
                        trades: { buys: 3, sells: 1, buyVolume: 4500, sellVolume: 900 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/earnings:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listEarnings
      tags: [Performance]
      summary: Dividends and interest of a period, with totals
      description: |
        The `dividends`, `interest` and `interest-charge` transactions, newest
        first, in the shape of `GET .../transactions`, plus their totals per
        currency. Totals are not converted: each transaction counts in its cash
        account's currency. `value` is the net total (dividends and interest
        after taxes, less interest charges); `taxes` and `fees` are the
        withheld amounts. For converted per-month figures see
        `.../performance/calendar`.
      parameters:
        - name: from
          in: query
          required: false
          description: First booking date to include.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last booking date to include.
          schema:
            type: string
            format: date
        - name: instrument
          in: query
          required: false
          description: Only earnings of this instrument (`uuid`).
          schema:
            type: string
        - name: cashAccount
          in: query
          required: false
          description: Only earnings booked on this cash account (`uuid`).
          schema:
            type: string
        - name: investmentAccount
          in: query
          required: false
          description: Only earnings booked on this investment account's legs (`uuid`).
          schema:
            type: string
      responses:
        "200":
          description: The earnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Earnings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/trades:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: getTrades
      tags: [Performance]
      summary: Buy/sell activity paired into round trips
      description: |
        Each entry is one round trip in a security: when it was entered, when (or
        whether) it was closed, what went in and came out, and the resulting
        profit/loss, holding period and IRR.

        Unlike the other performance endpoints this takes **no date range**. A
        trade is a fact about a holding rather than about a reporting period, so
        the whole history of each security is paired and the client filters. An
        **open** trade is valued at today's price and its holding period runs to
        today, so those fields are not reproducible for a past date — hence the
        absence of a date parameter that would imply otherwise.

        A security whose transaction history cannot be paired is skipped and named
        in `skippedInstruments` rather than failing the request, so a caller can
        tell "no trades" apart from "not all trades".
      parameters:
        - name: currency
          in: query
          required: false
          description: |
            The reporting currency (default: the file's base currency). A
            currency pair without an exchange rate series converts 1:1 — the
            same silent fallback the application itself applies.
          schema:
            type: string
        - name: onlyClosed
          in: query
          required: false
          description: Report only completed round trips.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The paired trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeCollection"
              examples:
                default:
                  value:
                    currency: EUR
                    items:
                      - security: { uuid: 4e0c0f0a-0000-4000-8000-000000000001, name: ACME Corp }
                        start: "2024-03-01"
                        end: "2024-09-12"
                        closed: true
                        shares: 20
                        entryValue: { value: 2000, currency: EUR }
                        exitValue: { value: 2350, currency: EUR }
                        profitLoss: { value: 350, currency: EUR }
                        holdingPeriodDays: 195
                        irr: 0.31
                        return: 0.175
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A per-client access token, obtained through interactive pairing
        (`POST /v1/auth/requests`) or minted manually in Preferences → REST API
        ("Add client"). The user can revoke each client individually; a
        session-scoped token additionally expires when the application quits.

  parameters:
    File:
      name: file
      in: path
      required: true
      description: |
        A file's `id` or `alias`, as returned by `GET /v1/files`. An alias that
        matches several records is rejected `409 ambiguous-alias`; use the `id`.
      schema:
        type: string
    Uuid:
      name: uuid
      in: path
      required: true
      description: The `uuid` of the entity within the file
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      description: |
        The `name` of a watchlist or investment plan, percent-encoded as one
        path segment (a `/` in the name is `%2F`). A name that several
        entities share is rejected `409 ambiguous-name`; rename them in the
        application.
      schema:
        type: string
    TaxonomyId:
      name: id
      in: path
      required: true
      description: The `id` of a taxonomy.
      schema:
        type: string
    CategoryId:
      name: cid
      in: path
      required: true
      description: The `id` of a category (classification) within the taxonomy.
      schema:
        type: string
    InvestmentAccountFilter:
      name: investmentAccount
      in: query
      required: false
      description: |
        Report only on these investment accounts: one `uuid` or a
        comma-separated list. Narrows the file as the application's reporting
        filter does: an investment account brings the instrument-related
        bookings of its reference cash account along (a buy counts as an
        inbound delivery unless that cash account is selected too). Combines
        with `cashAccount`; an unknown UUID is `400 unknown-reference`.
      schema:
        type: string
    CashAccountFilter:
      name: cashAccount
      in: query
      required: false
      description: |
        Report only on these cash accounts: one `uuid` or a comma-separated
        list. Combines with `investmentAccount`; an unknown UUID is
        `400 unknown-reference`.
      schema:
        type: string
    DryRun:
      name: dry_run
      in: query
      required: false
      description: |
        `true` validates the request and answers what it would do, without
        changing anything; `false` or absent performs it. Any other value is
        `400`.
      schema:
        type: boolean
        default: false

  schemas:
    File:
      type: object
      description: An open, enabled portfolio file you may address.
      required: [id, label, path, dirty]
      properties:
        id:
          type: string
          description: |
            Stable identity of the file, keyed by path. Address the file by this or
            by `alias`.
        alias:
          type: string
          description: Optional human-friendly handle the user assigned to the file.
        label:
          type: string
          description: The file's display label in the application.
        path:
          type: string
          description: |
            The file's path on disk. Identity is keyed by path, so a *different*
            file copied over an enabled path inherits that path's access.
        dirty:
          type: boolean
          description: |
            `true` if the file has unsaved changes — made through the API or by
            the user. `POST /v1/files/{file}/save` persists them.

    PairingRequestCreated:
      type: object
      description: A filed access request, awaiting the user's decision.
      required: [id, status]
      properties:
        id:
          type: string
          description: Poll `GET /v1/auth/requests/{id}` with this.
        status:
          type: string
          const: pending

    PairingRequestStatus:
      type: object
      description: The state of an access request.
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, denied, expired]
        token:
          type: string
          description: |
            The bearer token; present only while `status` is `approved`, and
            delivered exactly once.

    Instrument:
      type: object
      description: A security — stock, fund, bond, crypto, …
      required: [uuid, name, currencyCode, retired]
      properties:
        uuid:
          type: string
        name:
          type: string
        currencyCode:
          type: [string, "null"]
          description: |
            ISO 4217 currency code, or `null` for a currency-less instrument such
            as an index or a CPI series. The key is **always present** (hence
            `required`); only its value may be null.
        isin:
          type: string
          description: Omitted when not set.
        wkn:
          type: string
          description: Omitted when not set.
        tickerSymbol:
          type: string
          description: Omitted when not set.
        targetCurrencyCode:
          type: string
          description: |
            Only for an exchange rate: the currency the rate is quoted in.
            Omitted for every other instrument.
        retired:
          type: boolean
          description: |
            Whether the entity is retired (the application says "deactivated");
            a retired entity is hidden from the application's lists and pickers.
        note:
          type: string
          description: Omitted when not set.
        attributes:
          type: object
          description: |
            The instrument's set custom attributes, keyed by attribute id.
            Only attributes that have a value and a supported scalar type
            appear; the key is omitted entirely when none do. Each value is
            typed JSON — a string, number, or boolean (dates are ISO-8601
            strings). Resolve an id to its precise type via
            `GET /v1/files/{file}/instruments/attribute-types`.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        feed:
          type: string
          description: |
            The quote feed for historical prices, e.g. `MANUAL`, `YAHOO`,
            `GENERIC-JSON`, `GENERIC_HTML_TABLE`. Omitted when not set.
        feedUrl:
          type: string
          description: The URL the historical quote feed reads, if it needs one.
        latestFeed:
          type: string
          description: |
            The quote feed for the latest price. Omitted when not set, which
            means the historical feed also provides the latest price.
        latestFeedUrl:
          type: string
        feedProperties:
          type: object
          description: |
            Settings of the quote feeds, keyed by property name (e.g. the JSON
            paths of the generic JSON feed). Omitted when there are none.
          additionalProperties:
            type: string
        calendar:
          type: string
          description: |
            The trade calendar code (e.g. `TARGET2`, `NYSE`); omitted when
            the default calendar applies.
        events:
          type: array
          description: The instrument's events; omitted when there are none.
          items:
            $ref: "#/components/schemas/InstrumentEvent"

    InstrumentPatch:
      type: object
      description: |
        A JSON Merge Patch (RFC 7386) over an instrument. Every field is optional;
        an omitted field is left untouched. Fields typed `["string","null"]` accept
        an explicit `null` to clear them. Custom attributes and quote feed
        properties are patched through the nested `attributes` and
        `feedProperties` objects. Prices and events have their own endpoints.
        An unknown field is rejected (`unknown-field`).

      properties:
        name:
          type: string
          minLength: 1
          description: Non-empty; cannot be cleared.
        currencyCode:
          type: [string, "null"]
          description: |
            A known ISO 4217 currency, or `null` to clear it (marking the
            instrument an index). Clearing is rejected for an exchange rate
            (`exchange-rate-requires-currency`). Any currency change — including
            clearing — is **rejected while the instrument has transactions**
            (`locked-by-transactions`), matching the UI's rule.
        isin:
          type: [string, "null"]
        wkn:
          type: [string, "null"]
        tickerSymbol:
          type: [string, "null"]
        note:
          type: [string, "null"]
        targetCurrencyCode:
          type: string
          description: |
            Only for an exchange rate (`not-allowed-for-type` otherwise); cannot
            be cleared (`exchange-rate-requires-currency`).
        retired:
          type: boolean
          description: |
            Whether the entity is retired (the application says "deactivated");
            a retired entity is hidden from the application's lists and pickers.
        feed:
          type: [string, "null"]
          description: A quote feed id the application knows (`unknown-feed` otherwise).
        feedUrl:
          type: [string, "null"]
        latestFeed:
          type: [string, "null"]
          description: |
            A quote feed id the application knows; `null` lets the historical
            feed provide the latest price.
        latestFeedUrl:
          type: [string, "null"]
        feedProperties:
          type: object
          description: |
            A nested merge patch over the quote feed properties: a string sets
            a property, `null` removes it.
          additionalProperties:
            type: [string, "null"]
        calendar:
          type: [string, "null"]
          description: |
            A trade calendar code the application knows (`unknown-calendar`
            otherwise); `null` selects the default calendar.
        attributes:
          type: object
          description: |
            A nested merge patch over the custom attributes, keyed by attribute
            id: a present value sets the attribute, an explicit `null` clears it,
            an absent id is left untouched. Values are typed JSON per the
            attribute's `type` (see the attribute-types endpoint). Writing an
            unknown id, a non-applicable or compound-typed attribute, or a value
            of the wrong type is rejected with 422 `validation`.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"

    InstrumentCreate:
      description: |
        The fields of a new instrument: those of `InstrumentPatch` plus
        `clientRef`. `name` is required.
      allOf:
        - $ref: "#/components/schemas/InstrumentPatch"
        - type: object
          required: [name]
          properties:
            clientRef:
              type: string
              maxLength: 128
              description: Idempotency key, see the operation.

    InstrumentWriteResult:
      description: The instrument as created, updated, previewed or replayed.
      allOf:
        - $ref: "#/components/schemas/Instrument"
        - $ref: "#/components/schemas/WriteFlags"

    WriteFlags:
      type: object
      properties:
        dryRun:
          type: boolean
          description: Present (`true`) on a dry run; nothing was changed.
        replayed:
          type: boolean
          description: |
            Present (`true`) when a create with an already used `clientRef`
            answered the existing entity instead of creating one.

    DeletePreview:
      type: object
      description: What a delete removes (or, on a dry run, would remove).
      required: [removed]
      properties:
        dryRun:
          type: boolean
          description: Present (`true`) on a dry run; nothing was changed.
        removed:
          type: array
          description: The removed entities, in the shape their GET returns.
          items:
            type: object

    InstrumentEvent:
      type: object
      required: [type]
      properties:
        date:
          type: string
          format: date
          description: The effective date; for a dividend payment, the ex-date.
        type:
          type: string
          enum: [stock-split, note, dividend-payment]
        details:
          type: string
          description: The ratio `new:old` of a stock split, or the text of a note.
        paymentDate:
          type: string
          format: date
          description: Dividend payments only.
        amount:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Dividend payments only, the amount per share.
        source:
          type: string
          description: Where the event came from, if recorded.

    InstrumentEventCreate:
      type: object
      required: [type, date, details]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [stock-split, note]
        date:
          type: string
          format: date
        details:
          type: string
          description: |
            For a `stock-split` the ratio `new:old` (both positive and
            different, e.g. `2:1`); for a `note` its text.
        clientRef:
          type: string
          maxLength: 128

    InstrumentEventWriteResult:
      allOf:
        - $ref: "#/components/schemas/InstrumentEvent"
        - $ref: "#/components/schemas/WriteFlags"

    PriceUpsert:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [date, value]
            additionalProperties: false
            properties:
              date:
                type: string
                format: date
              value:
                $ref: "#/components/schemas/DecimalInput"

    PriceUpsertResult:
      type: object
      required: [uuid, inserted, updated, unchanged]
      properties:
        uuid:
          type: string
        currency:
          type: string
        inserted:
          type: integer
          description: Quotes on dates that had none.
        updated:
          type: integer
          description: Quotes that replaced a different value.
        unchanged:
          type: integer
          description: Quotes equal to the stored value.
        dryRun:
          type: boolean

    PriceDeleteResult:
      type: object
      required: [uuid, removed]
      properties:
        uuid:
          type: string
        removed:
          type: integer
          description: The number of quotes removed (or, on a dry run, that would be).
        dryRun:
          type: boolean

    AttributeDefinition:
      type: object
      description: A custom attribute definition applicable to an instrument.
      required: [id, name, type, supported]
      properties:
        id:
          type: string
          description: Stable identifier; the key used in an instrument's `attributes` map.
        name:
          type: string
          description: User-facing name (the desktop UI shows this, not the id).
        columnLabel:
          type: string
          description: Short label; omitted when not set.
        type:
          type: string
          description: |
            The value type. Supported scalars — `string`, `boolean`, `date`
            (ISO-8601), `amount`, `quote`, `shares`, `percent` (a fraction,
            e.g. 0.007 for 0.7%), `number` (an unscaled decimal; where the
            desktop reads such an attribute as a percentage — the expected
            dividends column — 5 means 5%). Compound — `limit-price`,
            `bookmark`, `image` — appear with `supported: false`.
          enum:
            - string
            - boolean
            - date
            - amount
            - quote
            - shares
            - percent
            - number
            - limit-price
            - bookmark
            - image
        supported:
          type: boolean
          description: Whether v1 can read and write this attribute.

    CashAccount:
      type: object
      description: An account holding cash in a single currency.
      required: [uuid, name, currencyCode, retired, balance]
      properties:
        uuid:
          type: string
        name:
          type: string
        currencyCode:
          type: string
          description: ISO 4217 currency code.
        retired:
          type: boolean
          description: |
            Whether the entity is retired (the application says "deactivated");
            a retired entity is hidden from the application's lists and pickers.
        note:
          type: string
          description: Omitted when not set.
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        balance:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The account's running balance at the request's `date`, always in
            `currencyCode` - never converted.

    InvestmentAccount:
      type: object
      description: |
        An account holding instrument positions. Its cash side is a separate cash
        account, named by `referenceCashAccount`.
      required: [uuid, name, retired, value]
      properties:
        uuid:
          type: string
        name:
          type: string
        retired:
          type: boolean
          description: |
            Whether the entity is retired (the application says "deactivated");
            a retired entity is hidden from the application's lists and pickers.
        referenceCashAccount:
          type: string
          description: |
            The `uuid` of the cash account backing this investment account. Omitted
            when not set.
        note:
          type: string
          description: Omitted when not set.
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        value:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The total value of every security position this account holds at
            the request's `date`, converted into the request's `currency`.
            In the answer of a write: today, in the file's base currency.

    AttributeValues:
      type: object
      description: |
        The entity's set custom attributes, keyed by attribute id, as typed
        JSON; omitted when none is set. See `Instrument.attributes`.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean

    AttributePatch:
      type: object
      description: |
        A nested merge patch over the custom attributes, keyed by attribute
        id: a value sets the attribute, `null` clears it. Unknown ids,
        attributes that do not apply to the entity, unsupported types and
        values of the wrong type are rejected `422`.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: "null"

    CashAccountPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        currencyCode:
          type: string
          description: A known currency; locked while the account has transactions.
        retired:
          type: boolean
          description: |
            Whether the entity is retired (the application says "deactivated");
            a retired entity is hidden from the application's lists and pickers.
        note:
          type: [string, "null"]
        attributes:
          $ref: "#/components/schemas/AttributePatch"

    CashAccountCreate:
      description: The fields of `CashAccountPatch` plus `clientRef`; `name` is required.
      allOf:
        - $ref: "#/components/schemas/CashAccountPatch"
        - type: object
          required: [name]
          properties:
            clientRef:
              type: string
              maxLength: 128

    InvestmentAccountPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        referenceCashAccount:
          type: string
          description: The `uuid` of a cash account that is not retired.
        retired:
          type: boolean
          description: |
            Whether the entity is retired (the application says "deactivated");
            a retired entity is hidden from the application's lists and pickers.
        note:
          type: [string, "null"]
        attributes:
          $ref: "#/components/schemas/AttributePatch"

    InvestmentAccountCreate:
      description: |
        The fields of `InvestmentAccountPatch` plus `clientRef`; `name` and
        `referenceCashAccount` are required.
      allOf:
        - $ref: "#/components/schemas/InvestmentAccountPatch"
        - type: object
          required: [name, referenceCashAccount]
          properties:
            clientRef:
              type: string
              maxLength: 128

    CashAccountWriteResult:
      description: The cash account as created, updated, previewed or replayed; `balance` as of today.
      allOf:
        - $ref: "#/components/schemas/CashAccount"
        - $ref: "#/components/schemas/WriteFlags"

    InvestmentAccountWriteResult:
      description: The investment account as created, updated, previewed or replayed.
      allOf:
        - $ref: "#/components/schemas/InvestmentAccount"
        - $ref: "#/components/schemas/WriteFlags"

    Watchlist:
      type: object
      required: [name, instruments]
      properties:
        name:
          type: string
          description: Unique among the file's watchlists; the identifier in the path.
        instruments:
          type: array
          items:
            type: object
            required: [uuid, name]
            properties:
              uuid:
                type: string
              name:
                type: string

    WatchlistPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        instruments:
          type: [array, "null"]
          description: The instrument UUIDs, each once; replaces the members (`null` empties the list).
          items:
            type: string

    WatchlistCreate:
      description: The fields of `WatchlistPatch` plus `clientRef`; `name` is required.
      allOf:
        - $ref: "#/components/schemas/WatchlistPatch"
        - type: object
          required: [name]
          properties:
            clientRef:
              type: string
              maxLength: 128

    WatchlistWriteResult:
      description: The watchlist as created, updated, previewed or replayed.
      allOf:
        - $ref: "#/components/schemas/Watchlist"
        - $ref: "#/components/schemas/WriteFlags"

    InvestmentPlan:
      type: object
      required: [name, kind, start, amount, fees, taxes, autoGenerate, transactionCount, nextTransactionDate]
      properties:
        name:
          type: string
          description: Unique among the file's plans; the identifier in the path.
        kind:
          type: string
          enum: [purchase, deposit, removal, interest]
        instrument:
          type: string
          description: The instrument's `uuid` (purchase plans).
        investmentAccount:
          type: string
          description: The investment account's `uuid` (purchase plans).
        cashAccount:
          type: string
          description: |
            The cash account's `uuid`. Omitted for a purchase plan booked as a
            delivery (no payment).
        start:
          type: string
          format: date
        intervalMonths:
          type: integer
          description: Present for a monthly interval.
        intervalWeeks:
          type: integer
          description: Present for a weekly interval.
        amount:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The total booked per execution: for a purchase the gross value
            plus fees and taxes, for interest the amount after taxes.
        fees:
          $ref: "#/components/schemas/MonetaryValue"
        taxes:
          $ref: "#/components/schemas/MonetaryValue"
        autoGenerate:
          type: boolean
          description: Whether the application generates due transactions when the file is opened.
        note:
          type: string
        transactionCount:
          type: integer
          description: The number of transactions the plan has generated.
        nextTransactionDate:
          type: string
          format: date

    InvestmentPlanPatch:
      type: object
      description: |
        Amounts are decimals in the plan's currency (that of the cash account,
        or for a delivery plan of the investment account's reference account)
        with at most 2 decimals.

        | `kind` | required | optional |
        | --- | --- | --- |
        | `purchase` | `instrument`, `investmentAccount`, `amount` > `fees` + `taxes` | `cashAccount` (absent: delivery), `fees`, `taxes` |
        | `deposit`, `removal` | `cashAccount`, `amount` | – |
        | `interest` | `cashAccount`, `amount` | `taxes` |

        A field a kind does not take is `not-allowed-for-type`.
      properties:
        name:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [purchase, deposit, removal, interest]
        instrument:
          type: [string, "null"]
        investmentAccount:
          type: [string, "null"]
        cashAccount:
          type: [string, "null"]
        start:
          type: string
          format: date
        intervalMonths:
          type: integer
          minimum: 1
          maximum: 99
          description: Either `intervalMonths` or `intervalWeeks`.
        intervalWeeks:
          type: integer
          minimum: 1
          maximum: 99
        amount:
          $ref: "#/components/schemas/DecimalInput"
        fees:
          $ref: "#/components/schemas/NullableDecimalInput"
        taxes:
          $ref: "#/components/schemas/NullableDecimalInput"
        autoGenerate:
          type: boolean
        note:
          type: [string, "null"]

    InvestmentPlanCreate:
      description: |
        The fields of `InvestmentPlanPatch` plus `clientRef`; `name`, `kind`
        and `amount` are required.
      allOf:
        - $ref: "#/components/schemas/InvestmentPlanPatch"
        - type: object
          required: [name, kind, amount]
          properties:
            clientRef:
              type: string
              maxLength: 128

    InvestmentPlanWriteResult:
      description: The investment plan as created, updated, previewed or replayed.
      allOf:
        - $ref: "#/components/schemas/InvestmentPlan"
        - $ref: "#/components/schemas/WriteFlags"

    InvestmentPlanGenerateResult:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          description: The number of transactions generated (or, on a dry run, due).
        dates:
          type: array
          description: Dry run only, the due dates.
          items:
            type: string
            format: date
        transactions:
          type: array
          description: Real run only, the generated transactions.
          items:
            $ref: "#/components/schemas/TransactionDetail"
        nextTransactionDate:
          type: string
          format: date
        dryRun:
          type: boolean
    MonetaryValue:
      type: object
      description: |
        An amount of money: a plain decimal number (never scientific notation on
        the wire) plus its ISO 4217 currency code.
      required: [value, currency]
      properties:
        value:
          type: number
        currency:
          type: string

    Price:
      type: object
      description: |
        The price per share a valuation is based on: the latest price on or
        before the valuation date — possibly well before it (stale quote, or the
        fallback to the price of the position's last transaction).
      required: [value]
      properties:
        value:
          type: number
        currency:
          type: string
          description: |
            The instrument's own currency. Omitted for the rare instrument
            without a currency.
        date:
          type: string
          format: date
          description: The date the price is from.

    Taxonomy:
      type: object
      description: |
        One category scheme and its tree. Joins to a holding's `classifications`,
        which is keyed by the `id` here.
      required: [id, name, categories]
      properties:
        id:
          type: string
          description: The key this taxonomy appears under in a holding's `classifications`.
        name:
          type: string
        categories:
          type: array
          description: |
            The top-level categories. The taxonomy's own root is not among them —
            it names the taxonomy, not a category.
          items:
            $ref: "#/components/schemas/TaxonomyCategory"

    TaxonomyCategory:
      type: object
      required: [id, name, weight]
      properties:
        id:
          type: string
          description: Addresses the category in `.../taxonomies/{id}/classifications/{cid}`.
        name:
          type: string
        color:
          type: string
          description: The category's display color, as set in the application.
        weight:
          type: number
          description: The target weight for rebalancing, in percent (0 to 100).
        note:
          type: string
          description: Omitted when not set.
        children:
          type: array
          description: Omitted for a leaf, rather than reported as an empty array.
          items:
            $ref: "#/components/schemas/TaxonomyCategory"
        assignments:
          type: array
          description: The instruments and cash accounts assigned here; omitted when none.
          items:
            $ref: "#/components/schemas/TaxonomyAssignment"

    TaxonomyAssignment:
      type: object
      required: [vehicle, type, name, weight]
      properties:
        vehicle:
          type: string
          description: The `uuid` of the instrument or cash account.
        type:
          type: string
          enum: [instrument, cash-account]
        name:
          type: string
        weight:
          type: number
          description: The share assigned to this category, in percent.

    Category:
      description: A category addressed on its own, with its subtree.
      allOf:
        - $ref: "#/components/schemas/TaxonomyCategory"
        - type: object
          required: [taxonomy]
          properties:
            taxonomy:
              type: string
              description: The `id` of the taxonomy.
            parent:
              type: string
              description: The `id` of the parent category; omitted for a top-level category.

    TaxonomyPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    TaxonomyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        clientRef:
          type: string
          maxLength: 128

    CategoryPatch:
      type: object
      properties:
        parent:
          type: [string, "null"]
          description: The `id` of the new parent category; `null` for the top level.
        name:
          type: string
          minLength: 1
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        weight:
          $ref: "#/components/schemas/DecimalInput"
        note:
          type: [string, "null"]

    CategoryCreate:
      description: The fields of `CategoryPatch` plus `clientRef`; `name` is required.
      allOf:
        - $ref: "#/components/schemas/CategoryPatch"
        - type: object
          required: [name]
          properties:
            clientRef:
              type: string
              maxLength: 128

    AssignmentPut:
      type: object
      properties:
        weight:
          $ref: "#/components/schemas/DecimalInput"

    TaxonomyWriteResult:
      description: The taxonomy as created, renamed, previewed or replayed.
      allOf:
        - $ref: "#/components/schemas/Taxonomy"
        - $ref: "#/components/schemas/WriteFlags"

    CategoryWriteResult:
      description: The category as created, updated, previewed or replayed.
      allOf:
        - $ref: "#/components/schemas/Category"
        - $ref: "#/components/schemas/WriteFlags"

    AssignmentWriteResult:
      description: The assignment as written or previewed.
      allOf:
        - $ref: "#/components/schemas/TaxonomyAssignment"
        - $ref: "#/components/schemas/WriteFlags"

    PriceSeries:
      type: object
      description: |
        An instrument's recorded quotes over a range, oldest first. The currency is
        stated once for the whole series rather than on every point: every quote of
        an instrument is in the instrument's currency, and a per-point object would
        multiply the size of a response that is one entry per trading day.
      required: [uuid, items]
      properties:
        uuid:
          type: string
          description: The instrument the series belongs to.
        currency:
          type: string
          description: |
            The instrument's own currency, which every `value` is in. Omitted for
            the rare instrument without a currency.
        from:
          type: string
          format: date
          description: |
            The date of the first point. Absent when the instrument has no prices
            in the requested range.
        to:
          type: string
          format: date
          description: |
            The date of the last point. Absent when the instrument has no prices
            in the requested range.
        items:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"

    PricePoint:
      type: object
      description: One recorded quote, per share, in the series' currency.
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          type: number

    CostBasis:
      type: object
      description: |
        A cost basis, both gross and net of fees/taxes. "Gross" includes
        fees/taxes in the cost basis (the total economic outlay); "net"
        excludes them — matching the desktop's "purchase price"/"gross
        purchase price" columns.
      required: [gross, net]
      properties:
        gross:
          $ref: "#/components/schemas/MonetaryValue"
        net:
          $ref: "#/components/schemas/MonetaryValue"

    Transaction:
      type: object
      description: One entry of the all-transactions list.
      required: [uuid, date, type, value, grossValue, fees, taxes, owner]
      properties:
        uuid:
          type: string
        date:
          type: string
          format: date-time
        type:
          type: string
          description: |
            A stable, machine-readable transaction type — not the (localized)
            label the desktop application shows.
          enum:
            - deposit
            - removal
            - interest
            - interest-charge
            - dividends
            - fees
            - fees-refund
            - taxes
            - tax-refund
            - buy
            - sell
            - transfer-in
            - transfer-out
            - delivery-inbound
            - delivery-outbound
        value:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The signed net cash flow: negative for a debit (a cash account's
            removal, fee, tax, transfer-out, …) or a liquidation (an investment
            account's sell, transfer-out, delivery-outbound); positive
            otherwise.
        grossValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The value before fees and taxes, as a plain (unsigned) magnitude.
        fees:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The fees charged, as a plain (unsigned) magnitude.
        taxes:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The taxes charged, as a plain (unsigned) magnitude.
        shares:
          type: number
          description: The number of shares. Present only when `security` is present.
        security:
          type: object
          description: Omitted for a transaction without a security (e.g. a deposit).
          required: [uuid, name]
          properties:
            uuid:
              type: string
              description: Joins to `GET .../instruments/{uuid}` for master data.
            name:
              type: string
        owner:
          type: object
          description: The cash account or investment account the transaction belongs to.
          required: [uuid, name, type]
          properties:
            uuid:
              type: string
              description: |
                Joins to `GET .../cash-accounts/{uuid}` (type `cash-account`) or
                `GET .../investment-accounts/{uuid}` (type `investment-account`).
            name:
              type: string
            type:
              type: string
              enum: [cash-account, investment-account]
        note:
          type: string
          description: Omitted when not set.

    TransactionDetail:
      description: |
        A single transaction in detail: everything of `Transaction`, plus the
        units the amounts are made of, the ex-date, source and last change,
        and the other leg of a buy/sell or transfer.
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          required: [units]
          properties:
            units:
              type: array
              description: |
                The components of the amount. Fees and taxes may occur more than
                once. `forex` and `exchangeRate` are present when the unit was
                recorded in a foreign currency: `amount` = `forex` ×
                `exchangeRate`, rounded.
              items:
                type: object
                required: [type, amount]
                properties:
                  type:
                    type: string
                    enum: [gross-value, fee, tax]
                  amount:
                    $ref: "#/components/schemas/MonetaryValue"
                  forex:
                    $ref: "#/components/schemas/MonetaryValue"
                  exchangeRate:
                    type: number
            exDate:
              type: string
              format: date-time
              description: The ex-date of a dividend. Omitted when not set.
            source:
              type: string
              description: |
                Where the transaction came from, e.g. the imported file. A
                transaction created through the API with a `clientRef` carries
                `api:<clientRef>`. Omitted when not set.
            clientRef:
              type: string
              description: |
                The idempotency key the transaction was created with through the
                API, i.e. `source` without the `api:` prefix. Omitted otherwise.
            updatedAt:
              type: string
              format: date-time
              description: When the transaction was last changed.
            linked:
              type: object
              description: |
                The other leg of a buy/sell (the cash-account side) or of a
                transfer (the inbound side). Omitted for single-leg transactions.
              required: [uuid, type, owner]
              properties:
                uuid:
                  type: string
                type:
                  type: string
                  description: The type of the other leg, see `Transaction.type`.
                owner:
                  type: object
                  required: [uuid, name, type]
                  properties:
                    uuid:
                      type: string
                    name:
                      type: string
                    type:
                      type: string
                      enum: [cash-account, investment-account]

    TransactionCreate:
      type: object
      description: |
        The body of `POST .../transactions`. `type` selects which fields apply;
        a field that does not apply to the type is rejected
        (`not-allowed-for-type`), an unknown one too (`unknown-field`).
        Decimals are JSON numbers or strings holding a plain decimal literal
        (`"12.30"`), never in exponent notation; amounts have at most 2
        decimals, `shares` and `quote` at most 8, `exchangeRate` at most 10.
        `date` is `YYYY-MM-DD` (time 00:00) or `YYYY-MM-DDTHH:MM`.

        | `type` | required | optional |
        | --- | --- | --- |
        | `buy`, `sell` | `investmentAccount`, `cashAccount`, `instrument`, `date`, `shares`, one of `quote` / `grossValue` / `amount` | `exchangeRate`, `fees`, `taxes`, `forexFees`, `forexTaxes`, `amount`, `note` |
        | `delivery-inbound`, `delivery-outbound` | `investmentAccount`, `instrument`, `date`, `shares`, one of `quote` / `grossValue` / `amount` | `currency`, `exchangeRate`, `fees`, `taxes`, `forexFees`, `forexTaxes`, `amount`, `note` |
        | `dividends` | `cashAccount`, `instrument`, `date`, one of `grossValue` / `amount` | `exDate`, `shares`, `exchangeRate`, `fees`, `taxes`, `forexFees`, `forexTaxes`, `note` |
        | `deposit`, `removal`, `interest-charge` | `cashAccount`, `date`, `amount` | `note` |
        | `interest` | `cashAccount`, `date`, `amount` | `taxes`, `note` |
        | `fees`, `fees-refund`, `taxes`, `tax-refund` | `cashAccount`, `date`, `amount` | `instrument`, `exchangeRate`, `note` |
        | `cash-transfer` | `fromCashAccount`, `toCashAccount`, `date`, `amount` | `targetAmount` (required between currencies), `note` |
        | `security-transfer` | `fromInvestmentAccount`, `toInvestmentAccount`, `instrument`, `date`, `shares`, one of `amount` / `quote` | `note` |

        **Buy, sell, deliveries** (as the application's dialogs): the gross
        value is `grossValue`, or `shares` × `quote`, in the instrument
        currency. If the instrument currency differs from the transaction
        currency (the cash account's, or `currency` of a delivery, by default
        the reference cash account's), it is converted with `exchangeRate`
        (transaction currency per unit of instrument currency), which is looked
        up from the file's exchange rates when omitted
        (`exchange-rate-required` if there is none). The total is the converted
        gross value plus (buy, inbound delivery) or minus (sell, outbound
        delivery) `fees` and `taxes` (transaction currency) and the converted
        `forexFees` and `forexTaxes` (instrument currency, only between
        currencies). An explicit `amount` (the total) must match within the
        dialog's tolerances (gross within shares × (quote ± 0.01), converted
        gross within gross × (rate ± 0.0001)) and then wins; `amount` alone
        derives the gross value. A sale with a total of zero is refused
        (`zero-total-use-delivery`); only an outbound delivery may be zero.
        Fees, taxes and the foreign-currency gross value are units of the
        investment-account leg only.

        **Dividends:** `grossValue`, `fees` and `taxes` are in the cash-account
        currency; the net amount is gross minus fees and taxes (not below 0).
        `amount` may be given instead of, or to check, `grossValue`. For an
        instrument in another currency the foreign gross value is derived with
        `exchangeRate`. `exDate` must not be after `date`; `shares` may be 0.

        **Cash bookings:** `amount` is the booked amount; for `interest`,
        `taxes` withheld on top of it (the gross interest is `amount` +
        `taxes`).

        **Transfers:** a `cash-transfer` debits `amount` from
        `fromCashAccount` and credits `targetAmount` (the same amount if both
        accounts share a currency) to `toCashAccount`; the exchange rate
        follows from the two amounts. A `security-transfer` moves `shares` at
        the book value `amount` (or `shares` × `quote`) in the instrument
        currency.
      required: [type]
      properties:
        type:
          type: string
          enum:
            - buy
            - sell
            - delivery-inbound
            - delivery-outbound
            - dividends
            - deposit
            - removal
            - interest
            - interest-charge
            - fees
            - fees-refund
            - taxes
            - tax-refund
            - cash-transfer
            - security-transfer
        clientRef:
          type: string
          maxLength: 128
          description: Idempotency key, see the operation's description.
        date:
          type: string
          description: "`YYYY-MM-DD` or `YYYY-MM-DDTHH:MM`"
        cashAccount:
          type: string
          description: The `uuid` of the cash account.
        investmentAccount:
          type: string
          description: The `uuid` of the investment account.
        instrument:
          type: string
          description: The `uuid` of the instrument.
        shares:
          $ref: "#/components/schemas/DecimalInput"
        quote:
          $ref: "#/components/schemas/DecimalInput"
        grossValue:
          $ref: "#/components/schemas/DecimalInput"
        exchangeRate:
          $ref: "#/components/schemas/DecimalInput"
        fees:
          $ref: "#/components/schemas/DecimalInput"
        taxes:
          $ref: "#/components/schemas/DecimalInput"
        forexFees:
          $ref: "#/components/schemas/DecimalInput"
        forexTaxes:
          $ref: "#/components/schemas/DecimalInput"
        amount:
          $ref: "#/components/schemas/DecimalInput"
        targetAmount:
          $ref: "#/components/schemas/DecimalInput"
        exDate:
          type: string
          format: date
        currency:
          type: string
          description: The transaction currency of a delivery (ISO 4217).
        fromCashAccount:
          type: string
        toCashAccount:
          type: string
        fromInvestmentAccount:
          type: string
        toInvestmentAccount:
          type: string
        note:
          type: string

    TransactionPatch:
      type: object
      description: |
        A JSON Merge Patch with the fields of `TransactionCreate` (without
        `clientRef`); `null` clears an optional field. Which fields apply
        depends on the (possibly new) `type`.
      properties:
        type:
          type: string
        date:
          type: string
        cashAccount:
          type: string
        investmentAccount:
          type: string
        instrument:
          type: [string, "null"]
        shares:
          $ref: "#/components/schemas/DecimalInput"
        quote:
          $ref: "#/components/schemas/DecimalInput"
        grossValue:
          $ref: "#/components/schemas/DecimalInput"
        exchangeRate:
          $ref: "#/components/schemas/NullableDecimalInput"
        fees:
          $ref: "#/components/schemas/NullableDecimalInput"
        taxes:
          $ref: "#/components/schemas/NullableDecimalInput"
        forexFees:
          $ref: "#/components/schemas/NullableDecimalInput"
        forexTaxes:
          $ref: "#/components/schemas/NullableDecimalInput"
        amount:
          $ref: "#/components/schemas/DecimalInput"
        targetAmount:
          $ref: "#/components/schemas/DecimalInput"
        exDate:
          type: [string, "null"]
          format: date
        currency:
          type: [string, "null"]
        fromCashAccount:
          type: string
        toCashAccount:
          type: string
        fromInvestmentAccount:
          type: string
        toInvestmentAccount:
          type: string
        note:
          type: [string, "null"]

    DecimalInput:
      description: A decimal as a JSON number or a string holding a plain decimal literal.
      oneOf:
        - type: string
          pattern: "^-?\\d+(\\.\\d+)?$"
        - type: number

    NullableDecimalInput:
      description: Like `DecimalInput`; `null` clears the value.
      oneOf:
        - type: string
          pattern: "^-?\\d+(\\.\\d+)?$"
        - type: number
        - type: "null"

    TransactionWriteResult:
      description: |
        The transaction in detail (`TransactionDetail`), as created, updated,
        previewed or replayed.
      allOf:
        - $ref: "#/components/schemas/TransactionDetail"
        - type: object
          properties:
            dryRun:
              type: boolean
              description: Present (`true`) on a dry run; nothing was changed.
            replayed:
              type: boolean
              description: |
                Present (`true`) when a create with an already used `clientRef`
                answered the existing transaction instead of creating one.

    TransactionDeletePreview:
      type: object
      description: What a dry-run delete would remove.
      required: [dryRun, removed]
      properties:
        dryRun:
          type: boolean
        removed:
          type: array
          description: The transaction and, for a buy/sell or transfer, its other leg.
          items:
            $ref: "#/components/schemas/Transaction"

    Holding:
      type: object
      description: |
        One line of the statement of assets — an instrument position or a cash
        account balance.
      required: [type, uuid, name, valuation, weight]
      properties:
        type:
          type: string
          enum: [instrument, cash-account]
        uuid:
          type: string
          description: |
            Joins to `GET .../instruments/{uuid}` (type `instrument`) or
            `GET .../cash-accounts/{uuid}` (type `cash-account`) for master data.
        name:
          type: string
        shares:
          type: number
          description: The number of shares held. Instruments only.
        price:
          allOf:
            - $ref: "#/components/schemas/Price"
          description: Instruments only.
        isin:
          type: string
          description: Instruments only. Omitted when not set.
        wkn:
          type: string
          description: Instruments only. Omitted when not set.
        tickerSymbol:
          type: string
          description: Instruments only. Omitted when not set.
        note:
          type: string
          description: Instruments only. Omitted when not set.
        attributes:
          type: object
          description: |
            Instruments only. The instrument's set custom attributes, keyed by
            attribute id, as in `GET .../instruments`. Omitted when none are set.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        purchasePrice:
          allOf:
            - $ref: "#/components/schemas/CostBasis"
          description: |
            Instruments only. The per-share cost basis at `costMethod`, over
            `(openingDate, date]`. Omitted when the security has no line item
            in the period (e.g. never held during it).
        purchaseValue:
          allOf:
            - $ref: "#/components/schemas/CostBasis"
          description: |
            Instruments only. The total cost basis of the shares held at
            `costMethod`, over `(openingDate, date]`. Omitted when the security
            has no line item in the period.
        profitLoss:
          type: object
          description: |
            Instruments only. The unrealized profit/loss against
            `purchaseValue.gross` at `costMethod`. Omitted when the security
            has no line item in the period.
          required: [value, percent]
          properties:
            value:
              $ref: "#/components/schemas/MonetaryValue"
            percent:
              type: [number, "null"]
              description: |
                A fraction (0.1 is 10%), not a percentage. `null` when the
                model cannot define it.
        delta:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. Market value plus sells and dividends over the
            period, minus purchase costs — a cost-method independent absolute
            performance figure. Omitted when the security has no line item in
            the period.
        deltaPercent:
          type: [number, "null"]
          description: |
            Instruments only. `delta` as a fraction (not a percentage) of
            capital committed. `null` when the model cannot define it. Omitted
            when `delta` is omitted.
        ttwror:
          type: [number, "null"]
          description: |
            Instruments only. The true time-weighted rate of return over the
            period, as a fraction. `null` when the model cannot define it.
            Omitted when the security has no line item in the period.
        ttwrorAnnualized:
          type: [number, "null"]
          description: |
            Instruments only. `ttwror` annualized. `null` when the model
            cannot define it. Omitted when the security has no line item in
            the period.
        irr:
          type: [number, "null"]
          description: |
            Instruments only. The internal (money-weighted) rate of return
            over the period, as a fraction. `null` when the model cannot
            define it. Omitted when the security has no line item in the
            period.
        dividends:
          type: object
          description: |
            Instruments only. Omitted when nothing applies: no dividend was
            received in the period and no dividend event is scheduled.
          properties:
            sum:
              allOf:
                - $ref: "#/components/schemas/MonetaryValue"
              description: |
                Dividends received over the period. Present only when the
                security has a line item in the period.
            totalRateOfReturn:
              type: number
              description: |
                `sum` as a fraction of the (gross) cost basis at `costMethod` -
                not a percentage. Present only when the security has a line
                item in the period.
            nextExDate:
              type: string
              format: date
              description: |
                The next upcoming ex-dividend date from the security's own
                dividend calendar, relative to today (regardless of `date`).
                Omitted when none is scheduled.
            nextPaymentDate:
              type: string
              format: date
              description: |
                The next upcoming dividend payment date, relative to today
                (regardless of `date`). Omitted when none is scheduled.
            nextPaymentAmount:
              allOf:
                - $ref: "#/components/schemas/MonetaryValue"
              description: |
                The amount of the next upcoming dividend payment. Omitted when
                `nextPaymentDate` is omitted.
        classifications:
          type: object
          description: |
            The holding's classification in every taxonomy the client defines,
            keyed by taxonomy id — an instrument or a cash account can each be
            classified (an asset-allocation taxonomy, for one, commonly
            classifies cash accounts too). Omitted when the client defines no
            taxonomies, or the holding is unclassified in all of them.
          additionalProperties:
            type: array
            description: |
              The holding's assignment(s) within one taxonomy - more than one
              when the holding is split across categories.
            items:
              type: object
              required: [path, weight]
              properties:
                path:
                  type: array
                  description: |
                    The classification's path from just below the taxonomy's
                    root to the leaf, as category names. The root itself is
                    never included - it names the taxonomy, not a category.
                  items:
                    type: string
                weight:
                  type: number
                  description: |
                    This assignment's fraction (0–1) of the holding - not a
                    percentage. 1 unless the holding is split across several
                    categories.
        valuation:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The holding's value in the reporting currency.
        weight:
          type: number
          description: The holding's fraction (0–1) of total assets — not a percentage.
        localValuation:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The holding's value in its own currency, before conversion into the
            reporting currency. Present only when the two currencies differ.
        exchangeRate:
          type: number
          description: |
            The exchange rate used to convert the holding's own currency into
            the reporting currency, on `date`. Applies to an instrument or a
            cash account alike. Omitted when the two currencies are the same
            or the holding has no currency at all.
        quoteReportingCurrency:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. `price` converted into the reporting currency -
            distinct from `price`, which stays in the security's own currency.
            Omitted when the two currencies are the same (identical to
            `price`) or the security has no currency at all.
        purchasePriceLocal:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. `purchasePrice.gross` at `costMethod`, in the
            security's own currency instead of the reporting currency (mirrors
            the desktop's "...BaseCurrency" columns). Omitted when the two
            currencies are the same, or the security has no line item in the
            period.
        purchaseValueLocal:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. `purchaseValue.gross` at `costMethod`, in the
            security's own currency. Omitted when the two currencies are the
            same, or the security has no line item in the period.
        profitLossLocal:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            Instruments only. `profitLoss.value` at `costMethod`, in the
            security's own currency. Omitted when the two currencies are the
            same, or the security has no line item in the period.
        distanceFromMovingAverage200:
          type: number
          description: |
            Instruments only. The latest price's relative distance from the
            200-day simple moving average ending on `date`, as a fraction, not
            a percentage. Omitted when there are fewer than 200 prices on or
            before `date`.
        distanceFromAllTimeHigh:
          type: number
          description: |
            Instruments only. The latest price's relative distance (always
            ≤ 0) from the highest price reached over `(openingDate, date]`, as
            a fraction, not a percentage. Omitted when the security has no
            price in the period.
        quoteRange:
          type: object
          description: |
            Instruments only. The lowest and highest price reached over
            `(openingDate, date]`. Omitted when the security has no price in
            the period.
          required: [low, lowDate, high, highDate]
          properties:
            low:
              $ref: "#/components/schemas/MonetaryValue"
            lowDate:
              type: string
              format: date
            high:
              $ref: "#/components/schemas/MonetaryValue"
            highDate:
              type: string
              format: date

    Performance:
      type: object
      description: |
        The return and value-change of the file between two valuation dates.
      required: [openingDate, closingDate, currency, ttwror, irr, breakdown]
      properties:
        openingDate:
          type: string
          format: date
          description: The opening valuation date.
        closingDate:
          type: string
          format: date
          description: The effective closing valuation date.
        currency:
          type: string
          description: The reporting currency of every amount in the breakdown.
        ttwror:
          type: [number, "null"]
          description: |
            The true time-weighted rate of return over the interval, as a
            fraction (0.0723 is 7.23 %) — not a percentage. `null` when the
            model cannot define it for the interval.
        irr:
          type: [number, "null"]
          description: |
            The internal (money-weighted) rate of return over the interval, as a
            fraction — not a percentage. `null` when the model cannot define it
            for the interval.
        breakdown:
          $ref: "#/components/schemas/PerformanceBreakdown"
        ratios:
          $ref: "#/components/schemas/PerformanceRatios"

    PerformanceRatios:
      type: object
      description: |
        Cost ratios for the period, as fractions — not percentages. Reported
        rather than left to the client to derive: the breakdown alone does not
        pin down the denominators these use.
      required: [taxRate, feeRate]
      properties:
        taxRate:
          type: [number, "null"]
          description: |
            `taxes / (unrealizedCapitalGains + realizedCapitalGains + income -
            fees)`, using unsigned magnitudes for taxes and fees. `null` when the
            denominator is zero, or when either side is negative — the ratio has
            no meaning for a loss-making period.
        feeRate:
          type: [number, "null"]
          description: |
            `fees / (unrealizedCapitalGains + realizedCapitalGains + income)`,
            using an unsigned magnitude for fees. `null` under the same
            conditions as `taxRate`.

    PerformanceCalendar:
      type: object
      required: [openingDate, closingDate, currency, months]
      properties:
        openingDate:
          type: string
          format: date
          description: |
            The opening valuation date this response covers, echoed from the
            request so a response always states its own period.
        closingDate:
          type: string
          format: date
          description: The closing valuation date this response covers.
        currency:
          type: string
          description: The reporting currency of every amount in `months`.
        months:
          type: array
          description: Ascending, one entry per calendar month, no gaps.
          items:
            $ref: "#/components/schemas/PerformanceMonth"

    PerformanceMonth:
      type: object
      required: [month, ttwror, earnings, fees, taxes, netTransfers, trades]
      properties:
        month:
          type: string
          description: The month, as `YYYY-MM`.
          pattern: "^[0-9]{4}-[0-9]{2}$"
        ttwror:
          type: [number, "null"]
          description: |
            The month's time-weighted return as a fraction — not a percentage.
            `null` when the performance index does not cover the month at all,
            which is different from a flat month (`0`).
        earnings:
          type: object
          required: [dividends, interest]
          properties:
            dividends:
              type: number
            interest:
              type: number
              description: Interest received less interest charged.
        fees:
          type: number
          description: A signed contribution, so never positive unless refunds exceeded fees.
        taxes:
          type: number
          description: A signed contribution, so never positive unless refunds exceeded taxes.
        netTransfers:
          type: number
          description: |
            External capital flow for the month: deposits less removals, plus
            inbound less outbound deliveries (a delivery moves assets without a
            cash leg, so it belongs here rather than with trades).
        trades:
          type: object
          required: [buys, sells, buyVolume, sellVolume]
          properties:
            buys:
              type: integer
            sells:
              type: integer
            buyVolume:
              type: number
            sellVolume:
              type: number

    TradeCollection:
      type: object
      required: [currency, items]
      properties:
        currency:
          type: string
          description: The reporting currency of every amount in `items`.
        items:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
        skippedInstruments:
          type: array
          description: |
            Names of securities whose transaction history could not be paired into
            trades. Present only when at least one was skipped; its presence means
            `items` is incomplete.
          items:
            type: string

    Trade:
      type: object
      description: One round trip in a security.
      required: [security, start, closed, shares, entryValue, exitValue, profitLoss, holdingPeriodDays, irr, return]
      properties:
        security:
          type: object
          required: [uuid, name]
          properties:
            uuid:
              type: string
              description: Joins to `GET .../instruments/{uuid}` for master data.
            name:
              type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date
          description: Omitted while the trade is still open.
        closed:
          type: boolean
        shares:
          type: number
        entryValue:
          $ref: "#/components/schemas/MonetaryValue"
          description: What was paid in, including taxes and fees.
        exitValue:
          $ref: "#/components/schemas/MonetaryValue"
          description: |
            What came out. For an **open** trade this is the position's value at
            today's price, not at any requested date.
        profitLoss:
          $ref: "#/components/schemas/MonetaryValue"
        holdingPeriodDays:
          type: integer
          description: |
            Share-weighted average holding period in days. For an open trade it
            runs to today.
        irr:
          type: [number, "null"]
          description: The trade's annualized internal rate of return, as a fraction.
        return:
          type: [number, "null"]
          description: Profit/loss over entry value, as a fraction — not annualized.

    SecurityPerformanceCollection:
      type: object
      required: [openingDate, closingDate, currency, items]
      properties:
        openingDate:
          type: string
          format: date
          description: |
            The opening valuation date this response covers, echoed from the
            request so a response always states its own period.
        closingDate:
          type: string
          format: date
          description: The closing valuation date this response covers.
        currency:
          type: string
          description: The reporting currency of every amount in `items`.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecurityPerformance"

    SecurityPerformance:
      type: object
      description: |
        One security's contribution over the period. Present whenever the
        security had any activity in the interval, whether or not it is still
        held at the end.
      required:
        - uuid
        - name
        - delta
        - deltaPercent
        - ttwror
        - irr
        - realizedGains
        - unrealizedGains
        - dividends
        - fees
        - taxes
        - heldAtClose
      properties:
        uuid:
          type: string
        name:
          type: string
        delta:
          $ref: "#/components/schemas/MonetaryValue"
        deltaPercent:
          type: [number, "null"]
          description: |
            `delta` relative to the capital it was earned on, as a fraction — not
            a percentage.
        ttwror:
          type: [number, "null"]
          description: |
            The security's time-weighted return over the period, as a fraction.
            `null` when the model cannot define it (see the holdings endpoint's
            note on securities acquired only through an inbound delivery).
        irr:
          type: [number, "null"]
          description: The security's money-weighted return, as a fraction.
        realizedGains:
          $ref: "#/components/schemas/MonetaryValue"
        unrealizedGains:
          $ref: "#/components/schemas/MonetaryValue"
        dividends:
          $ref: "#/components/schemas/MonetaryValue"
        fees:
          $ref: "#/components/schemas/MonetaryValue"
        taxes:
          $ref: "#/components/schemas/MonetaryValue"
        heldAtClose:
          type: boolean
          description: |
            Whether any shares were still held at the end of the period. `false`
            marks a position that was closed inside the period — a case a
            holdings snapshot at `closingDate` cannot report at all.

    PerformanceSeries:
      type: object
      description: |
        The daily performance index for a period, plus the risk metrics derived
        from it.
      required: [openingDate, closingDate, currency, risk, days]
      properties:
        openingDate:
          type: string
          format: date
          description: The opening valuation date, and the index's rebase point.
        closingDate:
          type: string
          format: date
          description: |
            The requested closing valuation date. The `days` entries can stop
            earlier, since the series is clamped to today.
        currency:
          type: string
          description: The reporting currency of every amount in `days`.
        risk:
          $ref: "#/components/schemas/RiskMetrics"
        days:
          type: array
          description: |
            One entry per calendar day, ascending, starting at `openingDate`.
          items:
            $ref: "#/components/schemas/PerformanceSeriesDay"

    PerformanceSeriesDay:
      type: object
      required: [date, ttwror, totalAssets, investedCapital, netDeposits, drawdown]
      properties:
        date:
          type: string
          format: date
        ttwror:
          type: [number, "null"]
          description: |
            The accumulated time-weighted return from `openingDate` to this day,
            as a fraction — not a percentage. 0 on the first day by construction.
        totalAssets:
          type: number
          description: Total assets on this day, in the response's `currency`.
        investedCapital:
          type: number
          description: |
            The invested-capital series in the response's `currency`: what has
            been put into the portfolio, seeded with the opening total assets.
            The gap to `totalAssets` is the absolute gain.
        netDeposits:
          type: number
          description: |
            **This day's** external flow (deposits less removals) in the
            response's `currency` — a per-day amount, not a running total.
        drawdown:
          type: [number, "null"]
          description: |
            The decline from the index's running high water mark on this day, as
            a fraction. Zero at a new peak, negative otherwise.

    RiskMetrics:
      type: object
      description: |
        Risk measures for the period, computed from the daily index by the same
        code the desktop application's risk widgets use.
      required:
        - maxDrawdown
        - maxDrawdownPeak
        - maxDrawdownTrough
        - maxDrawdownDurationDays
        - maxDrawdownDurationStart
        - maxDrawdownDurationEnd
        - volatility
        - semiDeviation
        - riskFreeRate
        - sharpeRatio
        - allTimeHigh
      properties:
        maxDrawdown:
          type: [number, "null"]
          description: |
            The deepest peak-to-trough decline over the period, as a **negative**
            fraction, matching the sign of `days[].drawdown`.
        maxDrawdownPeak:
          type: string
          format: date
          description: The peak the deepest drawdown fell from.
        maxDrawdownTrough:
          type: string
          format: date
          description: The trough of the deepest drawdown.
        maxDrawdownDurationDays:
          type: integer
          description: |
            The longest stretch, in days, spent below a previous peak. This is a
            different interval from `maxDrawdownPeak`/`maxDrawdownTrough`: the
            deepest drawdown and the longest one need not be the same episode.
        maxDrawdownDurationStart:
          type: string
          format: date
        maxDrawdownDurationEnd:
          type: string
          format: date
        volatility:
          type: [number, "null"]
          description: |
            The standard deviation of the daily returns, as a fraction. Weekends,
            public holidays and days with no holdings are excluded. Not
            annualized.
        semiDeviation:
          type: [number, "null"]
          description: |
            The standard deviation of the negative daily returns only (downside
            volatility), on the same basis as `volatility`.
        riskFreeRate:
          type: [number, "null"]
          description: |
            The risk-free rate of return configured for this file, as a fraction
            (0 unless set). It is a property of the file, not a request
            parameter: the desktop application stores it per client and uses it
            for the same Sharpe ratio reported here.
        sharpeRatio:
          type: [number, "null"]
          description: |
            `(irr - riskFreeRate) / volatility`: the excess money-weighted
            return per unit of risk, a plain number rather than a fraction of
            anything. Computed exactly as the desktop application's Sharpe ratio
            widget computes it, from the same inputs. Null when the volatility is
            zero (a single valuation day, or no holdings at all), since the ratio
            is then undefined.
        allTimeHigh:
          $ref: "#/components/schemas/IndexHighWaterMark"

    IndexHighWaterMark:
      type: object
      description: |
        The highest point the accumulated index reached within the period. This
        is the index's own high water mark, not a security's all-time high: the
        value is an accumulated return, not a price.
      required: [value, distance]
      properties:
        value:
          type: [number, "null"]
          description: |
            The accumulated return at the peak, as a fraction — not a percentage.
        date:
          type: string
          format: date
          description: The day the peak was reached. Omitted when the series is empty.
        distance:
          type: [number, "null"]
          description: |
            How far the final day sits below that peak, as a negative fraction
            (0 when the period ends at its high).

    PerformanceBreakdown:
      type: object
      description: |
        A signed decomposition of the value change: the fields add up to the
        closing value —
        `openingValue + unrealizedCapitalGains + realizedCapitalGains + income +
        fees + taxes + currencyGains + netDeposits = closingValue`.
      required:
        - openingValue
        - unrealizedCapitalGains
        - realizedCapitalGains
        - income
        - fees
        - taxes
        - currencyGains
        - netDeposits
        - closingValue
      properties:
        openingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The portfolio's value at `openingDate`.
        unrealizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The change in value of positions still held; negative for a loss.
        realizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gains locked in by sales during the interval; negative for a loss.
        income:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Dividends and interest received, net of interest charged.
        fees:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Fees paid, as a negative contribution (positive only for a net refund).
        taxes:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Taxes paid, as a negative contribution (positive only for a net refund).
        currencyGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gain or loss attributable to exchange rate movements.
        netDeposits:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            External capital flow over the interval: deposits and inbound
            deliveries less removals and outbound deliveries. Not part of the
            performance-driven change, but required for the value reconciliation.
        closingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The portfolio's value at `closingDate`.

    TaxonomyAllocation:
      type: object
      required: [taxonomy, date, currency, totalAssets, categories, unassigned]
      properties:
        taxonomy:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        date:
          type: string
          format: date
        currency:
          type: string
        totalAssets:
          $ref: "#/components/schemas/MonetaryValue"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/AllocationCategory"
        assignments:
          type: array
          description: Holdings assigned to the taxonomy itself rather than a category (rare).
          items:
            $ref: "#/components/schemas/AllocationAssignment"
        unassigned:
          type: object
          properties:
            value:
              $ref: "#/components/schemas/MonetaryValue"
            share:
              type: number
            assignments:
              type: array
              items:
                $ref: "#/components/schemas/AllocationAssignment"
    AllocationCategory:
      type: object
      required: [id, name, weight, value, share, targetValue, deviation]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
        weight:
          type: number
          description: The target weight in percent.
        value:
          $ref: "#/components/schemas/MonetaryValue"
        share:
          type: number
          description: Fraction of the total assets.
        targetValue:
          $ref: "#/components/schemas/MonetaryValue"
        deviation:
          $ref: "#/components/schemas/MonetaryValue"
        children:
          type: array
          items:
            $ref: "#/components/schemas/AllocationCategory"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AllocationAssignment"
    AllocationAssignment:
      type: object
      required: [vehicle, type, name, weight, value]
      properties:
        vehicle:
          type: string
          description: The `uuid` of the instrument or cash account.
        type:
          type: string
          enum: [instrument, cash-account]
        name: { type: string }
        weight:
          type: number
          description: The assigned (or, under `unassigned`, the unassigned) weight in percent.
        value:
          $ref: "#/components/schemas/MonetaryValue"
    Earnings:
      type: object
      required: [items, totals]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        totals:
          type: array
          items:
            type: object
            required: [currency, value, dividends, interest, interestCharge, taxes, fees, count]
            properties:
              currency: { type: string }
              value:
                type: number
                description: Net earnings, dividends + interest - interestCharge.
              dividends: { type: number }
              interest: { type: number }
              interestCharge: { type: number }
              taxes: { type: number }
              fees: { type: number }
              count: { type: integer }
    StockSplit:
      type: object
      required: [exDate, newShares, oldShares]
      properties:
        exDate:
          type: string
          format: date
          description: The first day the instrument trades with the new share count.
        newShares:
          $ref: "#/components/schemas/DecimalInput"
        oldShares:
          $ref: "#/components/schemas/DecimalInput"
        adjustTransactions:
          type: boolean
          default: true
        adjustPrices:
          type: boolean
          default: true
        clientRef:
          type: string
          maxLength: 128
    StockSplitResult:
      type: object
      required: [instrument, event, adjustTransactions, adjustPrices, transactionsAffected, pricesAffected,
        transactions]
      properties:
        instrument:
          type: string
        event:
          $ref: "#/components/schemas/InstrumentEvent"
        adjustTransactions:
          type: boolean
        adjustPrices:
          type: boolean
        transactionsAffected:
          type: integer
          description: The number of adjusted transaction legs.
        pricesAffected:
          type: integer
        transactions:
          type: array
          items:
            type: object
            properties:
              uuid: { type: string }
              date: { type: string }
              type: { type: string }
              sharesBefore: { type: number }
              sharesAfter: { type: number }
        firstPrice:
          $ref: "#/components/schemas/SplitPriceChange"
        lastPrice:
          $ref: "#/components/schemas/SplitPriceChange"
        dryRun:
          type: boolean
        replayed:
          type: boolean
    SplitPriceChange:
      type: object
      properties:
        date:
          type: string
          format: date
        before:
          type: number
        after:
          type: number
    FieldError:
      type: object
      description: One field-level violation within a `Problem`.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The offending field (or the resource facet that blocks the operation).
        code:
          type: string
          description: A stable, machine-readable reason.
          enum:
            - required
            - invalid-type
            - invalid-value
            - invalid-range
            - too-long
            - unknown-field
            - unknown-currency
            - locked-by-transactions
            - exchange-rate-requires-currency
            - referenced
            - unknown-attribute
            - attribute-not-applicable
            - unsupported-attribute-type
            - unknown-reference
            - not-allowed-for-type
            - must-be-positive
            - currency-mismatch
            - exchange-rate-required
            - gross-mismatch
            - total-mismatch
            - zero-total-use-delivery
            - ex-date-after-date
            - same-account
            - same-investment-account
            - unknown-feed
            - unknown-calendar
            - weight-exceeds-100
            - already-exists
        message:
          type: string
          description: Human-readable explanation of this one violation.

    Problem:
      type: object
      description: |
        An error, following RFC 9457 (`application/problem+json`). `title` is
        invariant for a given `type`; anything specific to the one occurrence is in
        `detail`. Validation and conflict problems additionally carry `errors`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            A URI identifying the problem kind. The distinct values are enumerated
            below; note especially that a **404 never distinguishes** an unknown
            file from a file that exists but is not enabled, and that the three
            **409** kinds each call for a different response:
            `file-not-open` (open it with `POST /v1/files/open`, or ask a human),
            `ambiguous-alias` (retry with the `id`), `delete-blocked` (give up —
            the instrument is referenced). Opening a file may additionally answer
            `password-required` or `open-failed` (409) and `file-loading` (503);
            saving may answer `save-failed` (500). `method-not-allowed` (405) is
            returned for any method a path does not list.
          enum:
            - https://portfolio-performance.info/rest/problems/invalid-request
            - https://portfolio-performance.info/rest/problems/unauthorized
            - https://portfolio-performance.info/rest/problems/forbidden-host
            - https://portfolio-performance.info/rest/problems/browser-origin-forbidden
            - https://portfolio-performance.info/rest/problems/not-found
            - https://portfolio-performance.info/rest/problems/method-not-allowed
            - https://portfolio-performance.info/rest/problems/file-not-open
            - https://portfolio-performance.info/rest/problems/ambiguous-alias
            - https://portfolio-performance.info/rest/problems/delete-blocked
            - https://portfolio-performance.info/rest/problems/missing-price
            - https://portfolio-performance.info/rest/problems/password-required
            - https://portfolio-performance.info/rest/problems/open-failed
            - https://portfolio-performance.info/rest/problems/file-loading
            - https://portfolio-performance.info/rest/problems/save-failed
            - https://portfolio-performance.info/rest/problems/validation
            - https://portfolio-performance.info/rest/problems/user-interaction
            - https://portfolio-performance.info/rest/problems/pairing-pending
            - https://portfolio-performance.info/rest/problems/pairing-cooldown
            - https://portfolio-performance.info/rest/problems/internal-error
        title:
          type: string
          description: Short, human-readable summary of the problem kind.
        status:
          type: integer
          description: The HTTP status code, repeated for convenience.
        detail:
          type: string
          description: |
            Human-readable explanation specific to this occurrence. Present only
            when there is something occurrence-specific to say.
        errors:
          type: array
          description: |
            Present on validation (`422`), some conflict (`409`), and invalid
            query parameter (`400`) problems: all field-level violations,
            reported at once.
          items:
            $ref: "#/components/schemas/FieldError"
        pairing_endpoint:
          type: string
          description: |
            RFC 9457 extension member, present on `401 unauthorized`: the path
            where a client requests access interactively (`/v1/auth/requests`).

  responses:
    BadRequest:
      description: |
        The request body is not a JSON object, or a query parameter is invalid
        (`invalid-request`). Invalid query parameters are itemized in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Unauthorized:
      description: |
        Missing or invalid bearer token (`unauthorized`). The problem body
        carries a `pairing_endpoint` extension member naming the path where a
        client can request access interactively.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            default:
              value:
                type: https://portfolio-performance.info/rest/problems/unauthorized
                title: Missing or invalid bearer token
                status: 401
                pairing_endpoint: /v1/auth/requests

    Forbidden:
      description: |
        The request was not addressed as loopback (`forbidden-host`) or it carried
        an `Origin` header (`browser-origin-forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: |
        Unknown file, **file not enabled**, or unknown entity (`not-found`). A file
        that is not enabled is deliberately indistinguishable from one that does not
        exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Conflict:
      description: |
        The addressed file or entity cannot serve the request in its current state:
        `file-not-open` (enabled but not open — open it with `POST /v1/files/open`),
        `ambiguous-alias` (the alias matches several records — use the `id`),
        `ambiguous-name` (several watchlists or plans share the addressed name), or,
        on delete, `delete-blocked` (the entity is still referenced; `errors` names
        by what). Generating investment plan transactions may answer
        `missing-price` (an instrument has no price for a due date).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    ValidationFailed:
      description: |
        One or more fields were rejected (`validation`). See `errors` for every
        violation; nothing is applied unless everything validates.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unknownCurrency:
              value:
                type: https://portfolio-performance.info/rest/problems/validation
                title: Validation failed
                status: 422
                errors:
                  - field: currencyCode
                    code: unknown-currency
                    message: XYZ is not a known currency

    TooManyPairingRequests:
      description: |
        Another pairing request is awaiting the user's decision
        (`pairing-pending`), or a previous request was declined and a cool-down
        is active (`pairing-cooldown`). Respect `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Locked:
      description: |
        A modal dialog is open or the user is editing a table cell, so the write was
        refused rather than clobbered (`user-interaction`). **Normal and
        temporary** — respect `Retry-After` and try again.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    InternalError:
      description: An unexpected error (`internal-error`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
