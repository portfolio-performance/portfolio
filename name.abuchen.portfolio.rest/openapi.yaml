                    warnings: []
                    items:
                      - status: closed
                        direction: long
                        instrument:
                          uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                          name: Apple Inc.
                          currencyCode: USD
                        investmentAccount:
                          uuid: 1d3f5a7c-9e0b-4c2d-8f6a-3b5d7e9f1a2c
                          name: Broker Depot
                        start: "2024-03-04T00:00:00"
                        end: "2025-11-18T00:00:00"
                        shares: 10
                        transactionCount: 2
                        entryValue: { value: 1010.5, currency: EUR }
                        exitValue: { value: 1320, currency: EUR }
                        profitLoss: { value: 309.5, currency: EUR }
                        holdingPeriodDays: 624
                        irr: 0.1782
                        return: 0.3063
                        note: rebalancing
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A per-client access token, obtained through interactive pairing
        (`POST /v1/auth/requests`) or minted manually in Preferences → MCP Server & REST API
        ("Add client"). The user can revoke each client individually; a
        session-scoped token additionally expires when the application quits.

  parameters:
    File:
      name: file
      in: path
      required: true
      description: |
        The file's `use` value, as returned by `GET /v1/files` — always its `id`.
        Send it exactly; a `label` is a display name and never an address. An
        `alias` is accepted too, for hand-written scripts, but the user can
        rename it at any time; an alias that matches several records is
        rejected `409 ambiguous-alias`.
      schema:
        type: string
    Uuid:
      name: uuid
      in: path
      required: true
      description: The `uuid` of the entity within the file
      schema:
        type: string
    OpeningDate:
      name: openingDate
      in: query
      required: true
      description: |
        The opening valuation date. An activity dated exactly on it belongs to
        the opening balance, not to the period.
      schema:
        type: string
        format: date
    ClosingDate:
      name: closingDate
      in: query
      required: false
      description: |
        The closing valuation date (default: today). Must be strictly after
        `openingDate`; an empty or inverted range is rejected `400
        invalid-range`. Future dates are accepted and value at the last known
        prices; the time-weighted figures stop at today, which the response
        states as `timeWeightedUntil`.
      schema:
        type: string
        format: date
    ReportingCurrency:
      name: reportingCurrency
      in: query
      required: false
      description: |
        The currency the whole report is expressed in (default: the file's base
        currency). A currency pair without an exchange rate series converts 1:1
        — the same silent fallback the application itself applies.

        Request and response name this concept identically, so a client can send
        back what it read. The two other currency concepts keep their own names:
        a `MonetaryValue`'s `currency` is what one amount is expressed in, and an
        entity's `currencyCode` is its own declared currency.
      schema:
        type: string
    InstrumentCostMethod:
      name: costMethod
      in: query
      required: false
      description: |
        The cost basis method (default: `fifo`). It shifts the split between
        realized and unrealized gains and the `periodCostBasis` that goes with
        them; it does not affect `closingValue`, `ttwror` or `irr`. Echoed in
        the response.
      schema:
        type: string
        enum: [fifo, moving-average]
        default: fifo
    TaxesAndFees:
      name: taxesAndFees
      in: query
      required: false
      description: |
        Whether the taxes and fees embedded in a trade are part of the cost
        basis (default: `included`). It applies to `periodCostBasis` and to the
        capital gains figures **together**, so that the two stay comparable.

        It does *not* change `expenses.fees` and `expenses.taxes`, which always
        report the charges themselves, nor any return ratio. Echoed in the
        response.
      schema:
        type: string
        enum: [included, excluded]
        default: included
    Metrics:
      name: metrics
      in: query
      required: false
      description: |
        A comma-separated selection of metric groups (default: all seven). An
        unselected group is an absent key in each item; a selected group keeps
        the exact meaning it has when every group is requested — this projects a
        fixed schema, it does not compose one.

        Selection is by group because the cost boundary is a group boundary:
        `timeWeighted` and `risk` are backed by a daily valuation series per
        instrument and dominate the cost of a request, while the other five are
        cheap linear passes. An unknown group name is rejected `400
        invalid-value`. Echoed in the response.
      schema:
        type: array
        items:
          type: string
          enum:
            [valuation, gains, income, expenses, moneyWeighted, timeWeighted, risk]
      style: form
      explode: false
    TradeStatus:
      name: status
      in: query
      required: false
      description: |
        Which trades to return (default: both). A comma-separated list of
        `open` and `closed`. Echoed in the response as an array, in the order
        above rather than the order sent.
      schema:
        type: array
        items:
          type: string
          enum: [open, closed]
        default: [open, closed]
      style: form
      explode: false
    InstrumentQuery:
      name: query
      in: query
      required: false
      description: |
        Only the instruments this finds: one whose name contains it, or whose
        ISIN, WKN or ticker symbol equals it — all ignoring case and
        surrounding whitespace. Omit it to list every instrument; a blank
        value is rejected `400 invalid-request`, with an `errors` entry for
        `query` whose code is `invalid-value`.
      schema:
        type: string
        minLength: 1
    TradeFrom:
      name: from
      in: query
      required: false
      description: |
        The first day of the period, as `YYYY-MM-DD`. Only trades still held
        on or after it are returned: a trade that closed before it is left
        out, an open one is kept. Omit it for no lower bound. Echoed in the
        response when given.
      schema:
        type: string
        format: date
    TradeTo:
      name: to
      in: query
      required: false
      description: |
        The last day of the period, as `YYYY-MM-DD`, not before `from`
        (`invalid-range` otherwise). Only trades that started on or before it
        are returned. With `from`, this keeps every trade held at some point
        of the period — closed within it, or open through it. Omit it for no
        upper bound. Echoed in the response when given.
      schema:
        type: string
        format: date
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Where a page continues: the `page.nextCursor` of the page before, or
        the `cursor` of any item of a page - the page then starts after that
        item. Empty for the first page. Opaque, and only good for the list it
        came from: the same file, for one instrument's trades that instrument,
        and the same filters that decide which items the list holds (`query`;
        `status`, `grouping`, `from`, `to`) - `invalid-value` otherwise, as for
        a cursor this API did not write. Cost method, taxes and currency change
        only the figures and keep a cursor good. With `cursor` or `limit` the
        response carries `page`, and every item its `cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: |
        At most this many items. Omit it for every item after `cursor`. A
        whole number of at least 1 (`invalid-value` otherwise). With `cursor`
        or `limit` the response carries `page`.
      schema:
        type: integer
        minimum: 1
    TradeGrouping:
      name: grouping
      in: query
      required: false
      description: |
        How matched lots are gathered into trades (default: `combined`).
        `combined` makes one trade out of the acquisitions that a sale closed;
        `per-lot` reports each acquisition as its own trade.

        This is **not** a lot matching strategy — matching is always FIFO and
        cannot be changed. An unknown value is rejected rather than silently
        treated as `combined`. Echoed in the response.
      schema:
        type: string
        enum: [combined, per-lot]
        default: combined
    TradeCostMethod:
      name: costMethod
      in: query
      required: false
      description: |
        The cost basis method (default: `fifo`). It changes `entryValue`,
        `profitLoss` and `return`, which are then computed against the moving
        average cost of the shares rather than the matched lots.

        It does **not** change `irr`, which is derived from the actual cash
        flows of the lots matched first in, first out — as in the
        application's trades view — and has no moving-average counterpart. A
        request with `moving-average` therefore returns a deliberately
        mixed-basis item, whose `irr` can even differ in sign from its
        `profitLoss`. Nor does it
        change `exitValue`, which is what the shares realized or are worth.

        `entryValue`, `profitLoss` and `return` are `null` — always all three
        together — for a trade whose moving average cost is undefined. That is
        the case for every **short** trade, which was never acquired and so has
        no acquisition cost, and for a trade no performance record backs.
        `exitValue` and `irr` stay defined. Echoed in the response.
      schema:
        type: string
        enum: [fifo, moving-average]
        default: fifo
    TradeTaxesAndFees:
      name: taxesAndFees
      in: query
      required: false
      description: |
        Whether the taxes and fees of the trade's own transactions are part of
        its values (default: `included`). It moves `entryValue`, `exitValue`
        and `profitLoss` **together**, so that
        `profitLoss = exitValue - entryValue` keeps holding for a long trade
        (and `entryValue - exitValue` for a short one).

        It does not change `irr` or `return`, matching the rule the performance
        resource states. It has no effect on the exit side of an **open**
        trade: that is a valuation at the market price, on which no charges
        have been incurred. Echoed in the response.
      schema:
        type: string
        enum: [included, excluded]
        default: included

  schemas:
    TradesResponse:
      type: object
      description: |
        The trades matching the request, with the parameters they were computed
        with echoed back and the securities that could not be reconciled.
      required:
        [
          reportingCurrency,
          costMethod,
          taxesAndFees,
          grouping,
          valuationDate,
          status,
          fxWarnings,
          fxStaleRates,
          warnings,
          items,
        ]
      properties:
        reportingCurrency:
          type: string
          description: |
            The currency every amount in this response has been converted into
            — the `reportingCurrency` query parameter, or the file's base
            currency. Not to be confused with a `MonetaryValue`'s `currency`
            (one amount) or an instrument's `currencyCode` (its own declared
            currency).
        costMethod:
          type: string
          enum: [fifo, moving-average]
        taxesAndFees:
          type: string
          enum: [included, excluded]
        grouping:
          type: string
          enum: [combined, per-lot]
        valuationDate:
          type: string
          format: date
          description: |
            The date the open trades were valued at, and the date their holding
            period runs to. Closed trades do not depend on it.
        from:
          type: string
          format: date
          description: The `from` query parameter, when one was given.
        to:
          type: string
          format: date
          description: The `to` query parameter, when one was given.
        status:
          type: array
          description: The selected statuses, in declaration order.
          items:
            type: string
            enum: [open, closed]
        fxWarnings:
          $ref: "#/components/schemas/FxWarnings"
          description: |
            As on every report - here for every trade the collector matched for
            the instruments of the request, also one that `status`, `from` or
            `to` leaves out of `items`: the collector matches all of an
            instrument's trades, and a conversion cannot be traced back to one
            of them.
        fxStaleRates:
          $ref: "#/components/schemas/FxStaleRates"
          description: |
            Like `fxWarnings`, for every trade matched, also one that `status`,
            `from` or `to` leaves out of `items`.
        page:
          $ref: "#/components/schemas/Page"
        warnings:
          type: array
          description: |
            The securities the collector could not reconcile, each contributing
            no trades to `items`. Always present, empty when nothing failed —
            a client must be able to tell "nothing went wrong" from "this
            endpoint cannot report problems".
          items:
            $ref: "#/components/schemas/TradeWarning"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Trade"

    Page:
      type: object
      description: |
        How a paged list goes on - present only when the request named
        `cursor` or `limit`. A paged list is in an order of keys that an edit
        elsewhere in the file does not change: instruments by `uuid`; trades by
        instrument, start, investment account, closing transaction and the
        shares, amount and id of the opening transaction. A page continues
        after the key of its cursor, so an item added or removed between two
        pages does not shift the others: every item that stays in the list for
        the whole walk comes exactly once. An item added before the cursor comes
        only with a new walk from the first page; a trade whose start,
        investment account or closing transaction changes gets a new key, and
        may then come twice or not at all. Trades opened by transactions of the
        file are told apart by the id of that transaction, so removing one of
        several alike lots cannot hide the others from a cursor that has passed
        them. For trades, `fxWarnings`, `fxStaleRates` and `warnings` describe
        the whole list, not only the page.
      required: [limit, total, nextCursor]
      properties:
        limit:
          type: [integer, "null"]
          description: The `limit` asked for, or `null` for none.
        total:
          type: integer
          description: How many items the whole list holds.
        nextCursor:
          type: [string, "null"]
          description: |
            The `cursor` for the next page - the cursor of this page's last
            item - or `null` when this is the last one.

    TradeWarning:
      type: object
      description: |
        One security whose transactions do not add up, and which therefore
        contributes no trades. The message is English regardless of the
        application's language.
      required: [instrument, code, message]
      properties:
        instrument:
          $ref: "#/components/schemas/InstrumentReference"
        code:
          type: string
          description: |
            Why the collector gave up on this security.

            **Open set:** new codes may be added within v1. Whatever the code,
            the instrument contributed no trades; `message` says why.
          x-extensible-enum:
            [
              no-holdings-for-sell,
              missing-holdings-for-sell,
              no-holdings-for-transfer,
              missing-holdings-for-transfer,
            ]
        message:
          type: string

    InstrumentReference:
      type: object
      description: |
        A pointer to an instrument. Join to `GET .../instruments/{uuid}` by
        `uuid`; the ISIN, WKN and ticker are deliberately not repeated here.
      required: [uuid, name, currencyCode]
      properties:
        uuid:
          type: string
        name:
          type: string
        currencyCode:
          type: [string, "null"]
          description: |
            The instrument's own declared currency, or `null` for a
            currency-less instrument such as an index or a CPI series. The key
            is **always present** (hence `required`); only its value may be
            null — the same rule as on `Instrument`.

    InvestmentAccountReference:
      type: object
      description: |
        A pointer to an investment account. Join to
        `GET .../investment-accounts/{uuid}` by `uuid`.
      required: [uuid, name]
      properties:
        uuid:
          type: string
        name:
          type: string

    Trade:
      type: object
      description: |
        One set of purchases matched against the sales that closed them. Has no
        id: a trade is recomputed on every request and its identity would not
        survive `grouping` changing or a transaction being edited.
      required:
        [
          status,
          direction,
          instrument,
          investmentAccount,
          start,
          end,
          shares,
          transactionCount,
          entryValue,
          exitValue,
          profitLoss,
          holdingPeriodDays,
          irr,
          return,
        ]
      properties:
        cursor:
          type: string
          description: |
            Only in a paged list: the `cursor` for the page that continues
            after this trade.
        status:
          type: string
          enum: [open, closed]
          description: |
            `closed` when the shares have been fully sold. An `open` trade has
            a null `end`, and its exit-side values are a valuation rather than
            a realized result.
        direction:
          type: string
          enum: [long, short]
          description: |
            `long` when the trade opened with a purchase. For a `short` trade
            `profitLoss` is entry minus exit, the reverse of a long one — and
            `shares` is positive in both cases, so this cannot be inferred from
            the other fields.
        instrument:
          $ref: "#/components/schemas/InstrumentReference"
        investmentAccount:
          $ref: "#/components/schemas/InvestmentAccountReference"
        start:
          type: string
          description: |
            When the trade was opened, as a **local** date and time in
            `YYYY-MM-DDTHH:MM:SS` — always with seconds, and deliberately
            without a UTC offset: the model records no timezone, and adding the
            server's would attribute one the file may not have been kept in.
            Not an RFC 3339 `date-time` for that reason.
        end:
          type: [string, "null"]
          description: |
            When the trade was closed, in the same format as `start`; `null`
            while the trade is open.
        shares:
          type: number
          description: The number of shares the trade covers, always positive.
        transactionCount:
          type: integer
          description: |
            How many transactions the trade was matched from — 2 for a clean
            buy and sell, more for an accumulated or partially sold position.
        entryValue:
          oneOf:
            - $ref: "#/components/schemas/MonetaryValue"
            - type: "null"
          description: |
            What acquiring the shares cost. Follows `costMethod` and
            `taxesAndFees`. `null` when `costMethod=moving-average` and the
            moving average cost is undefined for this trade — in particular for
            every `short` trade, which was never acquired. `profitLoss` and
            `return` are `null` whenever this is.
        exitValue:
          $ref: "#/components/schemas/MonetaryValue"
          description: |
            What selling the shares realized, or — for an open trade — what
            they are worth at `valuationDate`. Follows `taxesAndFees` for a
            closed trade; an open trade has incurred no charges. Does not
            follow `costMethod`.
        profitLoss:
          oneOf:
            - $ref: "#/components/schemas/MonetaryValue"
            - type: "null"
          description: |
            `exitValue - entryValue` for a long trade, the reverse for a
            short one — so check `direction` before subtracting the two
            yourself. Signed: it is a term of that reconciling difference.
            Follows `costMethod` and `taxesAndFees`, and is `null` under
            exactly the same condition as `entryValue`.
        holdingPeriodDays:
          type: integer
          description: |
            The share-weighted average number of days the shares were held,
            counted to `end` or, for an open trade, to `valuationDate`.
        transactionsAfterValuationDate:
          type: integer
          description: |
            How many of the trade's transactions are dated after
            `valuationDate` — a savings plan booked ahead, say. Omitted when
            none is. Trades are matched over every transaction, as in the
            application's trades view, while an open trade is valued at the
            price of `valuationDate`: with such transactions, `shares`,
            `entryValue`, `exitValue` and `profitLoss` are those after the last
            of them, not the position held on `valuationDate`. That position is
            in `GET .../holdings`.
        irr:
          type: [number, "null"]
          description: |
            The internal rate of return as a fraction (0.0523 is 5.23 %),
            annualized, from the actual cash flows of the lots matched first
            in, first out. Does **not** follow `costMethod` or `taxesAndFees` —
            there is no variant of it — so under `moving-average` it can differ
            in sign from `profitLoss`. Annualizing makes it extreme for a short
            holding period. `null` when the model cannot define it.
        return:
          type: [number, "null"]
          description: |
            The total return as a fraction (0.0523 is 5.23 %), not annualized.
            Follows `costMethod` but not `taxesAndFees`. `null` when the model
            cannot define it, and always when `entryValue` is.
        note:
          type: string
          description: The note on the trade's last transaction, when it has one.

    File:
      type: object
      description: An open, enabled portfolio file you may address.
      required: [id, label, path, use]
      properties:
        id:
          type: string
          description: |
            Stable identity of the file, keyed by path. This is what `use`
            carries.
        alias:
          type: string
          description: |
            Optional human-friendly handle the user assigned to the file. It is
            accepted as an address, but the user can rename it at any time, so
            a client that stores an address should store `use`.
        use:
          type: string
          description: |
            The value to pass as the `{file}` path parameter — always the `id`,
            because an alias can be renamed between listing the files and the
            next call. Included so a caller never has to choose between the two.
        label:
          type: string
          description: The file's display label in the application.
        path:
          type: string
          description: |
            The file's path on disk. Identity is keyed by path, so a *different*
            file copied over an enabled path inherits that path's access.

    PairingRequestCreated:
      type: object
      description: A filed access request, awaiting the user's decision.
      required: [id, status]
      properties:
        id:
          type: string
          description: Poll `GET /v1/auth/requests/{id}` with this.
        status:
          type: string
          const: pending

    PairingRequestStatus:
      type: object
      description: The state of an access request.
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, denied, expired]
        token:
          type: string
          description: |
            The bearer token; present only while `status` is `approved`, and
            delivered exactly once.
        persistent:
          type: boolean
          description: |
            Present with `token`. Whether the token survives a restart of the
            application: `false` when the user allowed access for this session
            only, and when access was allowed permanently but the application
            could not record it — the token then works until the application
            quits, and pairing has to be repeated after that.

    Instrument:
      type: object
      description: A security — stock, fund, bond, crypto, …
      required: [uuid, name, currencyCode]
      properties:
        uuid:
          type: string
        cursor:
          type: string
          description: |
            Only in a paged list: the `cursor` for the page that continues
            after this item.
        name:
          type: string
        currencyCode:
          type: [string, "null"]
          description: |
            ISO 4217 currency code, or `null` for a currency-less instrument such
            as an index or a CPI series. The key is **always present** (hence
            `required`); only its value may be null.
        isin:
          type: string
          description: Omitted when not set or blank.
        wkn:
          type: string
          description: Omitted when not set or blank.
        tickerSymbol:
          type: string
          description: Omitted when not set or blank.
        note:
          type: string
          description: Omitted when not set or blank.
        attributes:
          type: object
          description: |
            The instrument's set custom attributes, keyed by attribute id.
            Only attributes that have a value and a supported scalar type
            appear; the key is omitted entirely when none do. Each value is
            typed JSON — a string, number, or boolean (dates are ISO-8601
            strings). Resolve an id to its precise type via
            `GET /v1/files/{file}/instruments/attribute-types`.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean

    InstrumentPatch:
      type: object
      description: |
        A JSON Merge Patch (RFC 7386) over an instrument. Every field is optional;
        an omitted field is left untouched. Fields typed `["string","null"]` accept
        an explicit `null` to clear them. Custom attributes are patched through the
        nested `attributes` object. Everything else — prices, quote feeds, events,
        the retired flag — is read-only in v1.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Non-empty; cannot be cleared.
        currencyCode:
          type: [string, "null"]
          description: |
            A known ISO 4217 currency, or `null` to clear it (marking the
            instrument an index). Clearing is rejected for an exchange rate
            (`exchange-rate-requires-currency`). Any currency change — including
            clearing — is **rejected while the instrument has transactions**
            (`locked-by-transactions`), matching the UI's rule.
        isin:
          type: [string, "null"]
          description: |
            Checked as the application's ISIN column checks it: surrounding
            whitespace is ignored, and what is left must be twelve characters
            with a matching check digit, or the patch is rejected with
            `invalid-isin`. A blank value clears the ISIN, like `null`.
        wkn:
          type: [string, "null"]
        tickerSymbol:
          type: [string, "null"]
        note:
          type: [string, "null"]
        attributes:
          type: object
          description: |
            A nested merge patch over the custom attributes, keyed by attribute
            id: a present value sets the attribute, an explicit `null` clears it,
            an absent id is left untouched. Values are typed JSON per the
            attribute's `type` (see the attribute-types endpoint). Writing an
            unknown id, a non-applicable or compound-typed attribute, or a value
            of the wrong type is rejected with 422 `validation`.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"

    AttributeDefinition:
      type: object
      description: A custom attribute definition applicable to an instrument.
      required: [id, name, type, supported]
      properties:
        id:
          type: string
          description: Stable identifier; the key used in an instrument's `attributes` map.
        name:
          type: string
          description: User-facing name (the desktop UI shows this, not the id).
        columnLabel:
          type: string
          description: Short label; omitted when not set.
        type:
          type: string
          description: |
            The value type. Supported scalars — `string`, `boolean`, `date`
            (ISO-8601), `amount`, `quote`, `shares`, `percent` (a fraction,
            e.g. 0.007 for 0.7%), `number` (an unscaled decimal; where the
            desktop reads such an attribute as a percentage — the expected
            dividends column — 5 means 5%). Compound — `limit-price`,
            `bookmark`, `image` — appear with `supported: false`.

            **Open set:** new types may be added within v1, as the application
            gains them. Treat an unknown type as `supported: false`.
          x-extensible-enum:
            - string
            - boolean
            - date
            - amount
            - quote
            - shares
            - percent
            - number
            - limit-price
            - bookmark
            - image
        supported:
          type: boolean
          description: Whether v1 can read and write this attribute.

    CashAccount:
      type: object
      description: An account holding cash in a single currency.
      required: [uuid, name, currencyCode]
      properties:
        uuid:
          type: string
        name:
          type: string
        currencyCode:
          type: string
          description: ISO 4217 currency code.
        note:
          type: string
          description: Omitted when not set or blank.

    InvestmentAccount:
      type: object
      description: |
        An account holding instrument positions. Its cash side is a separate cash
        account, named by `referenceCashAccount`.
      required: [uuid, name]
      properties:
        uuid:
          type: string
        name:
          type: string
        referenceCashAccount:
          type: string
          description: |
            The `uuid` of the cash account backing this investment account. Omitted
            when not set.
        note:
          type: string
          description: Omitted when not set or blank.

    MonetaryValue:
      type: object
      description: |
        An amount of money: a plain decimal number (never scientific notation on
        the wire) plus its ISO 4217 currency code.
      required: [value, currency]
      properties:
        value:
          type: number
        currency:
          type: string
          description: |
            The currency of *this amount*. The API keeps three currency concepts
            apart on purpose: `currency` is what one amount is expressed in,
            `reportingCurrency` is what a whole report has been converted into,
            and `currencyCode` is an entity's own declared currency.

    Price:
      type: object
      description: |
        The price per share a valuation is based on: the latest price on or
        before the valuation date — possibly well before it (stale quote, or the
        fallback to the price of the position's last transaction).
      required: [value, currency]
      properties:
        value:
          type: number
        currency:
          type: string
          description: |
            The instrument's own currency. Always set: only held instruments
            have a price here, and the application refuses transactions on an
            instrument without a currency.
        date:
          type: string
          format: date
          description: The date the price is from.

    FxWarning:
      type: object
      description: |
        One currency pair a report converted at a rate of 1 because the file has
        nothing to convert with — amounts of `currency` are shown at face value in
        `reportingCurrency`, not exchanged. Only pairs the report's calculation
        actually converted are named: an empty account or an instrument not held
        never is.
      required: [currency, reportingCurrency, reason]
      properties:
        currency:
          type: string
          description: The currency the amounts are natively in, shown unconverted.
        reportingCurrency:
          type: string
          description: |
            The currency the amounts were converted into: the report's reporting
            currency, or an instrument's own currency for the figures stated in
            it (such as `localValuation`).
        reason:
          type: string
          description: |
            **Open set:** further reasons may be added within v1; treat an unknown
            one as "this pair was converted at 1:1, for a reason not described
            here". `no-series` — no exchange rate series exists for the pair at
            all. `no-rate` — a series exists but answered no rate for at least one
            date the report converted at (it holds no rates, or — for a series
            built from an exchange-rate instrument — its quote for that day is
            zero). Neither is the case where a series holds rates and answers a
            date before its first quote with that first quote, which is a
            different inaccuracy and not reported here.
          x-extensible-enum: [no-series, no-rate]

    FxWarnings:
      type: array
      description: |
        Every currency pair this report converted at 1:1 because nothing to
        convert with was configured. Always present, empty when every pair has
        rates — the same rule as `warnings` on a computed collection, so a client
        can tell "nothing fell back" apart from "this report did not look". A
        pair can be named whose only amount came out as zero: some calculations
        look up the rate before they know the amount.
      items:
        $ref: "#/components/schemas/FxWarning"

    FxStaleRates:
      type: array
      description: |
        Every currency pair this report converted at a rate more than seven
        days older than the date it converted at (or than today, for a later
        date) — a series that stopped being published goes on answering with
        its last rate, and the currency effect of those amounts is then frozen
        at it rather than measured. A stale conversion is not 1:1, so it is
        no `fxWarnings` entry itself; the same pair can still be one for
        another conversion that fell back. Always present, empty when every
        rate used was recent.
      items:
        $ref: "#/components/schemas/FxStaleRate"

    FxStaleRate:
      type: object
      required: [currency, reportingCurrency, rateDate, daysOld]
      properties:
        currency:
          type: string
          description: The currency the amounts were natively in.
        reportingCurrency:
          type: string
          description: |
            The currency they were converted into: the report's reporting
            currency, or an instrument's own currency for its local figures.
        rateDate:
          type: string
          format: date
          description: |
            The date of the oldest rate a stale conversion of this pair used;
            a conversion at a rate that was recent for its date does not count,
            however old that date. For a pair reached through a third currency
            (USD to CHF through EUR), the oldest of its steps.
        daysOld:
          type: integer
          description: |
            How many days a rate was older than the date it converted at — the
            largest gap the stale conversions of this pair met, not necessarily
            that of the conversion at `rateDate`.

    Holding:
      type: object
      description: |
        One line of the statement of assets — an instrument position or a cash
        account balance.
      required: [type, uuid, name, valuation, weight]
      properties:
        type:
          type: string
          description: |
            **Open set:** new kinds of holding may be added within v1. A holding
            of an unknown type still counts in `totalAssets` and `weight`; only
            the join to master data is unknown.
          x-extensible-enum: [instrument, cash-account]
        uuid:
          type: string
          description: |
            Joins to `GET .../instruments/{uuid}` (type `instrument`) or
            `GET .../cash-accounts/{uuid}` (type `cash-account`) for master data.
        name:
          type: string
        shares:
          type: number
          description: The number of shares held. Instruments only.
        price:
          allOf:
            - $ref: "#/components/schemas/Price"
          description: Instruments only.
        priceStale:
          type: boolean
          description: |
            Instruments only, when `price.date` is known. Whether the quote behind
            this valuation is out of date: `true` when more than one trading day
            passed without a quote (`priceMissedTradingDays` > 1) — a quote feed
            that stopped, or a valuation that fell back to the price of the last
            transaction. A weekend or a holiday does not make a quote stale, and
            one missed trading day is tolerated because funds publish their price
            a day late. Never `true` for an instrument priced by hand (quote feed
            `MANUAL`): its price changes when the user decides, as in the
            application's data quality view — its age fields still say how old
            the price is.
        priceAgeDays:
          type: integer
          description: |
            Instruments only, when `price.date` is known. Calendar days between
            `price.date` and the response's `date` — or today, when `date` lies
            in the future, since no quote can be younger than today's. Never
            negative, so a quote dated after `date` reads 0 rather than implying
            the valuation happened before it.
        priceMissedTradingDays:
          type: integer
          description: |
            Instruments only, when `price.date` is known. The trading days strictly
            between `price.date` and the response's `date` — or today, when
            `date` lies in the future — counted in the instrument's own trade
            calendar. That end day itself does not count: its close cannot be
            known before the day is over. On a Sunday, Friday's quote has missed
            none, and valued at a future date today's quote has missed none
            either.
        priceManual:
          type: boolean
          description: |
            Instruments only, present and `true` when the instrument is priced
            by hand (quote feed `MANUAL`). Such a price changes when the user
            decides, so `priceStale` is never `true` for it however old it is —
            this field says why; the age fields still say how old it is.
        valuation:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The holding's value in the reporting currency.
        weight:
          type: number
          description: |
            The holding's fraction of total assets — not a percentage. A cash
            account can hold a negative balance (a loan, a credit card); its
            weight is then negative and the others are divided by the smaller
            net total, so a weight can exceed 1. Rounded to 8 decimal places, so
            the weights add up to 1 within that rounding, unless total assets are
            zero - then every weight is 0.
        localValuation:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The holding's value in its own currency, before conversion into the
            reporting currency. Present only when the two currencies differ.

    Performance:
      type: object
      description: |
        The return and value-change of the file between two valuation dates.
      required:
        - openingDate
        - closingDate
        - timeWeightedUntil
        - reportingCurrency
        - costMethod
        - ttwror
        - irr
        - breakdown
        - fxWarnings
        - fxStaleRates
      properties:
        openingDate:
          type: string
          format: date
          description: The opening valuation date.
        closingDate:
          type: string
          format: date
          description: The effective closing valuation date.
        timeWeightedUntil:
          type: string
          format: date
          description: |
            The last day `ttwror` is measured to: `closingDate`, or today when
            `closingDate` lies in the future, because the time-weighted engine
            never runs past today. The breakdown and `irr` run to `closingDate`
            and include the transactions dated after today, valued at the
            latest known prices — a planned transaction shows its effect there.
            When the two dates differ the report mixes two periods, and neither
            return is a forecast. When `openingDate` is today or later nothing
            could be measured, and `ttwror` and `irr` are `null`.
        reportingCurrency:
          type: string
          description: |
            The currency every amount in the breakdown is expressed in — the
            `reportingCurrency` query parameter, or the file's base currency.
            Not to be confused with a `MonetaryValue`'s `currency` (one amount)
            or an entity's `currencyCode` (its own declared currency).
        costMethod:
          type: string
          enum: [fifo, moving-average]
          description: |
            The cost basis method the realized/unrealized split was computed
            with — echoed because it moves the numbers, so a stored response
            stays interpretable.
        ttwror:
          type: [number, "null"]
          description: |
            The true time-weighted rate of return over the interval, as a
            fraction (0.0723 is 7.23 %) — not a percentage. `null` when the
            model cannot define it for the interval, when `openingDate` is
            today or later - such a period has no price movement to measure -
            and when the file held nothing and moved no money at any time in
            the interval, which leaves no capital to measure a return on.
        irr:
          type: [number, "null"]
          description: |
            The internal (money-weighted) rate of return over the interval, as a
            fraction — not a percentage, and annualized, so over a period of a
            few days it can be extreme. `null` when `openingDate` is today or
            later, when the file held nothing in the interval (see `ttwror`),
            and when the model cannot define it for the interval.
        breakdown:
          $ref: "#/components/schemas/PerformanceBreakdown"
        fxWarnings:
          $ref: "#/components/schemas/FxWarnings"
        fxStaleRates:
          $ref: "#/components/schemas/FxStaleRates"

    PerformanceBreakdown:
      type: object
      description: |
        A signed decomposition of the value change: the fields add up to the
        closing value —
        `openingValue + unrealizedCapitalGains + realizedCapitalGains + income +
        fees + taxes + currencyGains + netDeposits = closingValue`.
      required:
        - openingValue
        - unrealizedCapitalGains
        - realizedCapitalGains
        - income
        - fees
        - taxes
        - currencyGains
        - netDeposits
        - closingValue
      properties:
        openingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The portfolio's value at `openingDate`.
        unrealizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The change in value of positions still held; negative for a loss.
        realizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gains locked in by sales during the interval; negative for a loss.
        income:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Dividends and interest received, net of interest charged.
        fees:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Fees paid, as a negative contribution (positive only for a net refund).
        taxes:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: Taxes paid, as a negative contribution (positive only for a net refund).
        currencyGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gain or loss attributable to exchange rate movements.
        netDeposits:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            External capital flow over the interval: deposits and inbound
            deliveries less removals and outbound deliveries. Not part of the
            performance-driven change, but required for the value reconciliation.
        closingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The portfolio's value at `closingDate`.

    InstrumentPerformanceContext:
      type: object
      description: |
        The interval and the parameters a per-instrument report was computed
        with, plus the currency pairs it converted at 1:1. All six parameters are
        echoed, so that a stored or forwarded response stays interpretable —
        three of them move the numbers.
      required:
        - openingDate
        - closingDate
        - timeWeightedUntil
        - reportingCurrency
        - costMethod
        - taxesAndFees
        - metrics
        - fxWarnings
        - fxStaleRates
      properties:
        openingDate:
          type: string
          format: date
          description: The opening valuation date.
        closingDate:
          type: string
          format: date
          description: The effective closing valuation date.
        timeWeightedUntil:
          type: string
          format: date
          description: |
            The last day the `timeWeighted` and `risk` figures are measured to:
            `closingDate`, or today when `closingDate` lies in the future,
            because the time-weighted engine never runs past today. Valuation,
            gains, income, expenses and `moneyWeighted` run to `closingDate`
            and include the transactions dated after today, valued at the latest
            known prices. When the two dates differ the report mixes two
            periods, and neither return is a forecast. When `openingDate` is
            today or later nothing could be measured: every return and every
            risk ratio is `null`; `longestDrawdownDays`, which the 1.0 contract
            keeps non-null, is `0`.
        reportingCurrency:
          type: string
          description: |
            The currency every amount in this report has been converted into.
            Not to be confused with a `MonetaryValue`'s `currency` (one amount)
            or an instrument's `currencyCode` (its own declared currency) — on
            the item route the last two sit right next to this one.
        costMethod:
          type: string
          enum: [fifo, moving-average]
          description: The cost basis method that was applied.
        taxesAndFees:
          type: string
          enum: [included, excluded]
          description: |
            Whether the cost basis includes the taxes and fees embedded in a
            trade.
        metrics:
          type: array
          description: The metric groups present in each item, in schema order.
          items:
            type: string
            enum:
              [valuation, gains, income, expenses, moneyWeighted, timeWeighted, risk]
        fxWarnings:
          $ref: "#/components/schemas/FxWarnings"
        fxStaleRates:
          $ref: "#/components/schemas/FxStaleRates"

    InstrumentPerformance:
      type: object
      description: |
        One instrument's performance over the interval. Only the identity fields
        are always present; each metric group appears exactly if it was
        selected.
      required: [uuid, name, currencyCode]
      properties:
        uuid:
          type: string
          description: |
            Joins to `GET .../instruments/{uuid}` for the master data. The ISIN,
            WKN and ticker are deliberately not repeated here.
        name:
          type: string
        currencyCode:
          type: string
          description: |
            The instrument's *own* declared currency — what explains a non-zero
            currency component below. Always set: only instruments with
            transactions appear here, and the application refuses transactions
            on an instrument without a currency. Distinct from
            `reportingCurrency`, which every amount in this report is expressed
            in.
        valuation:
          $ref: "#/components/schemas/InstrumentValuation"
        gains:
          $ref: "#/components/schemas/InstrumentGains"
        income:
          $ref: "#/components/schemas/InstrumentIncome"
        expenses:
          $ref: "#/components/schemas/InstrumentExpenses"
        moneyWeighted:
          type: object
          required: [irr]
          properties:
            irr:
              type: [number, "null"]
              description: |
                The internal (money-weighted) rate of return on this instrument
                over the interval, as a fraction — not a percentage. `null` when
                the model cannot define it.
        timeWeighted:
          type: object
          required: [ttwror, ttwrorAnnualized]
          properties:
            ttwror:
              type: [number, "null"]
              description: |
                The true time-weighted rate of return over the interval, as a
                fraction (0.0812 is 8.12 %). `null` when the model cannot define
                it.
            ttwrorAnnualized:
              type: [number, "null"]
              description: |
                The same return expressed as an annual rate. `null` when the
                model cannot define it.
        risk:
          $ref: "#/components/schemas/InstrumentRisk"

    InstrumentValuation:
      type: object
      description: |
        What the position was worth at each end of the interval, and what it
        stands in the books at.
      required: [shares, openingValue, closingValue, periodCostBasis]
      properties:
        shares:
          type: number
          description: The number of shares held at `closingDate`; 0 for a position sold during the period.
        openingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The position's value at `openingDate`; zero for an instrument first
            acquired during the period.
        closingValue:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The position's value at `closingDate`. Equals this instrument's
            `valuation` in `GET .../holdings?date={closingDate}`.
        periodCostBasis:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The cost basis of the shares still held, **relative to this
            period**: a lot carried in from before `openingDate` enters at its
            valuation on that date, not at what was once paid for it. A position
            bought years ago therefore shows this period's opening value here,
            and its lifetime gain is not derivable from this resource. (The
            unqualified acquisition cost is a separate, period-independent
            figure this API does not yet publish.)

            Whether the taxes and fees embedded in a purchase are part of it is
            decided by `taxesAndFees`, which governs the capital gains figures
            in the same breath — so that
            `closingValue - periodCostBasis = gains.unrealizedCapitalGains`
            holds under either setting.

    InstrumentGains:
      type: object
      description: |
        Capital gains, split into the part locked in by sales and the part still
        on the books. Both are measured against `periodCostBasis`, hence
        `closingValue - periodCostBasis = unrealizedCapitalGains`.
      required:
        - realizedCapitalGains
        - realizedCurrencyComponent
        - unrealizedCapitalGains
        - unrealizedCurrencyComponent
      properties:
        realizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gains locked in by sales during the interval; negative for a loss.
        realizedCurrencyComponent:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The part of `realizedCapitalGains` attributable to exchange rate
            movements. It is **contained in** that figure, not additional to it
            — do not add the two. Zero unless the instrument's `currencyCode`
            differs from `reportingCurrency`.
        unrealizedCapitalGains:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gains on the shares still held; negative for a loss.
        unrealizedCurrencyComponent:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The part of `unrealizedCapitalGains` attributable to exchange rate
            movements, contained in it exactly as its realized counterpart is.

    InstrumentIncome:
      type: object
      description: What the instrument paid out during the interval.
      required: [dividends, dividendCount]
      properties:
        dividends:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: The gross dividends received during the interval.
        dividendCount:
          type: integer
          description: The number of dividend payments during the interval.
        lastDividend:
          type: string
          format: date
          description: |
            The date of the most recent payment. Omitted when there was none —
            never a placeholder date.

    InstrumentExpenses:
      type: object
      description: |
        What the instrument cost during the interval: the charges embedded in
        its trades and dividends, plus the standalone fee and tax bookings
        attributed to it, net of refunds. Both are positive magnitudes as a
        rule, but negative when refunds outweigh the charges in the interval —
        a tax refund booked against the instrument, for example.
      required: [fees, taxes]
      properties:
        fees:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The fees charged net of fee refunds, as a positive magnitude unless
            refunds outweigh them — unlike the aggregate endpoint's
            `breakdown.fees`, which is negated so that its decomposition adds
            up.
        taxes:
          allOf:
            - $ref: "#/components/schemas/MonetaryValue"
          description: |
            The taxes charged net of tax refunds, as a positive magnitude
            unless refunds outweigh them.

    InstrumentRisk:
      type: object
      description: |
        Risk measures derived from the instrument's daily valuation series over
        the interval. All are fractions, never percentages.
      required: [volatility, semiVolatility, maxDrawdown, longestDrawdownDays]
      properties:
        volatility:
          type: [number, "null"]
          description: |
            The spread of the daily returns over the whole interval - not per
            day, and not annualized. With r = ln(1 + daily return) for each of
            the n returns that count and m their mean, it is
            sqrt(n · Σ (r − m)² / (n − 1)), as the application computes it,
            rounded. Only days the instrument was held on, as was the day
            before, and that are no holiday count, up to `timeWeightedUntil`.
            `null` when fewer than two returns count: one return has no spread,
            and 0 would read as a measured absence of risk.
        semiVolatility:
          type: [number, "null"]
          description: |
            The downside spread: the same formula with the sum taken only over
            the returns with r below m - which can be positive ones, so a
            series that only rose can have a semi-volatility above 0. The
            divisor stays n − 1 for all n returns. `null` under the same
            condition as `volatility`.
        maxDrawdown:
          type: [number, "null"]
          description: |
            The deepest peak-to-trough decline, as a **positive** fraction
            (0.231 is a 23.1 % drawdown), matching the application's own sign
            convention rather than the negative one charts often use.
        longestDrawdownDays:
          type: integer
          description: |
            The length in days of the longest stretch without a new high: from
            a peak to the next strictly higher value, or to the end of the
            period if the peak was never regained. Because it is measured
            between data points, it is never shorter than the sampling interval
            — a period with no drawdown at all still reports 1. This is **not**
            the duration of the deepest drawdown, which is a different and
            shorter interval — hence the name. `0` when `openingDate` is today
            or later: nothing could be measured, and the 1.0 contract keeps this
            field non-null — the `null` ratios next to it say so.

    InstrumentCreation:
      type: object
      description: |
        An instrument that did not exist before this call, and what the call says
        about it that the instrument record itself cannot.
      required: [instrument, fields, hasQuoteFeed, hasTransactions]
      properties:
        instrument:
          description: |
            The instrument as it now stands, `uuid` included - unlike a watchlist
            this has an identifier, and that `uuid` is how every instrument tool
            addresses it from here on.
          allOf:
            - $ref: "#/components/schemas/Instrument"
        fields:
          type: array
          description: |
            The fields it was created with, as the caller named them, with the value
            the model holds of each now. Not a difference list: a new instrument
            already answers to the file's currency before anything is set on it, so
            comparing with an earlier value would leave out the one field that is
            never empty.
          items:
            type: object
            required: [field, value]
            properties:
              field:
                type: string
              value:
                type: string
        hasQuoteFeed:
          type: boolean
          description: |
            Always `false`: no provider was asked, and no quote exists. The feed is
            set in the application.
        hasTransactions:
          type: boolean
          description: |
            Always `false`, and worth saying: while nothing refers to this
            instrument, `DELETE` on it can undo this creation.
        sameNameAs:
          type: array
          description: |
            Only when there are any: the instruments the file already has of this
            very name. Not a refusal - they are addressable by `uuid` - but a caller
            who did not mean to add a second one should hear that there are now two.
          items:
            $ref: "#/components/schemas/InstrumentReference"
        sameTickerAs:
          type: array
          description: |
            Only when there are any: the instruments carrying the same ticker symbol,
            which is ordinary across share classes and trading venues.
          items:
            $ref: "#/components/schemas/InstrumentReference"

    WatchlistChange:
      type: object
      description: |
        One watchlist after a change to it. The counts around the change are here
        rather than only in its absence, because a caller that asked for two names
        to be added wants to read, without a second call, how full the list is now.
      required: [name, created, hasIdentifier, instrumentCount, added, removed]
      properties:
        name:
          type: string
          description: |
            The list's name — its only address. Nothing else in this API can refer
            to a watchlist, and no uuid of it exists to remember.
        created:
          type: boolean
          description: |
            Whether this call brought the list into being. `false` on an update.
        hasIdentifier:
          type: boolean
          description: |
            Always `false`, and stated because every other entity of a file carries
            a `uuid`: the name above is the whole address of this one.
        instrumentCount:
          type: integer
          description: The instruments the list holds now.
        added:
          type: integer
          description: |
            How many of the instruments asked for the call put in. Fewer than the
            number named means some were already there, which is not an error.
        removed:
          type: integer
          description: |
            How many of the instruments asked for the call took out. Fewer than the
            number named means they were not in the list; see `notHeld`.
        changed:
          type: boolean
          description: |
            On an update: whether anything moved. `false` leaves the file exactly as
            it was, unsaved changes included.
        instrumentCountBefore:
          type: integer
          description: On an update: how full the list was before.
        instrumentCountAfter:
          type: integer
          description: On an update: how full it is after.
        watchlistsBefore:
          type: integer
          description: On a creation: how many lists the file had before this one.
        watchlistsAfter:
          type: integer
          description: On a creation: how many it has now.
        notHeld:
          type: array
          description: |
            On an update, and only when there were any: the instruments `remove`
            named that the list did not hold. Asked-for state that already held,
            reported rather than refused.
          items:
            $ref: "#/components/schemas/InstrumentReference"

    FieldError:
      type: object
      description: One field-level violation within a `Problem`.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The offending field (or the resource facet that blocks the operation).
        code:
          type: string
          description: |
            A stable, machine-readable reason.

            **Open set:** new codes may be added within v1. Treat an unknown
            code as a rejection of `field` for the reason given in `message`.
          x-extensible-enum:
            - required
            - invalid-type
            - invalid-value
            - invalid-range
            - out-of-range
            - too-long
            - unknown-field
            - unknown-parameter
            - duplicate-parameter
            - unknown-currency
            - locked-by-transactions
            - exchange-rate-requires-currency
            - invalid-isin
            - duplicate-identifier
            - referenced
            - unknown-attribute
            - attribute-not-applicable
            - unsupported-attribute-type
            - vehicle-not-assignable
        message:
          type: string
          description: Human-readable explanation of this one violation.

    Problem:
      type: object
      description: |
        An error, following RFC 9457 (`application/problem+json`). `title` is
        invariant for a given `type`; anything specific to the one occurrence is in
        `detail`. Validation and conflict problems additionally carry `errors`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            A URI identifying the problem kind. The distinct values are enumerated
            below; note especially that a **404 never distinguishes** an unknown
            file from a file that exists but is not enabled, that
            `no-activity-in-period` is the one 404 that says the addressed entity
            *does* exist, and that the three
            **409** kinds each call for a different response:
            `file-not-open` (a human must open the file), `ambiguous-alias` (retry
            with the `id`), `delete-blocked` (give up — the instrument is referenced),
            and the two of a watchlist: `name-taken` (that name exists and could not
            be addressed twice) or `no-such-watchlist` (no list of that name).
            `method-not-allowed` (405) is returned for any method a path does not
            list; what v1 can bring into being is a watchlist and an instrument, both
            by `POST`.

            **Open set:** new problem types may be added within v1. Treat an
            unknown `type` by its HTTP `status`.
          x-extensible-enum:
            - https://portfolio-performance.info/rest/problems/invalid-request
            - https://portfolio-performance.info/rest/problems/unauthorized
            - https://portfolio-performance.info/rest/problems/forbidden-host
            - https://portfolio-performance.info/rest/problems/browser-origin-forbidden
            - https://portfolio-performance.info/rest/problems/not-found
            - https://portfolio-performance.info/rest/problems/no-activity-in-period
            - https://portfolio-performance.info/rest/problems/method-not-allowed
            - https://portfolio-performance.info/rest/problems/request-too-large
            - https://portfolio-performance.info/rest/problems/file-not-open
            - https://portfolio-performance.info/rest/problems/ambiguous-alias
            - https://portfolio-performance.info/rest/problems/delete-blocked
            - https://portfolio-performance.info/rest/problems/validation
            - https://portfolio-performance.info/rest/problems/user-interaction
            - https://portfolio-performance.info/rest/problems/pairing-pending
            - https://portfolio-performance.info/rest/problems/pairing-cooldown
            - https://portfolio-performance.info/rest/problems/internal-error
            - https://portfolio-performance.info/rest/problems/ui-busy
            - https://portfolio-performance.info/rest/problems/ui-request-underway
            - https://portfolio-performance.info/rest/problems/calculation-timeout
            - https://portfolio-performance.info/rest/problems/server-busy
        title:
          type: string
          description: Short, human-readable summary of the problem kind.
        status:
          type: integer
          description: The HTTP status code, repeated for convenience.
        detail:
          type: string
          description: |
            Human-readable explanation specific to this occurrence. Present only
            when there is something occurrence-specific to say.
        errors:
          type: array
          description: |
            Present on validation (`422`), some conflict (`409`), and invalid
            query parameter (`400`) problems: all field-level violations,
            reported at once.
          items:
            $ref: "#/components/schemas/FieldError"
        pairingEndpoint:
          type: string
          description: |
            RFC 9457 extension member, present on `401 unauthorized`: the path
            where a client requests access interactively (`/v1/auth/requests`).

  responses:
    BadRequest:
      description: |
        The request body is not a JSON object, or a query parameter is unknown to
        this operation or invalid (`invalid-request`). Either way the offending
        names are itemized in `errors`, one entry each.

        **Every operation can answer this**, including those that take no body and
        list no parameters: an operation that lists none accepts none, and rejects
        anything sent.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Unauthorized:
      description: |
        Missing or invalid bearer token (`unauthorized`). The problem body
        carries a `pairingEndpoint` extension member naming the path where a
        client can request access interactively.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            default:
              value:
                type: https://portfolio-performance.info/rest/problems/unauthorized
                title: Missing or invalid bearer token
                status: 401
                pairingEndpoint: /v1/auth/requests

    Forbidden:
      description: |
        The request was not addressed as loopback (`forbidden-host`) or it carried
        an `Origin` header (`browser-origin-forbidden`). For a write it can also
        mean that the user was asked about the change and refused it
        (`write-declined`): nothing was changed, and the answer stands — asking
        again is not going to change it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: |
        Unknown file, **file not enabled**, or unknown entity (`not-found`). A file
        that is not enabled is deliberately indistinguishable from one that does not
        exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Conflict:
      description: |
        The addressed file or entity cannot serve the request in its current state:
        `file-not-open` (enabled but not open — a human must open it),
        `ambiguous-alias` (the alias matches several records — use the `id`), on
        delete `delete-blocked` (the instrument is referenced by transactions or
        plans), and for a watchlist `name-taken` (a list of that name exists and a
        second one could not be addressed) or `no-such-watchlist` (no list of that
        name; the violation lists the names the file does have).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    ValidationFailed:
      description: |
        One or more fields were rejected (`validation`). See `errors` for every
        violation; nothing is applied unless everything validates.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unknownCurrency:
              value:
                type: https://portfolio-performance.info/rest/problems/validation
                title: Validation failed
                status: 422
                errors:
                  - field: currencyCode
                    code: unknown-currency
                    message: XYZ is not a known currency

    TooManyPairingRequests:
      description: |
        Another pairing request is awaiting the user's decision
        (`pairing-pending`), or a previous request was declined and a cool-down
        is active (`pairing-cooldown`). Respect `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Locked:
      description: |
        A modal dialog is open or the user is editing a table cell, so the write was
        refused rather than clobbered (`user-interaction`). **Normal and
        temporary** — respect `Retry-After` and try again.

        For a write this can also mean that nobody answered the prompt asking about
        the change (`write-unanswered`). Nothing was changed, so unlike a refusal
        this one may be tried again.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    WritePending:
      description: |
        Another change is still awaiting the user's decision, so this one was not
        even asked about (`write-pending`). At most one prompt is ever on screen.
        Respect `Retry-After` and try again once that window clears.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    InternalError:
      description: An unexpected error (`internal-error`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    ServiceUnavailable:
      description: |
        Not answered now; see the overview of 503 answers above. `server-busy`
        (more requests in flight than the server serves at once, or no
        calculation slot came free in time) can reach every operation. `ui-busy`
        can reach every operation that runs on the application's UI thread -
        the file list and everything under a file - but not the version or this
        document; `ui-request-underway` only the writes among them, as a read
        that had started is refused as `ui-busy`; `calculation-timeout` only the
        calculations. Every one but `ui-request-underway` and
        `calculation-timeout` carries a `Retry-After` and is safe to send again.
      headers:
        Retry-After:
          description: Seconds to wait before sending the same request again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

