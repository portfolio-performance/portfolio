  /v1/files/{file}/taxonomies/{id}/classifications/{cid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/TaxonomyId"
      - $ref: "#/components/parameters/CategoryId"
    get:
      operationId: getCategory
      tags: [Taxonomies]
      summary: Read a category and its subtree
      responses:
        "200":
          description: The entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchCategory
      tags: [Taxonomies]
      summary: Update or move a category (JSON Merge Patch)
      description: |
        A **JSON Merge Patch** (RFC 7386): omitted fields stay untouched, an
        explicit `null` clears an optional field. Accepted as
        `application/json` or `application/merge-patch+json`. Unknown fields
        are rejected (`unknown-field`); all violations are reported at once.

        `parent` moves the category (`null`: to the top level); it cannot be
        moved below itself (`invalid-value`). `name`, `color` and `weight`
        cannot be cleared.

        A patch that changes nothing does not mark the file dirty. With
        `?dry_run=true` the answer is the category as it would be
        (`dryRun: true`), and nothing is changed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: The updated category, or the preview of a dry run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteCategory
      tags: [Taxonomies]
      summary: Delete a category
      description: |
        Deletes the category. A category with subcategories or assignments is
        rejected `409 delete-blocked` unless `cascade=true`: then its whole
        subtree is deleted and its instruments and accounts become unassigned,
        as a delete in the application does.

        With `?dry_run=true` nothing is deleted and the answer (`200`) names
        the category that would be removed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - name: cascade
          in: query
          required: false
          description: "`true` also deletes subcategories and assignments."
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Dry run, what would be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePreview"
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

