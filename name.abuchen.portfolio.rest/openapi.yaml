  /v1/files/{file}/cash-accounts/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: getCashAccount
      tags: [Cash accounts]
      summary: Read a single cash account
      parameters:
        - name: date
          in: query
          required: false
          description: "The balance date (default: today)."
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The cash account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashAccount"
              examples:
                default:
                  value:
                    uuid: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                    name: Cash Account
                    currencyCode: EUR
                    note: Settlement account
                    balance:
                      value: "1234.56"
                      currency: EUR
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: patchCashAccount
      tags: [Cash accounts]
      summary: Update a cash account (JSON Merge Patch)
      description: |
        A **JSON Merge Patch** (RFC 7386): omitted fields stay untouched, an
        explicit `null` clears an optional field. Accepted as
        `application/json` or `application/merge-patch+json`. Unknown fields
        are rejected (`unknown-field`); all violations are reported at once.

        The currency cannot be changed while the account has transactions
        (`locked-by-transactions`), as in the application's account list.

        A patch that changes nothing does not mark the file dirty. With
        `?dry_run=true` the answer is the cash account as it would be
        (`dryRun: true`), and nothing is changed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/CashAccountPatch"
          application/json:
            schema:
              $ref: "#/components/schemas/CashAccountPatch"
      responses:
        "200":
          description: The updated cash account, or the preview of a dry run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashAccountWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteCashAccount
      tags: [Cash accounts]
      summary: Delete a cash account
      description: |
        Deletes the cash account. **Rejected `409 delete-blocked`** while it has
        transactions (the application offers the delete only for an account
        without transactions), while an investment plan uses it, or while it
        is the reference account of an investment account (`errors` names
        which). Taxonomy assignments do not block the delete; they are removed.

        With `?dry_run=true` nothing is deleted and the answer (`200`) names
        the cash account that would be removed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Dry run, what would be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePreview"
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

