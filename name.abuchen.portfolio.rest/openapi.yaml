  /v1/files/{file}/instruments/{uuid}/events:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: listInstrumentEvents
      tags: [Instruments]
      summary: List the events of an instrument
      description: Stock splits, notes, and the dividend payments reported by a dividend feed.
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InstrumentEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createInstrumentEvent
      tags: [Instruments]
      summary: Add a stock split or note event
      description: |
        Adds an event. A `stock-split` event only **records** the split (its
        `details` are the ratio `new:old`, e.g. `2:1`), as the application's
        event wizard does; it does not adjust transactions or prices.

        A repeated create with the same `clientRef` answers the event created
        first (`200`, `replayed: true`); the key is kept in memory only. With
        `?dry_run=true` nothing is added.
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentEventCreate"
            examples:
              split:
                value:
                  type: stock-split
                  date: "2026-06-10"
                  details: "4:1"
      responses:
        "200":
          description: A dry run or a replayed create; nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentEventWriteResult"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentEventWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteInstrumentEvents
      tags: [Instruments]
      summary: Delete events
      description: |
        Events have no identifier. This removes every event with the given
        `date` and `type` and, if given, exactly these `details`. `404` if none
        matches. Answers the removed events; with `?dry_run=true` the events
        that would be removed.
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [stock-split, note, dividend-payment]
        - name: details
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The removed events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/instruments/{uuid}/actions/split:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    post:
      operationId: splitInstrument
      tags: [Instruments]
      summary: Apply a stock split
      description: |
        Applies a stock split as the application's split wizard does: records a
        `stock-split` event with the ratio `newShares:oldShares`, multiplies the
        shares of every transaction of the instrument dated **before** `exDate`
        by `newShares/oldShares` (buys, sells, deliveries, transfers, and the
        dividends, taxes and fees booked for it), and divides every historical
        price before `exDate` by the same ratio. The latest price is not
        touched. `adjustTransactions` and `adjustPrices` (default `true`) turn
        either adjustment off.

        A dry run answers what would change: the event, every adjusted
        transaction leg with its shares before and after, and the first and
        last adjusted price. A `clientRef` guards a retry: a repeated split with
        the same key is not applied again but answered with
        `replayed: true` (kept in memory until the application quits).
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockSplit"
            examples:
              twoForOne:
                value: { exDate: "2026-06-10", newShares: "2", oldShares: "1" }
      responses:
        "200":
          description: The split that was (or, on a dry run, would be) applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockSplitResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/files/{file}/instruments/attribute-types:
