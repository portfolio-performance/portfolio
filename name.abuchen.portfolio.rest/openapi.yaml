          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/investment-accounts:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listInvestmentAccounts
      tags: [Investment accounts]
      summary: List the investment accounts in a file
      responses:
        "200":
          description: The investment accounts in the file
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InvestmentAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: createInvestmentAccount
      tags: [Investment accounts]
      summary: Add an investment account to the file
      description: |
        A new depot: securities accounts hold instrument positions and nothing
        else, the money that belongs with them living in the **reference cash
        account** - every purchase booked into the depot draws its money from
        that one account. `referenceCashAccount` is its uuid; left out, it must
        be the file's one cash account in the base currency, and a file holding
        none or several is refused rather than guessed at.

        A name another depot already carries is refused as `409 name-taken`.
        The user is asked before anything is created, naming the depot and the
        money account it will point at: `403 write-declined`, `423
        write-unanswered`, `429 write-pending`. Nothing is saved to disk, and
        there is no undo - this API creates depots and never removes one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: What the depot is to be called.
                referenceCashAccount:
                  type: string
                  description: |
                    The uuid of the cash account that belongs with this depot.
                    Optional: left out, the file's one cash account in its base
                    currency is used - and if there is not exactly one, the call
                    asks for the uuid.
                note:
                  type: string
                  description: Free text shown with the depot.
      responses:
        "201":
          description: |
            The depot as it now stands, with its new `uuid` and its
            `referenceCashAccount`, and `created: true`.
          headers:
            X-Portfolio-Changed:
              description: |
                Always `true`: a depot that did not exist before is a change,
                and the file then has unsaved changes.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvestmentAccount"
                  - type: object
                    properties:
                      created:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/investment-accounts/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: getInvestmentAccount
      tags: [Investment accounts]
      summary: Read a single investment account
      description: |
        An investment account holds **only** instrument positions. Its cash side is
        a separate cash account, named by `referenceCashAccount`.
      responses:
        "200":
          description: The investment account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentAccount"
              examples:
                default:
                  value:
                    uuid: d9f0a2e4-1c6b-4e8a-9b2c-3d5f7a1e0c48
                    name: Broker
                    referenceCashAccount: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                    note: Main brokerage
        "400":
