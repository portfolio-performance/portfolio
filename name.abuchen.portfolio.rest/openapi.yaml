  /v1/files/{file}/info:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: getFileInfo
      tags: [Files]
      summary: The file's own facts - its currency and what it holds
      description: |
        The cheapest answer this API gives, and the one worth reading before
        anything larger when a file is not known yet: the counts say whether
        `/holdings` will return a handful of positions or a thousand, and
        whether there are taxonomies at all before `/taxonomies` is a question
        worth asking.

        `baseCurrency` is the currency every report defaults to. `currencies`
        are the ones the accounts, portfolios and instruments actually use, so
        a `reportingCurrency` outside that list converts at 1:1 and names
        itself in `fxWarnings`.

        `counts` is an inventory, not a statement of assets: an instrument
        without a position still counts, and so does a closed account. What is
        owned and what it is worth on a date is `/holdings`. `fileVersion` is
        the format version the file was read at - not a modification date, and
        nothing about it says whether a newer copy lies on disk.
      responses:
        "200":
          description: The file's facts
          content:
            application/json:
              schema:
                type: object
                required: [baseCurrency, currencies, fileVersion, counts]
                properties:
                  baseCurrency:
                    type: string
                    description: The currency every amount defaults to.
                  currencies:
                    type: array
                    description: |
                      Every currency the file moves in, the base currency among
                      them.
                    items:
                      type: string
                  fileVersion:
                    type: integer
                    description: The XML format version the file was read at.
                  counts:
                    type: object
                    description: |
                      How many of each kind of thing the file keeps. A thing
                      that exists without ever having been used counts too.
                    required:
                    - instruments
                    - cashAccounts
                    - investmentAccounts
                    - investmentPlans
                    - watchlists
                    - taxonomies
                    - classes
                    properties:
                      instruments:
                        type: integer
                      cashAccounts:
                        type: integer
                      investmentAccounts:
                        type: integer
                      investmentPlans:
                        type: integer
                      watchlists:
                        type: integer
                      taxonomies:
                        type: integer
                      classes:
                        type: integer
                        description: Every class of every taxonomy, roots among them.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/watchlists:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listWatchlists
      tags: [Watchlists]
      summary: The named baskets of instruments the file quotes
      description: |
        Named baskets of instruments that the application quotes together. A
        watchlist is not an account and holds nothing - it is a selection of
        names - and it is the one thing in a file without an identifier: `name`
        is all a reader can quote back, and no uuid anywhere points at a list.

        By default each list only says how full it is (`instrumentCount`);
        `withInstruments=true` adds the instruments as `{uuid, name}` pairs.
        Ask for that together with `instrument`, because a working list carries
        several hundred and this answer is never paged.

        A watchlist says nothing about ownership: an instrument can be watched
        without being held, and held without being watched. What is owned and
        what it is worth is `/holdings`. When nothing comes back, `empty` says
        whether the file has no watchlists at all or only none holding what was
        asked for - two answers an empty list cannot tell apart.
      parameters:
        - name: instrument
          in: query
          required: false
          description: |
            Only the lists holding this one instrument, as its `uuid`. The
            answer then names the lists, not just the instrument.
          schema:
            type: string
        - name: withInstruments
          in: query
          required: false
          description: |
            Whether each list also carries the instruments it holds. Off by
            default: a working list holds several hundred, and
            `instrumentCount` states the size either way.
          schema:
            type: boolean
      responses:
        "200":
          description: The watchlists of the file, in the order the file keeps them.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  empty:
                    type: string
                    description: |
                      Present only when no list came back, saying which kind of
                      nothing that is: a file without watchlists says it has
                      none, while an instrument no list holds says so.
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, instrumentCount]
                      properties:
                        name:
                          type: string
                          description: |
                            The only thing a watchlist is known by - it has no
                            uuid, and names need not be unique.
                        instrumentCount:
                          type: integer
                        instruments:
                          type: array
                          description: |
                            Only with `withInstruments=true`. Instruments the
                            list quotes, whether or not the file holds them.
                          items:
                            type: object
                            required: [uuid, name]
                            properties:
                              uuid:
                                type: string
                              name:
                                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createWatchlist
      tags: [Watchlists]
      summary: Add a watchlist to the file
      description: |
        A new named basket, optionally already holding instruments.

        A watchlist has no identifier, so its name is both its address and its
        only guarantee: a name the file already uses is refused as `409` with the
        reason `name-taken`, because once two lists share a name nothing this API
        returns could tell them apart. Names are compared exactly after the
        spaces around them are gone; case is not folded. The model itself does
        not forbid a duplicate - a file can arrive with one from an older
        application or a hand edit - this operation simply declines to add one.

        `name` is in the body rather than the path for the same reason a list has
        no uuid: a name is free text, free text can hold a slash, and a path
        segment cannot be asked to survive one.

        The user is asked before anything is added, naming the list: a refusal is
        `403 write-declined`, silence for two minutes is `423 write-unanswered`,
        and while another change is being answered this is `429 write-pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: |
                    What the list is to be called, as the navigation will show
                    it. Blank or missing is a `400` on this field.
                instruments:
                  type: array
                  description: |
                    Instruments the list should hold, by `uuid`. Any uuid the
                    file does not have refuses the whole request - a caller that
                    meant to add two and quietly got one would never hear of it.
                    Omit it to create an empty list.
                  items:
                    type: string
      responses:
        "201":
          description: |
            The list as it now stands. `hasIdentifier: false` says what no other
            answer of this API has to say: there is no uuid to remember, and the
            name returned is the way to address this list from now on.
          headers:
            X-Portfolio-Changed:
              description: |
                Always `true` here: a list that did not exist before is a change,
                so the file now has unsaved changes. Nothing was written to disk.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateWatchlist
      tags: [Watchlists]
      summary: Put instruments into a watchlist and take others out
      description: |
        Both directions in one request, so that moving a name from one list to
        another costs one call instead of two - and so that the surface does not
        grow an operation per direction.

        The list is named in the body, not addressed by uuid, because it has no
        uuid; a name the file does not have is refused as `409` with the reason
        `no-such-watchlist`, and the refusal names the lists the file does have.

        At least one of `add` or `remove` must be given. A uuid the file does not
        have refuses the whole request. A uuid under `remove` that the list does
        not hold is **not** an error: the state asked for already holds, so it is
        reported under `notHeld` and the request stays safe to send twice. Adding
        what the list already holds changes nothing, as the model keeps a list
        free of duplicates - and `changed: false` says so plainly.

        The user is asked before anything moves, naming the list: `403
        write-declined`, `423 write-unanswered`, `429 write-pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: |
                    Which list to change, spelled as `/watchlists` names it.
                add:
                  type: array
                  description: |
                    Instruments to put in, by `uuid`. One already in the list is
                    left alone.
                  items:
                    type: string
                remove:
                  type: array
                  description: |
                    Instruments to take out, by `uuid`. Only the selection goes:
                    the instrument itself stays in the file.
                  items:
                    type: string
      responses:
        "200":
          description: |
            The list as it now stands, with the counts around the change. Absent
            instruments of `remove` are listed under `notHeld` when there were
            any; a request that changed nothing says `changed: false` and leaves
            the file as it was, unsaved changes included.
          headers:
            X-Portfolio-Changed:
              description: |
                Whether this call changed the model: `true` when it did and the
                file then has unsaved changes, `false` when the list already held
                exactly this selection. It repeats the body's `changed`. Earlier
                edits may still be unsaved after a `false`.
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: deleteWatchlist
      tags: [Watchlists]
      summary: Take a watchlist out of the file
      description: |
        The list is named in the body as it is for creating and changing one -
        a list has no uuid, its name is the only address, and free text can hold
        a slash a path segment cannot survive.

        A name the file does not have is refused as `409 no-such-watchlist`,
        naming the lists the file does have: sending this twice fails the second
        time, and there is no undo - making the list again with `POST` under the
        very name and with the very instruments is the way back.

        What was watched stays: a watchlist only points at instruments. Removing
        a list takes away a selection, never a security, and changes nothing
        about the holdings, the bookings, or the other lists the same names
        appear in.

        The user is asked before the list goes, naming it: `403
        write-declined`, `423 write-unanswered`, `429 write-pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: |
                    Which list to remove, spelled as `GET /v1/files/{file}/watchlists`
                    names it.
      responses:
        "200":
          description: |
            The list as it last stood - its name, and how many instruments it
            held - with `deleted: true`. The instruments themselves are in the
            file as they were.
          headers:
            X-Portfolio-Changed:
              description: |
                Always `true`: a list that was there and is not now is a change,
                and the file then has unsaved changes.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  deleted:
                    type: boolean
                  hasIdentifier:
                    type: boolean
                  instrumentCountBefore:
                    type: integer
                  created:
                    type: boolean
                  added:
                    type: integer
                  removed:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/performance/categories/{classification}:
    parameters:
      - $ref: "#/components/parameters/File"
      - name: classification
        in: path
        required: true
        description: |
          The class to report on, as its `id` from the classes of `/taxonomies`.
          Nothing else resolves: a class name is not an id, and the same name
          appears in several trees.
        schema:
          type: string
    get:
      operationId: getCategoryPerformance
      tags: [Performance]
      summary: Performance of one class of a taxonomy between two valuation dates
      description: |
        The report of `/performance` with its scope narrowed from the whole file
        to what one class holds: the same fields, the same signs, the same
        reconciliation - read that endpoint for what the terms mean.

        What a class holds is the application's own reckoning and not merely the
        vehicles tagged to it: a cash account assigned to the class counts as
        money, and the settlement cash of a securities account is shared out
        between the classes its holdings belong to. The classes of one tree
        therefore add back up to the whole file. It follows that an instrument's
        own row in `/performance/instruments` need not match its share of a
        class: the cash belongs to the class, not to the instrument.

        One class per call. `taxonomy` is only needed when several taxonomies
        define that same class id, which is otherwise refused rather than
        guessed. A class holding nothing has no capital to measure a return on,
        so `ttwror` and `irr` come back null and not 0 %, while
        `category.assignedCount` states what it holds. `category` names the
        class the figures belong to, because a report over a class would
        otherwise carry nothing saying which one it is.
      parameters:
        - name: taxonomy
          in: query
          required: false
          description: |
            The taxonomy the class belongs to, as its `id`. Optional, because a
            class id is unique within one tree.
          schema:
            type: string
        - name: openingDate
          in: query
          required: true
          description: |
            The opening valuation date, as `YYYY-MM-DD`. As in `/performance`,
            an activity dated exactly on it belongs to the opening balance.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            The closing valuation date (default: today). Must be strictly after
            `openingDate`; the same conventions as in `/performance`.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/ReportingCurrency"
        - name: costMethod
          in: query
          required: false
          description: |
            The cost basis method used to split capital gains into realized and
            unrealized (default: `fifo`). Echoed in the response.
          schema:
            type: string
            enum: [fifo, moving-average]
            default: fifo
      responses:
        "200":
          description: The performance of that class over the interval
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/Performance"
                - type: object
                  required: [category]
                  properties:
                    category:
                      type: object
                      description: Which class the figures belong to.
                      required: [taxonomy, id, name, assignedCount]
                      properties:
                        taxonomy:
                          type: object
                          required: [id, name]
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                        id:
                          type: string
                        name:
                          type: string
                        parentId:
                          type: string
                          description: Absent for a class directly below the root.
                        assignedCount:
                          type: integer
                          description: |
                            How many vehicles the class holds. Zero means the
                            report is over nothing at all.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/investment-plans:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listInvestmentPlans
      tags: [Investment plans]
      summary: List the savings plans of the file
      description: |
        What the file intends to book next: the rate of each plan, its rhythm,
        and the two accounts between which it moves money. Nothing else in this
        API speaks of the future - holdings state what is there and
        `/transactions` states what happened.

        A plan is a schedule, not a booking. What it already executed are
        ordinary transactions in the accounts it names, visible under
        `/transactions`; this counts them (`executions`), names the date of the
        last one and the date the next is due, and does not repeat them. An
        `executions` of zero means the plan has never run, and then no
        `lastExecution` comes back at all. `nextExecution` is the date the
        application would use next: for a plan that never ran it is the plan's
        `start`, so it can lie in the past, and it does not move until the
        application generates something.

        `interval` with `intervalUnit` is the rhythm, normalized for the reader:
        the file keeps a weekly plan as a number of one hundred and more, which
        is not the reader's business. So `1` with `month` is a monthly plan and
        `2` with `week` every second week.

        A plan that buys names no cash account of its own: the `cashAccount`
        stated for it is the settlement account of its securities account,
        derived exactly as a purchase booking derives it. A plan is named, never
        identified - it has no uuid, and plans cannot be written through this
        API. Answers are never paged: a file holds plans by the dozen.
      parameters:
        - name: investmentAccount
          in: query
          required: false
          description: |
            Only the plans buying or delivering into this one securities
            account, as its `uuid`. A plan that only moves money has none and is
            never returned.
          schema:
            type: string
        - name: cashAccount
          in: query
          required: false
          description: |
            Only the plans whose money moves through this one cash account, as
            its `uuid` - for a plan that buys, its settlement account.
          schema:
            type: string
        - name: instrument
          in: query
          required: false
          description: Only the plans feeding this one instrument, as its `uuid`.
          schema:
            type: string
      responses:
        '200':
          description: The plans of the file, in the order the file keeps them.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  empty:
                    type: string
                    description: |
                      Present only when no plan came back, saying which kind of
                      nothing that is: a file without plans says it has none,
                      while a filter that matched nothing says nothing of the
                      file matches it. An empty `items` alone cannot tell the
                      two apart, and they lead to different next calls.
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - type
                      - amount
                      - interval
                      - intervalUnit
                      - start
                      - autoGenerate
                      - executions
                      - nextExecution
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          enum: [PURCHASE_OR_DELIVERY, DEPOSIT, REMOVAL, INTEREST]
                          description: |
                            `PURCHASE_OR_DELIVERY` buys or delivers into
                            `investmentAccount`; `DEPOSIT` pays into a cash
                            account, `REMOVAL` takes out of one, `INTEREST`
                            books interest on one.
                        amount:
                          type: object
                          description: The rate of one execution.
                          required: [value, currency]
                          properties:
                            value:
                              type: number
                            currency:
                              type: string
                        fees:
                          type: object
                          description: Charged per execution; only when not zero.
                          required: [value, currency]
                          properties:
                            value:
                              type: number
                            currency:
                              type: string
                        taxes:
                          type: object
                          description: Withheld per execution; only when not zero.
                          required: [value, currency]
                          properties:
                            value:
                              type: number
                            currency:
                              type: string
                        interval:
                          type: integer
                          description: Every so many `intervalUnit`s.
                        intervalUnit:
                          type: string
                          enum: [month, week]
                        start:
                          type: string
                          format: date
                          description: The date the plan began to run on.
                        autoGenerate:
                          type: boolean
                          description: Whether the application creates the bookings on its own.
                        executions:
                          type: integer
                          description: How many bookings the plan has already produced.
                        lastExecution:
                          type: string
                          format: date
                          description: The date of the newest one; absent when the plan never ran.
                        nextExecution:
                          type: string
                          format: date
                          description: |
                            The next date due, moved off a public holiday of the
                            instrument's trading calendar.
                        instrument:
                          type: object
                          description: The vehicle the plan feeds; absent for a money-only plan.
                          required: [uuid, name]
                          properties:
                            uuid:
                              type: string
                            name:
                              type: string
                        investmentAccount:
                          type: object
                          description: The securities account it buys into.
                          required: [uuid, name]
                          properties:
                            uuid:
                              type: string
                            name:
                              type: string
                        cashAccount:
                          type: object
                          description: |
                            The account the money moves through: the plan's own,
                            or the settlement account of its securities account.
                          required: [uuid, name]
                          properties:
                            uuid:
                              type: string
                            name:
                              type: string
                        note:
                          type: string
        '400':
          description: A named account or instrument is not of this file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /v1/files/{file}/holdings:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listHoldings
      tags: [Holdings]
      summary: List the file's holdings, valued at a date
      description: |
        Every holding — instrument positions and cash account balances uniformly —
        valued at the given date in the reporting currency. Instrument positions
        with zero shares at the date are omitted; cash accounts always appear,
        even with a zero balance. Items are sorted by name.
      parameters:
        - name: date
          in: query
          required: false
          description: |
            The valuation date (default: today). Each instrument is valued with
            the latest price on or before this date; the holding's `price.date`
            makes the staleness visible. Future dates are allowed and value at
            the last known prices.
          schema:
            type: string
            format: date
        - name: investmentAccount
          in: query
          required: false
          description: |
            Restrict the report to the positions of this one investment account,
            given as its uuid. The answer then carries `scope`, `totalAssets` is
            that account's value, and every `weight` is the share of it rather
            than of the file. The settlement cash of a portfolio is a cash account
            of its own - named in `scope.referenceCashAccount` - and is not among
            these rows. An account closed by the date is still valued. Cannot be
            combined with `cashAccount`.
          schema:
            type: string
        - name: cashAccount
          in: query
          required: false
          description: |
            Restrict the report to the balance of this one cash account, given as
            its uuid. Same effect on `scope`, `totalAssets` and `weight` as
            `investmentAccount`; cannot be combined with it.
          schema:
            type: string
        - $ref: "#/components/parameters/ReportingCurrency"
      responses:
        "200":
          description: The holdings at the valuation date
          content:
            application/json:
              schema:
                type: object
                required: [date, reportingCurrency, totalAssets, fxWarnings, fxStaleRates, items]
                properties:
                  date:
                    type: string
                    format: date
                    description: The effective valuation date.
                  reportingCurrency:
                    type: string
                    description: |
                      The currency every amount in this report has been converted
                      into — the `reportingCurrency` query parameter, or the
                      file's base currency. Not to be confused with a
                      `MonetaryValue`'s `currency` (one amount) or an entity's
                      `currencyCode` (its own declared currency).
                  totalAssets:
                    $ref: "#/components/schemas/MonetaryValue"
                  scope:
                    type: object
                    description: |
                      Present only when `investmentAccount` or `cashAccount` narrowed
                      the report: the one account these numbers are about. Without a
                      scope the key is absent and the report is the whole file. In a
                      scoped report `totalAssets` is this account's value, so every
                      holding's `weight` is its share of the account rather than of
                      the file.
                    required: [type, uuid, name]
                    properties:
                      type:
                        type: string
                        description: |
                          `investment-account` or `cash-account`, in the same words a
                          holding's `type` uses.
                      uuid:
                        type: string
                        description: The account the report was narrowed to, as it was sent.
                      name:
                        type: string
                        description: Its name.
                      referenceCashAccount:
                        type: object
                        description: |
                          For an investment account: where the money belonging to it
                          is kept. Its balance is not among these rows - ask for it
                          with `cashAccount`.
                        required: [uuid, name]
                        properties:
                          uuid:
                            type: string
                          name:
                            type: string
                  fxWarnings:
                    $ref: "#/components/schemas/FxWarnings"
                  fxStaleRates:
                    $ref: "#/components/schemas/FxStaleRates"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Holding"
              examples:
                default:
                  value:
                    date: "2026-07-20"
                    reportingCurrency: EUR
                    totalAssets: { value: 1600, currency: EUR }
                    fxWarnings: []
                    fxStaleRates: []
                    items:
                      - type: instrument
                        uuid: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                        name: Apple Inc.
                        shares: 10
                        price: { value: 110.5, currency: USD, date: "2026-07-17" }
                        priceStale: false
                        priceAgeDays: 3
                        priceMissedTradingDays: 0
                        valuation: { value: 1100, currency: EUR }
                        localValuation: { value: 1105, currency: USD }
                        weight: 0.6875
                      - type: cash-account
                        uuid: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                        name: Broker Cash
                        valuation: { value: 500, currency: EUR }
                        weight: 0.3125
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/taxonomies:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listTaxonomies
      tags: [Taxonomies]
      summary: The file's taxonomies, with their classes, weights and assignments
      description: |
        Two shapes in one answer. `items` are the taxonomies themselves - always
        all of them, each with its `classCount`. `classes` is one flat list of the
        classes, in the order the application shows them (`rank`, a parent before
        its children), each with its `parent`, the `targetWeight` rebalancing
        aims at, and how many vehicles are assigned to it. No other read of this
        API states a classification - a holding states a value, an instrument
        states master data.

        `classes` is what `limit` and `cursor` page through, and `taxonomy` narrows
        the answer to one tree: a working file has more classes than fit in one
        response, and one class of a real file holds several hundred vehicles.
        Those vehicles are off by default; `withAssignments=true` brings them,
        together with a `limit` for the classes.

        **Every ratio is a fraction** - `0.6` is the 60 % the application shows -
        the same rule as a holding's `weight`. Two of those ratios mean different
        things: a class's `targetWeight` is what rebalancing aims at for the
        class, while an `assignments[].weight` is the factor that class applies to
        one vehicle's value - `1` in full - which is not the slice the class's pie
        chart draws, since that follows from value times factor. A class the
        application creates starts at a whole (`1`), so a `targetWeight` of `1`
        marks a fresh class rather than a decided one. The value travels
        exactly as the file stores it: it can
        exceed a whole, the levels of one tree can sum to far more than a
        hundred percent, and a negative one can only come from an older version
        of the application whose dialog still accepted a minus - the current
        dialog does not. Nothing is clamped or corrected here, because those
        are the numbers the application itself displays. A taxonomy covers only
        what is assigned to it: the application's view ends with a row `Ohne
        Klassifizierung` - unclassified - for the vehicles belonging to no class
        of that taxonomy, and that row is not a class. It is neither in `items`
        nor in `classes`, and no `assignedCount` says how much of the file is
        missing from the tree; the remainder is what is left of pp_list_holdings
        once the taxonomy's assignments are subtracted. A file with no taxonomies
        answers with empty lists.
      parameters:
        - name: taxonomy
          in: query
          required: false
          description: |
            Read one taxonomy instead of all of them, as its `id` from `items`. An
            id this file does not have is reported as `invalid-value`.
          schema:
            type: string
        - name: class
          in: query
          required: false
          description: |
            Read one class instead of a whole tree, as its `id`. The way to ask for
            the vehicles of a single class: together with `withAssignments=true` it
            answers that class and its vehicles, instead of paging through every
            other class until that one arrives. A class id is unique within a
            taxonomy only - without `taxonomy` the id is looked for in all of them,
            and one several taxonomies define is refused. Only the class itself is
            returned, never its subclasses.
          schema:
            type: string
        - name: withAssignments
          in: query
          required: false
          description: |
            Whether every class carries the vehicles assigned to it. Off by
            default: one class of a working file holds several hundred, which is
            more than one page holds - `assignedCount` states the size either way.
            Send it together with `limit`: seven classes of a real file carried
            838 vehicles between them.

            Narrowed to one class with `class` and asked for its vehicles, the
            page moves from the classes to those vehicles: `classes` then holds
            that one class whole - its `assignedCount` the total in all - while
            `assignments` is the paged list, in the order of the application's
            table, every row carrying a `cursor` and `page.nextCursor` naming
            where to continue. A cursor of the class list is no cursor of the
            vehicles and is refused rather than obeyed.
          schema:
            type: boolean
            default: false
        - name: withPath
          in: query
          required: false
          description: |
            Whether every class also carries the `path` of ids from the root down
            to it. Off by default: `parent` already links each class to the one
            above, and a page of classes is enough to walk the tree, while the
            path costs one uuid per step - in a working file about half of the
            whole class list.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Every taxonomy of the file
          content:
            application/json:
              schema:
                type: object
                required: [items, classes]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, classCount]
                      properties:
                        id:
                          type: string
                          description: |
                            The taxonomy's id - what the application lists it
                            under, and the id a write addresses it by.
                        name:
                          type: string
                          description: The taxonomy's name.
                        source:
                          type: string
                          description: |
                            Where the taxonomy came from, when it was imported
                            from a template. Absent for a local one.
                        dimensions:
                          type: array
                          items:
                            type: string
                          description: |
                            The rebalancing dimensions it defines, when it
                            defines any.
                        classCount:
                          type: integer
                          description: |
                            How many classes the tree holds - the length of
                            `classes`, stated so a caller sees the size of what
                            it was given.
                  classes:
                    type: array
                    description: |
                      The classes of every taxonomy the request covers, in one
                      flat list: a parent before its children, children by `rank`
                      and then by name - the order the application shows. This is
                      what `limit` and `cursor` page through, because a working
                      file holds more classes than fit in one answer; one class of
                      a real file holds several hundred vehicles. `page` appears
                      only when paging was asked for, and then every row carries
                      its own `cursor`.
                    items:
                      type: object
                      required: [taxonomy, id, name, rank, targetWeight, assignedCount]
                      properties:
                        taxonomy:
                          type: string
                          description: |
                            The id of the taxonomy this class belongs to, so that
                            a page of classes can be read without the headers.
                        id:
                          type: string
                          description: The class id, unique within its taxonomy.
                        name:
                          type: string
                          description: The class name as the application shows it.
                        parent:
                          type: string
                          description: |
                            The id of the class above. Absent on the root class,
                            which carries the taxonomy's own id.
                        path:
                          type: array
                          items:
                            type: string
                          description: |
                            The ids from the root down to this class. Only present
                            when `withPath=true`: `parent` already links each class
                            to the one above, so a page of classes is enough to
                            rebuild the tree.
                        rank:
                          type: integer
                          description: The position among its siblings.
                        targetWeight:
                          type: number
                          description: |
                            What rebalancing aims at for this class, as a fraction
                            (0.6 = 60 %). A new class of the application starts at
                            a whole (1 = 100 %).
                        note:
                          type: string
                          description: The class note, when set.
                        assignedCount:
                          type: integer
                          description: |
                            How many vehicles are assigned to this class - stated
                            whether or not `withAssignments` was sent, so the shape
                            of a tree is cheap to read.
                        assignments:
                          type: array
                          description: |
                            The vehicles assigned directly to this class. Present
                            only when `withAssignments=true` and the class has any.
                          items:
                            type: object
                            required: [uuid, name, type, weight]
                            properties:
                              uuid:
                                type: string
                                description: The vehicle's uuid, as pp_list_instruments gives it.
                              name:
                                type: string
                                description: The vehicle's name.
                              type:
                                type: string
                                description: |
                                  Which kind of vehicle: `instrument` or
                                  `cash-account`. `vehicle` is the fallback for a
                                  kind this API does not name yet.
                              rank:
                                type: integer
                                description: |
                                  The place within the class, from 0 - the order
                                  the application's table shows, and the order a
                                  page of one class's vehicles continues in.
                              weight:
                                type: number
                                description: |
                                  The factor this class applies to the vehicle's
                                  value, as a fraction: `1` counts it in full,
                                  `0.6` at 60 %. Not a target - and not the slice
                                  the class's pie chart draws, which follows from
                                  the value times this factor.
                        cursor:
                          type: string
                          description: |
                            Present when paging: send it, or `page.nextCursor`, as
                            `cursor` to continue after this class.
                  page:
                    $ref: "#/components/schemas/Page"
              examples:
                default:
                  value:
                    items:
                      - id: asset_classes
                        name: Asset Classes
                        classCount: 3
                    classes:
                      - taxonomy: asset_classes
                        id: asset_classes
                        name: Asset Classes
                        path: [asset_classes]
                        rank: 0
                        targetWeight: 1
                        assignedCount: 0
                      - taxonomy: asset_classes
                        id: equity
                        name: Equities
                        parent: asset_classes
                        path: [asset_classes, equity]
                        rank: 0
                        targetWeight: 0.6
                        assignedCount: 1
                      - taxonomy: asset_classes
                        id: bonds
                        name: Bonds
                        parent: asset_classes
                        path: [asset_classes, bonds]
                        rank: 1
                        targetWeight: 0.4
                        assignedCount: 0

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/taxonomies/{taxonomy}/classes:
    post:
      operationId: createClass
      tags: [Taxonomies]
      summary: Add a class to a taxonomy
      description: |
        The other half of `updateClass`: that one moves the target weight of a
        class that already has an id, this one gives the class its id - what the
        application's `New category` does, given as a name and the parent to
        hang it under.

        `parent` is the id of one class of the same tree; left out, the class
        hangs under the root. `targetWeight` left out starts the class at a
        whole (`1`), exactly as a fresh class of the application does.

        A name the parent already carries is refused as `409 name-taken`:
        classes do have ids, so two of one name could be told apart - but only
        by a caller that went and looked. Another parent makes another class,
        and that pair is ordinary.

        The user is asked before anything is created, naming the new class and
        the tree it joins: `403 write-declined`, `423 write-unanswered`, `429
        write-pending`. Nothing is saved to disk, and there is no undo - this
        API creates classes and never removes one.
      parameters:
        - $ref: "#/components/parameters/File"
        - name: taxonomy
          in: path
          required: true
          description: The taxonomy's `id`, from the `items` of `GET /v1/files/{file}/taxonomies`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: What the class is to be called.
                parent:
                  type: string
                  description: |
                    The id of the class the new one hangs under. Optional: left
                    out it is the taxonomy's root.
                targetWeight:
                  type: number
                  minimum: 0
                  description: |
                    The target weight as a fraction. Optional: left out the
                    class starts at a whole (1). Negative is refused.
      responses:
        "201":
          description: |
            The class as it now stands, with its new id - which the assignment
            and weight writes accept at once - `created: true`, and the tree.
          headers:
            X-Portfolio-Changed:
              description: |
                Always `true`: a class that did not exist before is a change.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                type: object
                required: [taxonomy, class, targetWeight, created, changed]
                properties:
                  taxonomy:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  class:
                    type: object
                    required: [id, name, parent]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      parent:
                        type: string
                        description: The id of the class this one hangs under.
                  targetWeight:
                    type: number
                    description: The class's target weight as a fraction.
                  created:
                    type: boolean
                  changed:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/taxonomies/{taxonomy}/classes/{classification}:
    patch:
      operationId: updateClass
      tags: [Taxonomies]
      summary: Change the target weight of a class
      description: |
        The one number the file keeps that says what a class should be worth -
        readable since `GET /v1/files/{file}/taxonomies` carried `targetWeight`,
        and untouched by every operation until this one.

        `targetWeight` travels as a fraction, the figure the read gives back:
        `0.6` is the 60 % the application shows. It may be more than a whole -
        the classes of one tree need not add up to a hundred percent - but never
        negative: a minus came in through an older version of the application
        whose dialog still accepted one, while the current dialog, like this
        operation, refuses it.

        A PATCH although targetWeight is the only field it takes: a PUT would
        promise the request states the class whole, and one field is one field.
        Setting the same weight again changes nothing and answers `changed:
        false`, so the call may be sent twice.

        The user is asked before the number moves, naming the class and the
        taxonomy it belongs to: `403 write-declined`, `423 write-unanswered`,
        `429 write-pending`.
      parameters:
        - $ref: "#/components/parameters/File"
        - name: taxonomy
          in: path
          required: true
          description: The taxonomy's `id`, from the `items` of `GET /v1/files/{file}/taxonomies`.
          schema:
            type: string
        - name: classification
          in: path
          required: true
          description: |
            The class's `id`, from the `classes` of `GET /v1/files/{file}/taxonomies`.
            Unique only inside the taxonomy named above, so that one is asked for too.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetWeight]
              additionalProperties: false
              properties:
                targetWeight:
                  type: number
                  minimum: 0
                  description: |
                    The new target weight as a fraction: `0.6` is the 60 % the
                    application shows. 0 is allowed; more than 1 is stored as
                    given; negative is refused.
      responses:
        "200":
          description: |
            The class and its tree, the weight as it was and as it is now, and
            `changed` - false when the number was the one the class already
            carried, in which case the file, unsaved changes included, stays as
            it was.
          headers:
            X-Portfolio-Changed:
              description: |
                Whether this call changed the model: `true` when it did and the
                file then has unsaved changes, `false` when the weight already
                was what was asked for. It repeats the body's `changed`. Earlier
                edits may still be unsaved after a `false`.
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                type: object
                properties:
                  taxonomy:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  class:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      parent:
                        type: string
                  previousTargetWeight:
                    type: number
                  targetWeight:
                    type: number
                  changed:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/taxonomies/{taxonomy}/classes/{classification}/vehicles/{vehicle}:
    put:
      operationId: assignVehicle
      tags: [Taxonomies]
      summary: Put one vehicle into one class
      description: |
        Makes sure one instrument or one cash account belongs to one class of a
        taxonomy. A `PUT`, so sending it twice has done exactly what sending it
        once did — the second call changes nothing and answers with
        `created: false, changed: false`.

        A vehicle is an instrument or a cash account. An **investment account has
        a uuid but cannot be placed** in a class: it is refused as
        `vehicle-not-assignable`, because what a class divides up is the money and
        the papers, and a depot is only the drawer they sit in. Assign the depot's
        reference cash account instead.

        `weight` is the factor the class's report multiplies the vehicle's value
        by, as a fraction: `1` counts it in full — which is what every existing
        assignment of a real file does — and `0.6` counts it at 60 %. Left out, a
        vehicle newly placed takes `1`, the same as its new class mates.

        This writes to a file open in the application. The model changes, the file
        is marked dirty, and the open parts recalculate - a classification report
        the user is looking at moves at once. Nothing is written to disk: closing
        the file without saving discards the change, and there is no undo.
        While the user has a dialog open, or is part-way through editing a cell,
        the write is refused `423` until they finish.
      parameters:
        - $ref: "#/components/parameters/File"
        - name: taxonomy
          in: path
          required: true
          description: The taxonomy's `id`, from the `items` of `GET /v1/files/{file}/taxonomies`.
          schema:
            type: string
        - name: classification
          in: path
          required: true
          description: |
            The class's `id`, from the `classes` of `GET /v1/files/{file}/taxonomies`.
            Unique only inside the taxonomy named above, so that one is asked for too.
          schema:
            type: string
        - name: vehicle
          in: path
          required: true
          description: |
            The uuid of the instrument or cash account to place, as
            `/v1/files/{file}/instruments` or `/v1/files/{file}/cash-accounts`
            give them.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                weight:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1
                  description: |
                    The factor the class applies to the vehicle's value, as a
                    fraction: `1` counts it in full, `0.6` at 60 %. More than 0
                    and at most 1. Omit it - or send `{}` - to count the vehicle
                    in full, as every existing assignment of a real file does, or
                    to leave an existing factor alone.
      responses:
        "200":
          description: |
            The class, the vehicle and the counts around the change. `created` is
            true only for a vehicle that was not in the class before; `changed` is
            false when the request only restated what was already stored, and the
            file then has no new unsaved changes.
          headers:
            X-Portfolio-Changed:
              description: |
                Whether this call changed the model: `true` when the vehicle was
                put in or its factor moved, `false` when the request only restated
                the assignment. It repeats the body's `changed`. Earlier edits may
                still be unsaved after a `false`.
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                type: object
                required:
                  - taxonomy
                  - class
                  - className
                  - vehicle
                  - assignedBefore
                  - assignedAfter
                  - rank
                  - created
                  - changed
                properties:
                  taxonomy:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  class:
                    type: string
                  className:
                    type: string
                  vehicle:
                    type: object
                    required: [uuid, name, type]
                    properties:
                      uuid:
                        type: string
                      name:
                        type: string
                      type:
                        type: string
                        description: |
                          Which kind of vehicle this is, in the words the rest of
                          this API uses: `instrument` or `cash-account`.
                  weight:
                    type: number
                    description: |
                      The share within the class as a fraction, after the change.
                      Absent when the assignment was removed.
                  assignedBefore:
                    type: integer
                    description: How many vehicles the class held before.
                  assignedAfter:
                    type: integer
                    description: How many it holds now.
                  rank:
                    type: integer
                    description: |
                      The place within the class, from 0. A vehicle newly placed
                      comes last, as it does in the application's table.
                  created:
                    type: boolean
                  changed:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: unassignVehicle
      tags: [Taxonomies]
      summary: Take one vehicle out of one class
      description: |
        Removes the assignment and nothing else: the instrument or cash account
        stays in the file, with its bookings and its place in every other
        taxonomy.

        Refused **`404 not-assigned`** when the class does not hold that vehicle.
        Unlike a missing entity there is nothing to go and look up, so the refusal
        says that both things are there and only the relation between them never
        was - which is also why sending this twice fails the second time.

        A write to a file open in the application, with the same consequences as
        `PUT` above: the parts recalculate, nothing is saved to disk, and there is
        no undo.
      parameters:
        - $ref: "#/components/parameters/File"
        - name: taxonomy
          in: path
          required: true
          description: The taxonomy's `id`.
          schema:
            type: string
        - name: classification
          in: path
          required: true
          description: The class's `id`.
          schema:
            type: string
        - name: vehicle
          in: path
          required: true
          description: The uuid of the instrument or cash account to take out.
          schema:
            type: string
      responses:
        "204":
          description: |
            Removed. The assignment that was removed is described in the response
            to the MCP tool of the same name, and not in this body.
          headers:
            X-Portfolio-Changed:
              description: |
                Always `true` here: an assignment that is gone is a change, so the
                file now has unsaved changes. Nothing was written to disk.
              schema:
                type: string
                enum: ["true"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/performance:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: getPerformance
      tags: [Performance]
      summary: Performance of the file between two valuation dates
      description: |
        The portfolio's performance between the opening and closing valuation
        dates, in the reporting currency: the time-weighted return (TTWROR) and
        the money-weighted return (IRR), plus the value-change `breakdown` that
        reconciles the opening to the closing value.

        The breakdown is a signed decomposition — the money fields add up to the
        closing value:
        `openingValue + unrealizedCapitalGains + realizedCapitalGains + income +
        fees + taxes + currencyGains + netDeposits = closingValue`. `fees` and
        `taxes` are therefore negative when they cost money, and positive for a
        refund. The identity usually holds to the cent; first-in-first-out
        rounding can leave a few cents, and with foreign currencies the terms
        are converted at the dates they happened and the opening and closing
        values at the interval's ends, which can leave a larger residual — the
        application's own calculation shows the same figures.

        Capital gains are stated before fees and taxes, which stand as terms of
        their own — the same as the per-instrument report with
        `taxesAndFees=excluded`, and the only way the sum can add up. `taxes` is
        what was booked in the period (withholding, advance lump sums, taxes on
        sales), not a tax computed from the period's gains, so it can exceed them. `netDeposits` is the external capital
        flow (deposits less removals) over the period; it is *not* part of the
        performance-driven change, but is required for the value reconciliation.

        `costMethod` chooses how a security's gains split into realized and
        unrealized; it does not affect their sum beyond rounding, nor the
        returns.

        `openingDate` and `closingDate` are **valuation snapshot dates, not a
        record range**. The opening balance is measured as of the end of
        `openingDate`, so an activity dated exactly on `openingDate` belongs to
        the opening balance, not the period's flows; an activity on
        `closingDate` is in the period. (A record-selection endpoint such as a
        future transactions list uses an inclusive `[from, to]` range instead —
        the two conventions are named differently on purpose.) A cash flow on
        `closingDate` also weighs on `ttwror` as opening capital does, as the
        time-weighted return has no sub-period after the final day to neutralise
        it against.
      parameters:
        - name: openingDate
          in: query
          required: true
          description: |
            The opening valuation date. `openingValue` equals
            `GET .../holdings?date={openingDate}`'s `totalAssets`.
          schema:
            type: string
            format: date
        - name: closingDate
          in: query
          required: false
          description: |
            The closing valuation date (default: today). `closingValue` equals
            `GET .../holdings?date={closingDate}`'s `totalAssets`. Must be
            strictly after `openingDate`; an empty or inverted range is rejected
            `400 invalid-range`. Future dates are accepted and value at the last
            known prices; `ttwror` stops at today, which the response states as
            `timeWeightedUntil`.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/ReportingCurrency"
        - name: costMethod
          in: query
          required: false
          description: |
            The cost basis method used to split capital gains into realized and
            unrealized (default: `fifo`). Echoed in the response.
          schema:
            type: string
            enum: [fifo, moving-average]
            default: fifo
      responses:
        "200":
          description: The performance over the interval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Performance"
              examples:
                default:
                  value:
                    openingDate: "2024-01-01"
                    closingDate: "2024-12-31"
                    timeWeightedUntil: "2024-12-31"
                    reportingCurrency: EUR
                    costMethod: fifo
                    ttwror: 0.0723
                    irr: 0.0685
                    breakdown:
                      openingValue: { value: 100000, currency: EUR }
                      unrealizedCapitalGains: { value: 4200, currency: EUR }
                      realizedCapitalGains: { value: 1500, currency: EUR }
                      income: { value: 900, currency: EUR }
                      fees: { value: -120, currency: EUR }
                      taxes: { value: -300, currency: EUR }
                      currencyGains: { value: 210, currency: EUR }
                      netDeposits: { value: 5000, currency: EUR }
                      closingValue: { value: 111390, currency: EUR }
                    fxWarnings: []
                    fxStaleRates: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/performance/instruments:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listInstrumentPerformance
      tags: [Performance]
      summary: The performance report, broken down by instrument
      description: |
        Per-instrument return, valuation, gains, income, expenses and risk over
        the same interval the aggregate `GET .../performance` covers, in the
        reporting currency. Items are sorted by name, then by `uuid` for
        instruments of the same name.

        **Which instruments appear.** Every instrument the interval touched:
        any transaction inside it, or a non-zero position at either end. A
        position sold during the period therefore stays in, with `shares: 0` and
        a zero `closingValue` but real `realizedCapitalGains`, dividends and
        fees — dropping it would silently erase part of the period's
        performance. An instrument never held and never traded does not appear.

        **Cost.** `timeWeighted` and `risk` are backed by a full daily valuation
        series per instrument; every other group is a cheap linear pass. Use
        `?metrics=` to leave that series unbuilt. Asking for `timeWeighted` and
        `risk` together costs no more than asking for either, as they share one
        series. A request for all groups over every instrument of a large file
        with a long interval is slow; there is no pagination.

        **Matching the aggregate report.** Capital gains match the aggregate
        endpoint with `taxesAndFees=excluded`, its fees and taxes being separate
        terms there. The rows still do not add up to it: cash accounts, account
        fees and fees on transfers belong to no instrument.

        **Signs.** Every money field here is a magnitude: `fees` is the sum of
        the fees charged and is positive. Only fields that are terms of a
        reconciling sum are signed, which is why the aggregate endpoint's
        `breakdown.fees` is negative and this one is not — that breakdown has to
        add up by plain addition, and this resource publishes no such sum.

        `openingDate` and `closingDate` are valuation snapshot dates, not a
        record range, exactly as on the aggregate endpoint.
      parameters:
        - $ref: "#/components/parameters/OpeningDate"
        - $ref: "#/components/parameters/ClosingDate"
        - $ref: "#/components/parameters/ReportingCurrency"
        - $ref: "#/components/parameters/InstrumentCostMethod"
        - $ref: "#/components/parameters/TaxesAndFees"
        - $ref: "#/components/parameters/Metrics"
      responses:
        "200":
          description: The per-instrument performance over the interval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InstrumentPerformanceContext"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/InstrumentPerformance"
              examples:
                default:
                  value:
                    openingDate: "2025-01-01"
                    closingDate: "2025-12-31"
                    timeWeightedUntil: "2025-12-31"
                    reportingCurrency: EUR
                    costMethod: fifo
                    taxesAndFees: included
                    metrics:
                      [valuation, gains, income, expenses, moneyWeighted, timeWeighted, risk]
                    fxWarnings: []
                    fxStaleRates: []
                    items:
                      - uuid: 5c1a0b7e-3d4f-4a2b-9c8e-1f0a2b3c4d5e
                        name: iShares Core MSCI World
                        currencyCode: USD
                        valuation:
                          shares: 152.5
                          openingValue: { value: 15200, currency: EUR }
                          closingValue: { value: 18432.1, currency: EUR }
                          periodCostBasis: { value: 16218.9, currency: EUR }
                        gains:
                          realizedCapitalGains: { value: 0, currency: EUR }
                          realizedCurrencyComponent: { value: 0, currency: EUR }
                          unrealizedCapitalGains: { value: 2213.2, currency: EUR }
                          unrealizedCurrencyComponent: { value: 410, currency: EUR }
                        income:
                          dividends: { value: 312.4, currency: EUR }
                          dividendCount: 4
                          lastDividend: "2025-11-14"
                        expenses:
                          fees: { value: 18.9, currency: EUR }
                          taxes: { value: 74.2, currency: EUR }
                        moneyWeighted: { irr: 0.0755 }
                        timeWeighted: { ttwror: 0.0812, ttwrorAnnualized: 0.0395 }
                        risk:
                          volatility: 0.142
                          semiVolatility: 0.098
                          maxDrawdown: 0.231
                          longestDrawdownDays: 412
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
