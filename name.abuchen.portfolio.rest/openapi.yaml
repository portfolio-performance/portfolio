  /v1/files/{file}/instruments/{uuid}/prices:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: listInstrumentPrices
      tags: [Instruments]
      summary: The stored price history of one instrument
      description: |
        The quotes of one instrument as the application holds them, oldest first
        and the newest quote last - the series the price chart draws and the
        positions are valued from. An instrument record carries no price and a
        holding names only the single price its own valuation rests on, so this
        is the only way to ask how a series moved.

        The list includes the instrument's latest quote even when a feed fetched
        it and it was never stored as history, because that is the quote a
        valuation rests on. There is no `order`: pages run forward only, so a
        caller after the recent end of a long series narrows `from` instead of
        walking everything. An instrument without a single stored price answers
        with an empty list, not an error.
      parameters:
        - name: from
          in: query
          required: false
          description: |
            First day of the window, inclusive (YYYY-MM-DD). Without it, no lower
            bound.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: |
            Last day of the window, inclusive (YYYY-MM-DD). Without it, no upper
            bound. Must not be before `from`.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The prices of the instrument, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [instrument, instrumentName, count, items]
                properties:
                  instrument:
                    type: string
                    description: The instrument's UUID, as asked for.
                  instrumentName:
                    type: string
                    description: The instrument's name.
                  currencyCode:
                    type: string
                    description: |
                      The instrument's trading currency. Absent for a
                      currency-less series such as an index, whose values are
                      plain numbers.
                  count:
                    type: integer
                    description: |
                      How many prices the window holds in all, across every page.
                  firstDate:
                    type: string
                    format: date
                    description: |
                      The date of the oldest price of the window. Absent when the
                      window holds none.
                  lastDate:
                    type: string
                    format: date
                    description: |
                      The date of the newest price of the window, and so the date
                      a valuation at or after it rests on. Absent when the window
                      holds none.
                  page:
                    $ref: "#/components/schemas/Page"
                  items:
                    type: array
                    items:
                      type: object
                      required: [date, value]
                      properties:
                        date:
                          type: string
                          format: date
                          description: |
                            The day the quote is for. At most one price per day is
                            stored, so the day alone names an entry of the series.
                        value:
                          type: number
                          description: |
                            The quote, in the instrument's trading currency.
                        cursor:
                          type: string
                          description: |
                            Send as `cursor` to continue after this price. Only on
                            a paged request.
              examples:
                default:
                  value:
                    instrument: 8a1e0c4b-2f5d-4e6a-b1c3-7d9f0a2e4c68
                    instrumentName: Apple Inc.
                    currencyCode: USD
                    count: 3
                    firstDate: "2026-07-15"
                    lastDate: "2026-07-17"
                    page:
                      limit: 2
                      total: 3
                      nextCursor: "c.p2026-07-16.QA"
                    items:
                      - date: "2026-07-15"
                        value: 108.2
                        cursor: "c.p2026-07-15.QA"
                      - date: "2026-07-16"
                        value: 112.4
                        cursor: "c.p2026-07-16.QA"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/quotes/update:
    parameters:
      - $ref: "#/components/parameters/File"
    post:
      operationId: updateQuotes
      tags: [Instruments]
      summary: Start the application's own price update, for a part of the file
      description: |
        Not a price of the caller's own: this starts the same job the
        application's *Update quotes* menu item starts. Every instrument keeps
        the feed the user gave it, the job runs inside the application with its
        own progress dialog and its own error reporting, and the application is
        what marks the file unsaved as quotes arrive. What this operation settles
        is the scope - and, like every change of this API, it is asked about
        before anything begins. It is also the only operation here that reaches
        out over the network, which is the plain reason for asking.

        `scope` chooses the part of the file. `all` (the default) is the whole
        file the way the plain menu item takes it, indices and exchange rates
        along with the instruments. `active` is every instrument not set to
        retired. `instrument` is the single one named by `instrument`. `watchlist`
        is the instruments of the list named by `watchlist`. Holdings are
        deliberately not a scope of their own: the menu's version of that resolves
        holdings through a valuation, which no part of this operation has a use
        for.

        What the answer describes is what was **started**, not what arrived: the
        job runs on past this response. Either watch the application's progress
        dialog, or read `/v1/files/{file}/instruments/{uuid}/prices` afterwards to
        see what came in. No feed is set up by this operation, and none is
        fetched for an instrument whose quote is maintained by hand.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: |
                All of it optional: a call that sends nothing refreshes the whole
                file, which is what the plain menu item does. A field this schema
                does not have is a `400` naming it.
              properties:
                scope:
                  type: string
                  enum: [all, active, instrument, watchlist]
                  description: |
                    Which part of the file to refresh. Defaults to `all`.
                instrument:
                  type: string
                  description: |
                    The uuid of the one instrument to refresh. Read only when
                    `scope` is `instrument`; missing there, or a uuid the file
                    does not have, is a `400` on this field.
                watchlist:
                  type: string
                  description: |
                    The name of a watchlist, spelled as the file names it. Read
                    only when `scope` is `watchlist`; missing there, or a name the
                    file does not have, is a `400` on this field.
      responses:
        "202":
          description: |
            The update is running in the application - 202 because the job outlives
            this answer. `securities` counts what was handed to the job and
            `withQuoteFeed` how many of those a feed could reach at all: an
            instrument with a manually maintained quote is in the first count and
            not the second, which is the application's own test rather than a
            refusal. Whether a quote arrived is the job's news, and it is told in
            the application.
          headers:
            X-Portfolio-Changed:
              description: |
                Whether the file can end up holding unsaved changes: `false` when
                nothing in scope has a feed that could deliver anything, `true`
                otherwise - and `true` for `all`, whose job covers exchange rates
                and indices too. The job marks the file dirty itself as quotes
                arrive; nothing reaches the disk either way.
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                type: object
                description: What was started, as far as that is knowable from here.
                properties:
                  scope:
                    type: string
                    description: The scope as it was understood, `all` when none was given.
                  securities:
                    type: integer
                    description: How many instruments the job was given.
                  withQuoteFeed:
                    type: integer
                    description: |
                      How many of those a feed could reach. `0` with a nonzero
                      `securities` means the update will skip every one of them.
                  started:
                    type: boolean
                    description: Always `true`; a start that did not happen is an error, not this answer.
                  savedToDisk:
                    type: boolean
                    description: Always `false`: the file holds unsaved changes, and saving stays the user's.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/cash-accounts:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: listCashAccounts
      tags: [Cash accounts]
      summary: List the cash accounts in a file
      responses:
        "200":
          description: The cash accounts in the file
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CashAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: createCashAccount
      tags: [Cash accounts]
      summary: Add a cash account to the file
      description: |
        A new account of one currency, and the money end of every structure a
        caller might build. `currencyCode` left out takes the file's own base
        currency; given, it must be a currency the file already moves in -
        prices and reports read their rates from series the file holds - or the
        call is refused as `unknown-currency`.

        A name the file already carries, in the very same currency, is refused
        as `409 name-taken`: an account has a uuid, so two of one name could be
        told apart, but only by a caller that went and looked. Another currency
        makes another account, and that pair is ordinary.

        The user is asked before anything is created, naming the account and
        its currency: `403 write-declined`, `423 write-unanswered`, `429
        write-pending`. Nothing is saved to disk, and there is no undo - this
        API creates accounts and never removes one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: What the account is to be called.
                currencyCode:
                  type: string
                  description: |
                    The currency as an ISO 4217 code, e.g. `EUR`. Optional:
                    left out it is the file's base currency.
                note:
                  type: string
                  description: Free text shown with the account.
      responses:
        "201":
          description: |
            The account as it now stands, with its new `uuid` - which every
            other account tool addresses it by - and `created: true`.
          headers:
            X-Portfolio-Changed:
              description: |
                Always `true`: an account that did not exist before is a change,
                and the file then has unsaved changes.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CashAccount"
                  - type: object
                    properties:
                      created:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/WritePending"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/{file}/cash-accounts/{uuid}:
    parameters:
      - $ref: "#/components/parameters/File"
      - $ref: "#/components/parameters/Uuid"
    get:
      operationId: getCashAccount
      tags: [Cash accounts]
      summary: Read a single cash account
      responses:
        "200":
          description: The cash account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashAccount"
              examples:
                default:
                  value:
                    uuid: c4b2a1e0-3f6d-4a2e-8b1c-5d7f9a0e2c46
                    name: Cash Account
                    currencyCode: EUR
                    note: Settlement account
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
